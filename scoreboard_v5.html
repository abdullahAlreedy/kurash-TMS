<!DOCTYPE html>
<html lang="en">
<head>
  <meta charSet="UTF-8" />
  <title>Kurash Scoreboard v5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --------------------------------------------------
    // Constants
    // --------------------------------------------------
    const MEN_FIGHT_SECONDS = 4 * 60;   // 4 minutes
    const WOMEN_FIGHT_SECONDS = 3 * 60; // 3 minutes

    // --------------------------------------------------
    // Helpers
    // --------------------------------------------------
    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function adjustTimer(setter, deltaSeconds) {
      setter((prev) => Math.max(0, prev + deltaSeconds * 1000));
    }

    // Demo data for offline mode
    const demoPlayers = [
      { id: "KSA-EXAMPLE1-81N", name: "Blue Example", country: "KSA", sex: "M" },
      { id: "UZB-EXAMPLE2-81N", name: "Green Example", country: "UZB", sex: "M" }
    ];

    const demoSchedule = {
      bouts: [
        {
          boutNo: 1,
          gillam: "Gillam A",
          sex: "M",
          weight: "-81",
          blueId: "KSA-EXAMPLE1-81N",
          greenId: "UZB-EXAMPLE2-81N",
          stage: "RR",
          isElimination: false,
          groupKey: "M|-81",
          localId: 1
        }
      ],
      assignments: [
        { boutNo: 1, mainRef: "Main Ref Demo", judge1: "Judge 1 Demo", judge2: "Judge 2 Demo" }
      ],
      bracketLinks: {}
    };

    // --------------------------------------------------
    // CountryFlag component (expects flags/{code}_m.jpg or .png)
    // --------------------------------------------------
    function CountryFlag({ code }) {
      const upper = (code || "").toUpperCase();
      const baseClass =
        "w-10 h-6 md:w-14 md:h-8 rounded border border-slate-300 shadow-inner object-cover";

      if (!upper) {
        return <div className={baseClass + " bg-slate-700"} aria-label="flag" />;
      }

      const lower = upper.toLowerCase();
      const jpgPath = `flags/${lower}_m.jpg`;
      const pngPath = `flags/${lower}_m.png`;

      const handleError = (e) => {
        if (e.target.src.includes(".jpg")) {
          e.target.src = pngPath;
        } else {
          e.target.style.display = "none";
        }
      };

      return (
        <img
          src={jpgPath}
          alt={`${upper} flag`}
          className={baseClass}
          onError={handleError}
        />
      );
    }

    // --------------------------------------------------
    // Scoring logic (Kurash style)
    // --------------------------------------------------
    function computeScores(events) {
      const base = {
        blue: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
        green: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
        halalWinner: null,
        lastScoreSide: null,
        lastPenaltySide: null
      };

      function sideKey(s) {
        return s === "blue" ? "blue" : "green";
      }

      if (!Array.isArray(events)) {
        return {
          blue: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
          green: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
          halalWinner: null,
          lastScoreSide: null,
          lastPenaltySide: null
        };
      }

      for (const ev of events) {
        const s = sideKey(ev.side);
        const o = s === "blue" ? "green" : "blue";

        // Scores: H / YO / CH
        if (ev.type === "H" || ev.type === "YO" || ev.type === "CH") {
          if (ev.type === "H") {
            base[s].H += 1;
            if (!base.halalWinner) base.halalWinner = s;
          } else if (ev.type === "YO") {
            base[s].YO += 1;
          } else if (ev.type === "CH") {
            base[s].CH += 1;
          }

          // Convert 2 YO → 1 H
          while (base[s].YO >= 2) {
            base[s].YO -= 2;
            base[s].H += 1;
            if (!base.halalWinner) base.halalWinner = s;
          }

          base.lastScoreSide = s;
          continue;
        }

        // Penalties: T / D / G
        if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
          const lvl = ev.type === "T" ? 1 : ev.type === "D" ? 2 : 3;

          if (lvl > base[s].penaltyLevel) {
            base[s].penaltyLevel = lvl;
            base.lastPenaltySide = s;
            base.lastScoreSide = o;

            // Level G = halal win for opponent
            if (lvl === 3 && !base.halalWinner) {
              base.halalWinner = o;
            }
          }
        }
      }

      return {
        blue: {
          H: base.blue.H,
          YO: base.blue.YO,
          CH: base.blue.CH,
          penaltyLevel: base.blue.penaltyLevel
        },
        green: {
          H: base.green.H,
          YO: base.green.YO,
          CH: base.green.CH,
          penaltyLevel: base.green.penaltyLevel
        },
        halalWinner: base.halalWinner,
        lastScoreSide: base.lastScoreSide,
        lastPenaltySide: base.lastPenaltySide
      };
    }

    function decideWinner(state, isTimeUp) {
      if (!state) return null;

      if (state.halalWinner) return state.halalWinner;

      const b = state.blue;
      const g = state.green;

      if (b.H !== g.H) return b.H > g.H ? "blue" : "green";
      if (b.YO !== g.YO) return b.YO > g.YO ? "blue" : "green";
      if (b.CH !== g.CH) return b.CH > g.CH ? "blue" : "green";

      if (!isTimeUp) return null;

      if (b.penaltyLevel !== g.penaltyLevel) {
        return b.penaltyLevel > g.penaltyLevel ? "green" : "blue";
      }

      if (state.lastPenaltySide) {
        return state.lastPenaltySide === "blue" ? "green" : "blue";
      }

      if (state.lastScoreSide) {
        return state.lastScoreSide;
      }

      return null;
    }

    // --------------------------------------------------
    // Audio helpers
    // --------------------------------------------------
    function ensureAudioContext(audioCtxRef) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtxRef.current) {
        audioCtxRef.current = new AC();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === "suspended") {
        ctx.resume();
      }
      return ctx;
    }

    function playBell(audioCtxRef) {
      try {
        const ctx = ensureAudioContext(audioCtxRef);
        if (!ctx) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(1000, ctx.currentTime);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + 0.1);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 3);
      } catch (e) {}
    }

    function playHalfPing(audioCtxRef) {
      try {
        const ctx = ensureAudioContext(audioCtxRef);
        if (!ctx) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(600, ctx.currentTime);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 3);
      } catch (e) {}
    }

    // --------------------------------------------------
    // Scoreboard App
    // --------------------------------------------------
    function App() {
      const [schedule, setSchedule] = useState(demoSchedule);
      const [players, setPlayers] = useState(demoPlayers);

      // Server sync (v2 style)
      const [serverUrl, setServerUrl] = useState("");
      const [serverStatus, setServerStatus] = useState("idle");
      const [serverMsg, setServerMsg] = useState("");
      const [gillams, setGillams] = useState([]);
      const [selectedGillam, setSelectedGillam] = useState("");

      function normalizedBaseUrl() {
        const raw = (serverUrl || "").trim();
        if (!raw) return null;
        return raw.replace(/\/+$/, "");
      }

      async function testConnection() {
        const base = normalizedBaseUrl();
        if (!base) {
          alert("Enter server URL first.");
          return;
        }
        try {
          setServerStatus("loading");
          setServerMsg("Testing connection...");
          const res = await fetch(base + "/api/ping");
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Ping failed: HTTP " + res.status);
            return;
          }
          await res.json().catch(() => ({}));
          setServerStatus("ok");
          setServerMsg("Server is online.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Cannot reach server.");
        }
      }

      async function loadGillamsFromServer() {
        const base = normalizedBaseUrl();
        if (!base) {
          alert("Enter server URL first.");
          return;
        }
        try {
          setServerStatus("loading");
          setServerMsg("Loading Gillams...");
          const res = await fetch(base + "/api/gillams");
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Gillams failed: HTTP " + res.status);
            return;
          }
          const list = await res.json();
          if (!Array.isArray(list) || !list.length) {
            setGillams([]);
            setSelectedGillam("");
            setServerStatus("idle");
            setServerMsg("No Gillams returned.");
            return;
          }
          setGillams(list);
          setSelectedGillam("");
          setServerStatus("ok");
          setServerMsg("Gillams loaded.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Error loading Gillams.");
        }
      }

      async function loadBoutsForGillam() {
        const base = normalizedBaseUrl();
        if (!base) {
          alert("Enter server URL first.");
          return;
        }
        if (!selectedGillam) {
          alert("Select a Gillam first.");
          return;
        }
        try {
          setServerStatus("loading");
          setServerMsg("Loading bouts...");
          const res = await fetch(
            base + "/api/gillam/" + encodeURIComponent(selectedGillam) + "/bouts"
          );
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Bouts failed: HTTP " + res.status);
            return;
          }
          const bouts = await res.json();
          const safeBouts = Array.isArray(bouts) ? bouts : [];
          setSchedule((prev) => ({
            ...prev,
            bouts: safeBouts,
            assignments: prev?.assignments || [],
            bracketLinks: prev?.bracketLinks || {}
          }));

          if (!safeBouts.length) {
            setActiveBoutNo(null);
            setBoutMeta({});
            setSbEvents([]);
            setTimerRunning(false);
            setServerStatus("idle");
            setServerMsg("No bouts for this Gillam.");
            return;
          }

          const firstBoutNo = safeBouts[0].boutNo;
          setActiveBoutNo(firstBoutNo);
          setBoutMeta({});
          setSbEvents([]);
          setTimerRunning(false);
          loadBoutDetails(firstBoutNo);
          setServerStatus("ok");
          setServerMsg("Bouts loaded.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Error loading bouts.");
        }
      }

      async function loadBoutDetails(boutNo) {
        const base = normalizedBaseUrl();
        if (!base || boutNo == null) return;
        try {
          setServerStatus("loading");
          setServerMsg("Loading bout #" + boutNo + "...");
          const res = await fetch(base + "/api/bout/" + boutNo);
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Bout detail failed: HTTP " + res.status);
            return;
          }
          const data = await res.json();
          if (data.blue || data.green) {
            setPlayers((prevPlayers) => {
              const map = new Map(prevPlayers.map((p) => [p.id, p]));
              if (data.blue && data.blue.id) map.set(data.blue.id, data.blue);
              if (data.green && data.green.id) map.set(data.green.id, data.green);
              return Array.from(map.values());
            });
          }
          setServerStatus("ok");
          setServerMsg("Bout #" + boutNo + " loaded.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Error loading bout details.");
        }
      }

      async function sendResultToServer(boutNo, payload) {
        const base = normalizedBaseUrl();
        if (!base) return;
        try {
          const url = base + "/api/bout/" + boutNo + "/save";
          await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          console.log("Result sent to server for bout", boutNo);
        } catch (err) {
          console.error("Failed to send result to server:", err);
        }
      }

      const [activeBoutNo, setActiveBoutNo] = useState(
        demoSchedule.bouts[0]?.boutNo || null
      );
      const [boutMeta, setBoutMeta] = useState({});
      const [sbEvents, setSbEvents] = useState([]);
      const [timerMs, setTimerMs] = useState(0);
      const [timerRunning, setTimerRunning] = useState(false);
      const [showMeta, setShowMeta] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);

      const sbContainerRef = useRef(null);
      const audioCtxRef = useRef(null);
      const initialFightMsRef = useRef(0);
      const halfPingDoneRef = useRef(false);
      const sbComputedRef = useRef(null);

      const sbComputed = useMemo(
        () => computeScores(sbEvents),
        [sbEvents]
      );

      useEffect(() => {
        sbComputedRef.current = sbComputed;
      }, [sbComputed]);

      useEffect(() => {
        const liveWinner = decideWinner(sbComputed, false);
        if (liveWinner && timerRunning) {
          setTimerRunning(false);
        }
      }, [sbComputed, timerRunning]);

      // Timer effect
      useEffect(() => {
        if (!timerRunning) return;
        const id = setInterval(() => {
          setTimerMs((ms) => {
            if (ms <= 1000) {
              if (ms > 0) {
                playBell(audioCtxRef);
              }
              setTimerRunning(false);
              return 0;
            }

            const newMs = ms - 1000;
            const initial = initialFightMsRef.current || 0;
            const halfMs = initial / 2;

            if (
              !halfPingDoneRef.current &&
              initial > 0 &&
              ms > halfMs &&
              newMs <= halfMs
            ) {
              const scores = sbComputedRef.current;
              if (scores) {
                const sides = ["blue", "green"];
                const allZero = sides.every((side) => {
                  const s = scores[side];
                  return (
                    s &&
                    s.H === 0 &&
                    s.YO === 0 &&
                    s.CH === 0 &&
                    s.penaltyLevel === 0
                  );
                });
                if (allZero) {
                  playHalfPing(audioCtxRef);
                  halfPingDoneRef.current = true;
                  setTimerRunning(false);
                }
              }
            }

            return newMs;
          });
        }, 1000);
        return () => clearInterval(id);
      }, [timerRunning]);

      // Fullscreen tracking
      useEffect(() => {
        function handleFsChange() {
          setIsFullscreen(!!document.fullscreenElement);
        }
        document.addEventListener("fullscreenchange", handleFsChange);
        return () =>
          document.removeEventListener("fullscreenchange", handleFsChange);
      }, []);

      function enterFullscreen() {
        if (sbContainerRef.current && !document.fullscreenElement) {
          sbContainerRef.current.requestFullscreen().catch(() => {});
        }
      }

      function exitFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      }

      const playersIndex = useMemo(
        () => new Map(players.map((p) => [p.id, p])),
        [players]
      );

      function metaForBout(no) {
        return boutMeta[no] || null;
      }

      function selectBoutForScore(no) {
        if (!schedule) return;
        setActiveBoutNo(no);

        const bout = schedule.bouts.find((b) => b.boutNo === no);
        let initialMs = 0;

        if (bout) {
          const A = playersIndex.get(bout.blueId);
          const G = playersIndex.get(bout.greenId);
          const sex = bout.sex || (A?.sex || G?.sex || "M");
          const baseSec = sex === "F" ? WOMEN_FIGHT_SECONDS : MEN_FIGHT_SECONDS;
          initialMs = baseSec * 1000;
        }

        const meta = boutMeta[no];
        if (meta) {
          setSbEvents(meta.events || []);
          if (meta.durationSec != null) {
            setTimerMs(meta.durationSec * 1000);
            initialFightMsRef.current = initialMs || meta.durationSec * 1000;
          } else {
            setTimerMs(initialMs);
            initialFightMsRef.current = initialMs;
          }
        } else {
          setSbEvents([]);
          setTimerMs(initialMs);
          initialFightMsRef.current = initialMs;
        }
        setTimerRunning(false);
        setShowMeta(false);
        halfPingDoneRef.current = false;
      }

      // Re-init when schedule or active bout changes
      useEffect(() => {
        if (!activeBoutNo || !schedule) return;
        selectBoutForScore(activeBoutNo);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [activeBoutNo, schedule]);

      function addEvent(side, type) {
        if (!activeBoutNo || !schedule) return;
        setSbEvents((prev) => [...prev, { side, type, atMs: timerMs }]);
      }

      function removeLastEvent(side, type) {
        setSbEvents((prev) => {
          const next = prev.slice();
          for (let i = next.length - 1; i >= 0; i--) {
            const ev = next[i];
            if (ev.side === side && ev.type === type) {
              next.splice(i, 1);
              break;
            }
          }
          return next;
        });
      }

      function handleScoreButton(side, type, isRightClick, canAdd, event) {
        if (event) event.preventDefault();
        if (isRightClick) {
          removeLastEvent(side, type);
        } else {
          if (!canAdd) return;
          addEvent(side, type);
        }
      }

      function saveResultToBout() {
        if (!activeBoutNo || !schedule) return;
        const scores = computeScores(sbEvents);
        const isTimeUp = timerMs === 0;
        const winnerSide = decideWinner(
          scores,
          isTimeUp || !!scores.halalWinner
        );
        if (!winnerSide) {
          alert(
            "No clear winner yet according to current scores and penalties."
          );
          return;
        }
        const durationMs = timerMs;

        setBoutMeta((prev) => ({
          ...prev,
          [activeBoutNo]: {
            events: sbEvents,
            durationSec: Math.floor(durationMs / 1000),
            winner: winnerSide
          }
        }));

        const bluePenalties = { T: 0, D: 0, G: 0 };
        const greenPenalties = { T: 0, D: 0, G: 0 };
        for (const ev of sbEvents) {
          if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
            const obj = ev.side === "blue" ? bluePenalties : greenPenalties;
            obj[ev.type] += 1;
          }
        }

        const metaEvents = sbEvents.map((ev) => ({
          timeSec: Math.floor(ev.atMs / 1000),
          timeStr: formatTime(ev.atMs),
          type: ev.type,
          side: ev.side,
          text: (ev.side === "blue" ? "BLUE " : "GREEN ") + ev.type
        }));

        const payload = {
          winner: winnerSide,
          blueScore: {
            H: scores.blue.H,
            YO: scores.blue.YO,
            CH: scores.blue.CH
          },
          greenScore: {
            H: scores.green.H,
            YO: scores.green.YO,
            CH: scores.green.CH
          },
          bluePenalties,
          greenPenalties,
          meta: metaEvents,
          durationMs
        };

        sendResultToServer(activeBoutNo, payload);

        alert("Result stored for bout #" + activeBoutNo);
      }

      const bouts = schedule?.bouts || [];
      const currentIdx = bouts.findIndex((b) => b.boutNo === activeBoutNo);

      function goPrev() {
        if (!bouts.length) return;
        const target = currentIdx <= 0 ? bouts[0] : bouts[currentIdx - 1];
        if (!target) return;
        selectBoutForScore(target.boutNo);
        if (serverUrl) {
          loadBoutDetails(target.boutNo);
        }
      }

      function goNext() {
        if (!bouts.length) return;
        const target =
          currentIdx === -1 || currentIdx >= bouts.length - 1
            ? bouts[bouts.length - 1]
            : bouts[currentIdx + 1];
        if (!target) return;
        selectBoutForScore(target.boutNo);
        if (serverUrl) {
          loadBoutDetails(target.boutNo);
        }
      }

      const timerColorClass = timerRunning ? "text-white" : "text-red-500";

      if (!schedule || !bouts.length) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-b from-slate-950 via-slate-900 to-black">
            <div className="text-center space-y-2">
              <div className="text-lg font-semibold">Kurash Scoreboard</div>
              <div className="text-slate-400 text-sm">
                No bouts loaded. Use server controls or demo data.
              </div>
            </div>
          </div>
        );
      }

      const bout =
        activeBoutNo != null
          ? bouts.find((b) => b.boutNo === activeBoutNo) || bouts[0]
          : bouts[0];

      const A = bout ? playersIndex.get(bout.blueId) : null;
      const G = bout ? playersIndex.get(bout.greenId) : null;
      const meta = metaForBout(bout.boutNo) || {};

      // Referee assignment for this bout (for footer display)
      const assignments = schedule?.assignments || [];
      const assignment =
        bout && assignments.length
          ? assignments.find((a) => a.boutNo === bout.boutNo) || null
          : null;

      const sexFromBout = bout.sex || (A?.sex || G?.sex || "M");
      const sexForLabel = sexFromBout === "F" ? "Women" : "Men";
      const baseSeconds =
        sexFromBout === "F" ? WOMEN_FIGHT_SECONDS : MEN_FIGHT_SECONDS;

      const blueCode = (A?.country || "").toUpperCase().slice(0, 3);
      const greenCode = (G?.country || "").toUpperCase().slice(0, 3);

      const scoreLabelClass = isFullscreen
        ? "font-bold text-xl md:text-2xl"
        : "font-bold text-base md:text-lg";
      const scoreValueClass = isFullscreen
        ? "font-mono text-4xl md:text-5xl"
        : "font-mono text-2xl md:text-3xl";

      const penLabelClass = isFullscreen
        ? "font-bold text-lg md:text-xl"
        : "font-bold text-sm md:text-base";

      const bluePenLevel = sbComputed.blue.penaltyLevel || 0;
      const greenPenLevel = sbComputed.green.penaltyLevel || 0;

      const blueTActive = bluePenLevel >= 1;
      const blueDActive = bluePenLevel >= 2;
      const blueGActive = bluePenLevel >= 3;

      const greenTActive = greenPenLevel >= 1;
      const greenDActive = greenPenLevel >= 2;
      const greenGActive = greenPenLevel >= 3;

      const isTimeUp = timerMs === 0;
      const finalWinnerSide = decideWinner(sbComputed, isTimeUp);
      const liveWinnerSide = decideWinner(sbComputed, false);
      const endedNow = !!sbComputed.halalWinner || isTimeUp;
      const fightFinished = endedNow;

      const winnerNameLive =
        liveWinnerSide === "blue"
          ? A?.name || "Blue"
          : liveWinnerSide === "green"
          ? G?.name || "Green"
          : "-";

      const winnerNameFinal =
        finalWinnerSide === "blue"
          ? A?.name || "Blue"
          : finalWinnerSide === "green"
          ? G?.name || "Green"
          : "-";

      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 text-slate-100 flex flex-col">
          <header className="sticky top-0 z-20 bg-slate-950/70 backdrop-blur border-b border-slate-800">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              <div>
                <h1 className="text-xl font-semibold tracking-wide">
                  Kurash Scoreboard – v5
                </h1>
                <p className="text-xs text-slate-400">
                  Blue top / Green bottom • H / YO / CH • T / D / G • Timer 4/3 min
                </p>
                <p className="text-[11px] text-slate-500 mt-1">
                  Developed by{" "}
                  <span className="font-semibold text-sky-300">
                    Dr. Abdullah Hosni Alreedy
                  </span>
                </p>
              </div>
              <div className="flex flex-col items-end gap-1 text-xs">
                <div>
                  Bout:{" "}
                  <span className="font-mono font-semibold">
                    #{bout.boutNo}
                  </span>
                </div>
                <div className="text-slate-400">
                  {bout.gillam} • {sexForLabel} {bout.weight}{" "}
                  ({bout.stage || "RR"})
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 py-4 space-y-4 flex-1 w-full">
            {/* Server URL + Test */}
            <div className="flex flex-wrap items-center gap-3 text-xs md:text-sm mb-2">
              <label className="text-slate-200">Server URL (optional):</label>
              <input
                type="text"
                className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1 min-w-[220px]"
                placeholder="http://localhost:3000"
                value={serverUrl}
                onChange={(e) => setServerUrl(e.target.value)}
              />
              <button
                onClick={testConnection}
                className="px-3 py-1 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700"
              >
                Test
              </button>
              <span className="text-xs">
                {serverStatus === "loading" && (
                  <span className="text-sky-300">
                    ⏳ {serverMsg || "Working..."}
                  </span>
                )}
                {serverStatus === "ok" && (
                  <span className="text-emerald-400">
                    ✅ {serverMsg || "Server OK."}
                  </span>
                )}
                {serverStatus === "error" && (
                  <span className="text-red-400">
                    ❌ {serverMsg || "Error talking to server."}
                  </span>
                )}
                {serverStatus === "idle" && !serverMsg && (
                  <span className="text-slate-500">
                    Leave empty for offline mode.
                  </span>
                )}
                {serverStatus === "idle" && serverMsg && (
                  <span className="text-slate-400">{serverMsg}</span>
                )}
              </span>
            </div>

            {/* Gillam + Bout selector */}
            <div className="flex flex-wrap items-center gap-3 text-xs md:text-sm">
              <label className="text-slate-200">Gillam:</label>
              <select
                className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 min-w-[160px]"
                value={selectedGillam}
                onChange={(e) => setSelectedGillam(e.target.value)}
              >
                <option value="">-- load from server --</option>
                {gillams.map((g) => (
                  <option key={g} value={g}>
                    {g}
                  </option>
                ))}
              </select>
              <button
                onClick={loadGillamsFromServer}
                className="px-3 py-1 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700"
              >
                Load Gillams
              </button>

              <label className="text-slate-200">Bout:</label>
              <select
                className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 min-w-[220px]"
                value={activeBoutNo || ""}
                onChange={(e) => {
                  const v = e.target.value ? Number(e.target.value) : null;
                  if (!v) {
                    selectBoutForScore(null);
                    return;
                  }
                  selectBoutForScore(v);
                  if (serverUrl) {
                    loadBoutDetails(v);
                  }
                }}
              >
                <option value="">-- choose --</option>
                {bouts.map((b) => {
                  const A = playersIndex.get(b.blueId);
                  const G = playersIndex.get(b.greenId);
                  const sexLabel = b.sex === "F" ? "Women" : "Men";
                  const meta = metaForBout(b.boutNo);
                  const finished = !!(meta && meta.winner);
                  return (
                    <option
                      key={b.boutNo}
                      value={b.boutNo}
                      className={finished ? "text-slate-500" : "text-slate-100"}
                    >
                      {finished ? "✓ " : ""}
                      #{b.boutNo} | {b.gillam} | {sexLabel} {b.weight} |{" "}
                      {A?.name || "Blue"} vs {G?.name || "Green"}
                      {finished ? " (finished)" : ""}
                    </option>
                  );
                })}
              </select>

              <button
                onClick={goPrev}
                className="px-3 py-1 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700"
              >
                Previous
              </button>
              <button
                onClick={goNext}
                className="px-3 py-1 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700"
              >
                Next
              </button>

              <button
                onClick={loadBoutsForGillam}
                className="px-3 py-1 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700"
              >
                Load Bouts
              </button>

              <span className="text-slate-400">
                1) Test server, 2) Load Gillams, 3) Choose Gillam and Load Bouts.
              </span>
            </div>

            {/* SCOREBOARD CONTAINER */}
            <div
              ref={sbContainerRef}
              className={
                isFullscreen
                  ? "fixed inset-0 z-50 bg-black p-4 md:p-8 overflow-auto flex flex-col gap-4"
                  : "space-y-4"
              }
            >
              {/* TIMER BAR */}
              <div
                className={
                  isFullscreen
                    ? "flex-1 flex items-center justify-center bg-black rounded-2xl border border-slate-800 px-4 py-3"
                    : "flex items-center justify-between bg-black rounded-2xl border border-slate-800 px-4 py-3"
                }
              >
                {isFullscreen ? (
                  <div className="w-full h-full flex flex-col justify-between">
                    <div className="flex items-center justify-between mb-2 px-4">
                      <div className="text-left">
                        <div className="text-xs text-yellow-400">
                          {bout.gillam}
                        </div>
                        <div className="text-sm text-yellow-300">
                          {sexForLabel} {bout.weight} ({bout.stage || ""})
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={() => setTimerRunning(true)}
                          className="px-3 py-1 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs md:text-sm"
                        >
                          Start
                        </button>
                        <button
                          onClick={() => setTimerRunning(false)}
                          className="px-3 py-1 rounded-xl bg-amber-600 hover:bg-amber-500 text-xs md:text-sm"
                        >
                          Stop
                        </button>
                        <button
                          onClick={() => {
                            const sec =
                              sexFromBout === "F"
                                ? WOMEN_FIGHT_SECONDS
                                : MEN_FIGHT_SECONDS;
                            const ms = sec * 1000;
                            setTimerMs(ms);
                            initialFightMsRef.current = ms;
                            halfPingDoneRef.current = false;
                            setTimerRunning(false);
                          }}
                          className="px-3 py-1 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs md:text-sm"
                        >
                          Reset
                        </button>
                        <button
                          onClick={() => {
                            if (document.fullscreenElement) {
                              exitFullscreen();
                            } else {
                              enterFullscreen();
                            }
                          }}
                          className="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs md:text-sm"
                        >
                          {isFullscreen ? "Exit FS" : "Fullscreen"}
                        </button>
                      </div>
                    </div>
                    <div className="flex-1 flex items-center justify-center gap-4">
                      <button
                        onClick={() => adjustTimer(setTimerMs, 1)}
                        className="px-3 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-2xl md:text-4xl leading-none"
                        title="Add 1 second"
                      >
                        ▲
                      </button>
                      <div
                        onClick={() =>
                          setTimerRunning((running) => !running)
                        }
                        title="Click to start/stop timer"
                        className={
                          "flex-1 flex items-center justify-center font-bold tabular-nums cursor-pointer " +
                          timerColorClass +
                          " text-[18vh] leading-none select-none"
                        }
                      >
                        {formatTime(timerMs)}
                      </div>
                      <button
                        onClick={() => adjustTimer(setTimerMs, -1)}
                        className="px-3 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-2xl md:text-4xl leading-none"
                        title="Subtract 1 second"
                      >
                        ▼
                      </button>
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="text-left">
                      <div className="text-xs text-yellow-400">
                        {bout.gillam}
                      </div>
                      <div className="text-sm text-yellow-300">
                        {sexForLabel} {bout.weight} ({bout.stage || ""})
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => adjustTimer(setTimerMs, 1)}
                        className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-lg leading-none"
                        title="Add 1 second"
                      >
                        ▲
                      </button>
                      <div
                        onClick={() =>
                          setTimerRunning((running) => !running)
                        }
                        title="Click to start/stop timer"
                        className={
                          "font-bold tabular-nums cursor-pointer " +
                          timerColorClass +
                          " text-5xl"
                        }
                      >
                        {formatTime(timerMs)}
                      </div>
                      <button
                        onClick={() => adjustTimer(setTimerMs, -1)}
                        className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-lg leading-none"
                        title="Subtract 1 second"
                      >
                        ▼
                      </button>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        onClick={() => setTimerRunning(true)}
                        className="px-3 py-1 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-sm"
                      >
                        Start
                      </button>
                      <button
                        onClick={() => setTimerRunning(false)}
                        className="px-3 py-1 rounded-xl bg-amber-600 hover:bg-amber-500 text-sm"
                      >
                        Stop
                      </button>
                      <button
                        onClick={() => {
                          const sec =
                            sexFromBout === "F"
                              ? WOMEN_FIGHT_SECONDS
                              : MEN_FIGHT_SECONDS;
                          const ms = sec * 1000;
                          setTimerMs(ms);
                          initialFightMsRef.current = ms;
                          halfPingDoneRef.current = false;
                          setTimerRunning(false);
                        }}
                        className="px-3 py-1 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm"
                      >
                        Reset
                      </button>
                      <button
                        onClick={() => {
                          if (document.fullscreenElement) {
                            exitFullscreen();
                          } else {
                            enterFullscreen();
                          }
                        }}
                        className="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm"
                      >
                        {isFullscreen ? "Exit Fullscreen" : "Fullscreen"}
                      </button>
                    </div>
                  </>
                )}
              </div>

              {/* BLUE PLAYER (top) */}
              <div className="flex-1 space-y-4">
                <div className="bg-sky-900/60 border border-sky-700 rounded-2xl p-4">
                  <div className="flex justify-between items-center mb-2">
                    <div className="flex items-center gap-3">
                      <span className="w-4 h-4 rounded-full bg-sky-500" />
                      <span
                        className={
                          "font-semibold " +
                          (isFullscreen ? "text-lg md:text-xl" : "")
                        }
                      >
                        {A?.name || "Blue"}
                      </span>
                    </div>
                    {fightFinished && finalWinnerSide === "blue" && (
                      <span className="px-3 py-1 rounded-full bg-emerald-500 text-black text-xs md:text-sm font-bold">
                        WINNER
                      </span>
                    )}
                  </div>
                  <div className="flex items-stretch gap-3">
                    <div className="flex-1">
                      {/* Blue penalties ABOVE scores */}
                      <div className="grid grid-cols-3 gap-2 text-center text-xs md:text-sm">
                        {["H", "YO", "CH"].map((scoreType) => {
                          const s = sbComputed.blue;
                          const cannotAdd =
                            endedNow || (scoreType === "H" && s.H >= 1);
                          const canAddScore = !cannotAdd;
                          const val =
                            scoreType === "H"
                              ? s.H
                              : scoreType === "YO"
                              ? s.YO
                              : s.CH;

                          const penKey =
                            scoreType === "H"
                              ? "G"
                              : scoreType === "YO"
                              ? "D"
                              : "T";
                          const penActive =
                            penKey === "T"
                              ? blueTActive
                              : penKey === "D"
                              ? blueDActive
                              : blueGActive;
                          const canAddPen = !endedNow;

                          return (
                            <div key={scoreType} className="flex flex-col gap-1">
                              {/* Penalty button (top) */}
                              <button
                                onClick={(e) =>
                                  handleScoreButton(
                                    "blue",
                                    penKey,
                                    false,
                                    canAddPen,
                                    e
                                  )
                                }
                                onContextMenu={(e) =>
                                  handleScoreButton(
                                    "blue",
                                    penKey,
                                    true,
                                    true,
                                    e
                                  )
                                }
                                className={
                                  "flex flex-col justify-center items-center rounded-xl py-1.5 border select-none " +
                                  (canAddPen
                                    ? "bg-slate-800 border-slate-500 hover:bg-slate-700 cursor-pointer"
                                    : "bg-slate-800/40 border-slate-700/60 text-slate-500 cursor-default")
                                }
                              >
                                <span className={penLabelClass}>{penKey}</span>
                                <div
                                  className={
                                    "mt-1 w-8 h-3 rounded-md " +
                                    (penActive
                                      ? "bg-red-400 shadow-[0_0_15px_rgba(248,113,113,1)]"
                                      : "bg-slate-500/30")
                                  }
                                />
                              </button>

                              {/* Score button (bottom) */}
                              <button
                                onClick={(e) =>
                                  handleScoreButton(
                                    "blue",
                                    scoreType,
                                    false,
                                    canAddScore,
                                    e
                                  )
                                }
                                onContextMenu={(e) =>
                                  handleScoreButton(
                                    "blue",
                                    scoreType,
                                    true,
                                    true,
                                    e
                                  )
                                }
                                className={
                                  "flex flex-col justify-center items-center rounded-xl py-3 md:py-4 border select-none " +
                                  (canAddScore
                                    ? "bg-sky-700 border-sky-500 hover:bg-sky-600 cursor-pointer"
                                    : "bg-slate-800/40 border-slate-700/60 text-slate-500 cursor-default")
                                }
                              >
                                <span className={scoreLabelClass}>
                                  {scoreType}
                                </span>
                                <span className={scoreValueClass}>{val}</span>
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                    <div className="flex flex-col items-center justify-center min-w-[3.5rem] md:min-w-[4rem]">
                      <CountryFlag code={blueCode} />
                      <span className="mt-1 text-sm md:text-base font-mono tracking-wide">
                        {blueCode}
                      </span>
                    </div>
                  </div>
                </div>

                {/* GREEN PLAYER (bottom) */}
                <div className="bg-green-900/60 border border-green-700 rounded-2xl p-4">
                  <div className="flex justify-between items-center mb-2">
                    <div className="flex items-center gap-3">
                      <span className="w-4 h-4 rounded-full bg-green-500" />
                      <span
                        className={
                          "font-semibold " +
                          (isFullscreen ? "text-lg md:text-xl" : "")
                        }
                      >
                        {G?.name || "Green"}
                      </span>
                    </div>
                    {fightFinished && finalWinnerSide === "green" && (
                      <span className="px-3 py-1 rounded-full bg-emerald-500 text-black text-xs md:text-sm font-bold">
                        WINNER
                      </span>
                    )}
                  </div>
                  <div className="flex items-stretch gap-3">
                    <div className="flex-1">
                      {/* Green scores ABOVE, penalties BELOW */}
                      <div className="grid grid-cols-3 gap-2 text-center text-xs md:text-sm">
                        {["H", "YO", "CH"].map((scoreType) => {
                          const s = sbComputed.green;
                          const cannotAdd =
                            endedNow || (scoreType === "H" && s.H >= 1);
                          const canAddScore = !cannotAdd;
                          const val =
                            scoreType === "H"
                              ? s.H
                              : scoreType === "YO"
                              ? s.YO
                              : s.CH;

                          const penKey =
                            scoreType === "H"
                              ? "G"
                              : scoreType === "YO"
                              ? "D"
                              : "T";
                          const penActive =
                            penKey === "T"
                              ? greenTActive
                              : penKey === "D"
                              ? greenDActive
                              : greenGActive;
                          const canAddPen = !endedNow;

                          return (
                            <div key={scoreType} className="flex flex-col gap-1">
                              {/* Score button (top) */}
                              <button
                                onClick={(e) =>
                                  handleScoreButton(
                                    "green",
                                    scoreType,
                                    false,
                                    canAddScore,
                                    e
                                  )
                                }
                                onContextMenu={(e) =>
                                  handleScoreButton(
                                    "green",
                                    scoreType,
                                    true,
                                    true,
                                    e
                                  )
                                }
                                className={
                                  "flex flex-col justify-center items-center rounded-xl py-3 md:py-4 border select-none " +
                                  (canAddScore
                                    ? "bg-green-700 border-green-500 hover:bg-green-600 cursor-pointer"
                                    : "bg-slate-800/40 border-slate-700/60 text-slate-500 cursor-default")
                                }
                              >
                                <span className={scoreLabelClass}>
                                  {scoreType}
                                </span>
                                <span className={scoreValueClass}>{val}</span>
                              </button>

                              {/* Penalty button (bottom) */}
                              <button
                                onClick={(e) =>
                                  handleScoreButton(
                                    "green",
                                    penKey,
                                    false,
                                    canAddPen,
                                    e
                                  )
                                }
                                onContextMenu={(e) =>
                                  handleScoreButton(
                                    "green",
                                    penKey,
                                    true,
                                    true,
                                    e
                                  )
                                }
                                className={
                                  "flex flex-col justify-center items-center rounded-xl py-1.5 border select-none " +
                                  (canAddPen
                                    ? "bg-slate-800 border-slate-500 hover:bg-slate-700 cursor-pointer"
                                    : "bg-slate-800/40 border-slate-700/60 text-slate-500 cursor-default")
                                }
                              >
                                <span className={penLabelClass}>{penKey}</span>
                                <div
                                  className={
                                    "mt-1 w-8 h-3 rounded-md " +
                                    (penActive
                                      ? "bg-red-400 shadow-[0_0_15px_rgba(248,113,113,1)]"
                                      : "bg-slate-500/30")
                                  }
                                />
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                    <div className="flex flex-col items-center justify-center min-w-[3.5rem] md:min-w-[4rem]">
                      <span className="mb-1 text-sm md:text-base font-mono tracking-wide">
                        {greenCode}
                      </span>
                      <CountryFlag code={greenCode} />
                    </div>
                  </div>
                </div>
              </div>

              {/* Winner summary + actions */}
              <div className="flex flex-wrap items-center gap-4">
                <div className="text-sm">
                  <div>
                    Current winner (live):{" "}
                    <span className="font-semibold">
                      {winnerNameLive}
                    </span>
                  </div>
                  <div className="text-slate-400">
                    Final winner (time/H):{" "}
                    <span className="font-semibold">
                      {winnerNameFinal}
                    </span>
                  </div>
                  <div className="text-slate-500 text-xs mt-1">
                    Base duration: {baseSeconds / 60} min
                  </div>
                </div>
                <button
                  onClick={saveResultToBout}
                  className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-sm"
                >
                  Save result to bout
                </button>
                <button
                  onClick={() => setShowMeta((v) => !v)}
                  className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm"
                >
                  {showMeta ? "Hide metadata" : "Show metadata"}
                </button>
              </div>

              {/* Metadata / event log */}
              {showMeta && (
                <div
                  className="mt-2 text-xs bg-slate-900/70 border border-slate-800 rounded-2xl p-4 overflow-y-auto"
                  style={{ maxHeight: "12rem" }}
                >
                  <div className="font-semibold mb-2">Event log</div>
                  {sbEvents.length === 0 && (
                    <div className="text-slate-400">No events yet.</div>
                  )}
                  {sbEvents.map((ev, i) => (
                    <div key={i} className="flex justify-between">
                      <span className="font-mono text-xs">
                        {formatTime(ev.atMs)}
                      </span>
                      <span>
                        {ev.side.toUpperCase()}{" "}
                        <span className="font-semibold">{ev.type}</span>
                      </span>
                    </div>
                  ))}
                  <div className="mt-2 text-xs text-slate-400">
                    Final stored duration (if saved):{" "}
                    {meta.durationSec != null
                      ? formatTime(meta.durationSec * 1000)
                      : "-"}
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* FOOTER with referees (like main-web layout) */}
          <footer className="w-full border-t border-slate-800 bg-slate-950/80">
            <div className="max-w-5xl mx-auto px-4 py-2 flex flex-col gap-1 text-xs">
              <div className="text-slate-300">
                {assignment ? (
                  <>
                    Referees:&nbsp;
                    <span className="font-semibold">
                      Main: {assignment.mainRef || "-"}
                    </span>
                    &nbsp;•&nbsp;
                    <span className="font-semibold">
                      J1: {assignment.judge1 || "-"}
                    </span>
                    &nbsp;•&nbsp;
                    <span className="font-semibold">
                      J2: {assignment.judge2 || "-"}
                    </span>
                  </>
                ) : (
                  <span className="text-slate-500">
                    Referees: not assigned for this bout.
                  </span>
                )}
              </div>
              <div className="text-slate-500">
                Standalone scoreboard v5 – open this file directly in your browser.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
