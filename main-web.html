                csvHeader = [
                  "WeightGroup",
                  "Rank",
                  "PlayerName",
                  "Country",
                  "Wins",
                  "Losses",
                  "Fights"
                ];
                csvRows = rows;
              } else if (reportTab === "countryResults") {
                csvHeader = [
                  "Rank",
                  "CountryCode",
                  "CountryName",
                  "Gold",
                  "Silver",
                  "Bronze",
                  "Total"
                ];
                csvRows = countryMedalRows.map((r, idx) => ({
                  Rank: idx + 1,
                  CountryCode: r.code,
                  CountryName: r.full,
                  Gold: r.gold,
                  Silver: r.silver,
                  Bronze: r.bronze,
                  Total: r.gold + r.silver + r.bronze
                }));
              } else if (reportTab === "matches") {
                csvHeader = [
                  "BoutNo",
                  "Gillam",
                  "Sex",
                  "Weight",
                  "BlueName",
                  "BlueCountry",
                  "GreenName",
                  "GreenCountry",
                  "WinnerName",
                  "WinnerCountry",
                  "Duration"
                ];
                csvRows = matchRows.map((m) => ({
                  BoutNo: m.boutNo,
                  Gillam: m.gillam,
                  Sex: m.sex,
                  Weight: m.weight,
                  BlueName: m.blueName,
                  BlueCountry: m.blueCountry,
                  GreenName: m.greenName,
                  GreenCountry: m.greenCountry,
                  WinnerName: m.winnerName,
                  WinnerCountry: m.winnerCountry,
                  Duration: m.durationText
                }));
              } else if (reportTab === "refs") {
                csvHeader = [
                  "Referee",
                  "Affiliation",
                  "Scope",
                  "MainRefCount",
                  "Judge1Count",
                  "Judge2Count",
                  "TotalAssignments",
                  "ManualTouches",
                  "ImbalanceVsAverage",
                  "Gillams"
                ];
                csvRows = refSummaryRows.map((r) => ({
                  Referee: r.label,
                  Affiliation: r.country,
                  Scope: r.scope,
                  MainRefCount: r.mainCount,
                  Judge1Count: r.judge1Count,
                  Judge2Count: r.judge2Count,
                  TotalAssignments: r.total,
                  ManualTouches: r.manualCount,
                  ImbalanceVsAverage: r.imbalance,
                  Gillams: r.gillamsText
                }));
              } else if (reportTab === "penalties") {
                csvHeader = [
                  "BoutNo",
                  "Gillam",
                  "Sex",
                  "Weight",
                  "BlueName",
                  "GreenName",
                  "Side",
                  "PenaltyType",
                  "Time"
                ];
                csvRows = penaltyRows.map((r) => ({
                  BoutNo: r.boutNo,
                  Gillam: r.gillam,
                  Sex: r.sex,
                  Weight: r.weight,
                  BlueName: r.blueName,
                  GreenName: r.greenName,
                  Side: r.side,
                  PenaltyType: r.type,
                  Time: r.time
                }));
              } else if (reportTab === "playersByWeight") {
                csvHeader = [
                  "Group",
                  "PlayerName",
                  "Country",
                  "Sex",
                  "Age",
                  "ActualKg",
                  "Seed"
                ];
                csvRows = playersByWeightRows.map((r) => ({
                  Group: r.group,
                  PlayerName: r.name,
                  Affiliation: r.country,
                  Sex: r.sex,
                  Age: r.age,
                  ActualKg: r.actualKg,
                  Seed: r.seed
                }));
              } else if (reportTab === "counts") {
                // For counts we export three sections in one table-style CSV (simple flat):
                const rows = [];
                rows.push({ Section: "Players by Weight", Name: "", Value: "" });
                countByWeight.forEach((r) => {
                  rows.push({
                    Section: "Players by Weight",
                    Name: r.group,
                    Value: r.count
                  });
                });
                rows.push({ Section: "Players by Sex", Name: "", Value: "" });
                rows.push({
                  Section: "Players by Sex",
                  Name: "Male (M)",
                  Value: countBySex.M
                });
                rows.push({
                  Section: "Players by Sex",
                  Name: "Female (F)",
                  Value: countBySex.F
                });
                rows.push({
                  Section: "Countries",
                  Name: "Distinct countries",
                  Value: totalCountries
                });
                countryCountRows.forEach((r) => {
                  rows.push({
                    Section: "Players by Country & Sex",
                    Name: r.full || r.code,
                    Value: `M=${r.M}, F=${r.F}, Total=${r.M + r.F}`
                  });
                });
                csvHeader = ["Section", "Name", "Value"];
                csvRows = rows;
              }

              const handleDownload = () => {
                if (!csvHeader || !csvRows || csvRows.length === 0) {
                  alert("Nothing to export for this report.");
                  return;
                }
                downloadCSVFile(`kurash_${reportTab}.csv`, csvHeader, csvRows);
              };

const subTabs = [

    rrBouts.forEach((b) => {

  // === existing reportTab conditions below stay as they are ===
  if (reportTab === "playerResults") {
                  if (!groupedKeys.length) {

                  return (
                    <div className="overflow-x-auto rounded-xl border border-slate-800">
                      <table className="w-full text-xs md:text-sm">
                        <thead className="bg-slate-900/60 text-slate-300">
                          <tr>
                            <th className="p-2 text-right">#</th>
                            <th className="p-2 text-right">Gillam</th>
                            <th className="p-2 text-right">Sex</th>
                            <th className="p-2 text-right">Weight</th>
                            <th className="p-2 text-right">Blue</th>
                            <th className="p-2 text-right">Blue C.</th>
                            <th className="p-2 text-right">Green</th>
                            <th className="p-2 text-right">Green C.</th>
                            <th className="p-2 text-right">Winner</th>
                            <th className="p-2 text-right">Dur.</th>
                          </tr>
                        </thead>
                        <tbody>
                          {matchRows.map((m) => (
                            <tr key={m.boutNo} className="border-t border-slate-800">
                              <td className="p-2">{m.boutNo}</td>
                              <td className="p-2">{m.gillam}</td>
                              <td className="p-2">{m.sex}</td>
                              <td className="p-2">{m.weight}</td>
                              <td className="p-2">{m.blueName}</td>
                              <td className="p-2">{m.blueCountry}</td>
                              <td className="p-2">{m.greenName}</td>
                              <td className="p-2">{m.greenCountry}</td>
                              <td className="p-2">
                                {m.winnerName
                                  ? `${m.winnerName} (${m.winnerCountry})`
                                  : "-"}
                              </td>
                              <td className="p-2 text-center">{m.durationText}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  );
                }

                if (reportTab === "refs") {
                  if (!hasSchedule || !refRows.length) {
                    return (
                      <div className="text-slate-400 text-sm">
                        No schedule or no referee assignments yet.
                      </div>
                    );
                  }
                  return (
                    <div className="space-y-4">
                      <div className="grid md:grid-cols-4 gap-3">
                        <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-3">
                          <div className="text-xs text-slate-500">Active referees used</div>
                          <div className="text-2xl font-bold text-sky-300">{refSummaryStats.activeRefs}</div>
                        </div>
                        <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-3">
                          <div className="text-xs text-slate-500">Total role assignments</div>
                          <div className="text-2xl font-bold text-sky-300">{refSummaryStats.totalAssignments}</div>
                        </div>
                        <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-3">
                          <div className="text-xs text-slate-500">Max load</div>
                          <div className="text-2xl font-bold text-amber-300">{refSummaryStats.maxTotal}</div>
                        </div>
                        <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-3">
                          <div className="text-xs text-slate-500">Min load</div>
                          <div className="text-2xl font-bold text-emerald-300">{refSummaryStats.minTotal}</div>
                        </div>
                      </div>

                      <div className="overflow-x-auto rounded-xl border border-slate-800">
                        <table className="w-full text-xs md:text-sm">
                          <thead className="bg-slate-900/60 text-slate-300">
                            <tr>
                              <th className="p-2 text-right">Referee</th>
                              <th className="p-2 text-right">Scope</th>
                              <th className="p-2 text-right">Main Ref</th>
                              <th className="p-2 text-right">Judge 1</th>
                              <th className="p-2 text-right">Judge 2</th>
                              <th className="p-2 text-right">Total</th>
                              <th className="p-2 text-right">Manual</th>
                              <th className="p-2 text-right">Δ vs Avg</th>
                              <th className="p-2 text-right">Gillams</th>
                            </tr>
                          </thead>
                          <tbody>
                            {refSummaryRows.map((r) => (
                              <tr key={r.id} className="border-t border-slate-800">
                                <td className="p-2">{r.label}</td>
                                <td className="p-2">{r.scope}</td>
                                <td className="p-2 text-center">{r.mainCount}</td>
                                <td className="p-2 text-center">{r.judge1Count}</td>
                                <td className="p-2 text-center">{r.judge2Count}</td>
                                <td className="p-2 text-center font-semibold">{r.total}</td>
                                <td className="p-2 text-center">{r.manualCount}</td>
                                <td className={"p-2 text-center font-semibold " + (r.imbalance > 0 ? "text-amber-300" : r.imbalance < 0 ? "text-emerald-300" : "text-slate-300")}>{r.imbalance > 0 ? `+${r.imbalance}` : r.imbalance}</td>
                                <td className="p-2">{r.gillamsText || "-"}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                      <div className="overflow-x-auto rounded-xl border border-slate-800">
                        <table className="w-full text-xs md:text-sm">
                          <thead className="bg-slate-900/60 text-slate-300">
                            <tr>
                              <th className="p-2 text-right">#</th>
                              <th className="p-2 text-right">Gillam</th>
                              <th className="p-2 text-right">Sex</th>
                              <th className="p-2 text-right">Weight</th>
                              <th className="p-2 text-right">Blue</th>
                              <th className="p-2 text-right">Green</th>
                              <th className="p-2 text-right">Main Ref</th>
                              <th className="p-2 text-right">Judge 1</th>
                              <th className="p-2 text-right">Judge 2</th>
                            </tr>
                          </thead>
                          <tbody>
                            {refRows.map((r) => (
                              <tr key={r.boutNo} className="border-t border-slate-800">
                                <td className="p-2">{r.boutNo}</td>
                                <td className="p-2">{r.gillam}</td>
                                <td className="p-2">{r.sex}</td>
                                <td className="p-2">{r.weight}</td>
                                <td className="p-2">
                                  {r.blueName} ({r.blueCountry})
                                </td>
                                <td className="p-2">
                                  {r.greenName} ({r.greenCountry})
                                </td>
                                <td className="p-2">{r.mainRef || "-"}</td>
                                <td className="p-2">{r.judge1 || "-"}</td>
                                <td className="p-2">{r.judge2 || "-"}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                }

                if (reportTab === "penalties") {
                  if (!penaltyRows.length) {
                    return (
                      <div className="text-slate-400 text-sm">
                        No penalties (T/D/G) recorded yet.
                      </div>
                    );
                  }
                  return (
                    <div className="overflow-x-auto rounded-xl border border-slate-800">
                      <table className="w-full text-xs md:text-sm">
                        <thead className="bg-slate-900/60 text-slate-300">
                          <tr>
                            <th className="p-2 text-right">Bout</th>
                            <th className="p-2 text-right">Gillam</th>
                            <th className="p-2 text-right">Sex</th>
                            <th className="p-2 text-right">Weight</th>
                            <th className="p-2 text-right">Blue</th>
                            <th className="p-2 text-right">Green</th>
                            <th className="p-2 text-right">Side</th>
                            <th className="p-2 text-right">Type</th>
                            <th className="p-2 text-right">Time</th>
                          </tr>
                        </thead>
                        <tbody>
                          {penaltyRows.map((r, idx) => (
                            <tr key={idx} className="border-t border-slate-800">
                              <td className="p-2">{r.boutNo}</td>
                              <td className="p-2">{r.gillam}</td>
                              <td className="p-2">{r.sex}</td>
                              <td className="p-2">{r.weight}</td>
                              <td className="p-2">{r.blueName}</td>
                              <td className="p-2">{r.greenName}</td>
                              <td className="p-2">{r.side}</td>
                              <td className="p-2">{r.type}</td>
                              <td className="p-2 text-center">{r.time}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  );
                }

                if (reportTab === "playersByWeight") {
                  if (!playersByWeightRows.length) {
                    return (
                      <div className="text-slate-400 text-sm">
                        No players yet.
                      </div>
                    );
                  }
                  return (
                    <div className="overflow-x-auto rounded-xl border border-slate-800">
                      <table className="w-full text-xs md:text-sm">
                        <thead className="bg-slate-900/60 text-slate-300">
                          <tr>
                            <th className="p-2 text-right">Group</th>
                            <th className="p-2 text-right">Player</th>
                            <th className="p-2 text-right">Country</th>
                            <th className="p-2 text-right">Sex</th>
                            <th className="p-2 text-right">Age</th>
                            <th className="p-2 text-right">Actual kg</th>
                            <th className="p-2 text-right">Seed</th>
                          </tr>
                        </thead>
                        <tbody>
                          {playersByWeightRows.map((r, idx) => (
                            <tr key={idx} className="border-t border-slate-800">
                              <td className="p-2">{r.group}</td>
                              <td className="p-2">{r.name}</td>
                              <td className="p-2">{r.country}</td>
                              <td className="p-2 text-center">{r.sex}</td>
                              <td className="p-2 text-center">{r.age}</td>
                              <td className="p-2 text-center">{r.actualKg}</td>
                              <td className="p-2 text-center">{r.seed}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  );
                }

                if (reportTab === "counts") {
                  if (!players.length) {
                    return (
                      <div className="text-slate-400 text-sm">
                        No players yet.
                      </div>
                    );
                  }
                  return (
                    <div className="space-y-4 text-xs md:text-sm">
                      <div>
                        <h4 className="font-semibold text-sky-300 mb-1">
                          Players count by weight
                        </h4>
                        <div className="overflow-x-auto rounded-xl border border-slate-800">
                          <table className="w-full">
                            <thead className="bg-slate-900/60 text-slate-300">
                              <tr>
                                <th className="p-2 text-right">Group</th>
                                <th className="p-2 text-right">Players</th>
                              </tr>
                            </thead>
                            <tbody>
                              {countByWeight.map((r, idx) => (
                                <tr key={idx} className="border-t border-slate-800">
                                  <td className="p-2">{r.group}</td>
                                  <td className="p-2 text-center">{r.count}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      <div>
                        <h4 className="font-semibold text-sky-300 mb-1">
                          Players count by sex
                        </h4>
                        <div className="overflow-x-auto rounded-xl border border-slate-800">
                          <table className="w-full">
                            <thead className="bg-slate-900/60 text-slate-300">
                              <tr>
                                <th className="p-2 text-right">Sex</th>
                                <th className="p-2 text-right">Players</th>
                              </tr>
                            </thead>
                            <tbody>
                              <tr className="border-t border-slate-800">
                                <td className="p-2">Male (M)</td>
                                <td className="p-2 text-center">{countBySex.M}</td>
                              </tr>
                              <tr className="border-t border-slate-800">
                                <td className="p-2">Female (F)</td>
                                <td className="p-2 text-center">{countBySex.F}</td>
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      </div>

                      <div>
                        <h4 className="font-semibold text-sky-300 mb-1">
                          Countries & players by country and sex
                        </h4>
                        <p className="text-slate-400 mb-1">
                          Distinct countries: <span className="font-semibold">{totalCountries}</span>
                        </p>
                        <div className="overflow-x-auto rounded-xl border border-slate-800">
                          <table className="w-full">
                            <thead className="bg-slate-900/60 text-slate-300">
                              <tr>
                                <th className="p-2 text-right">Country</th>
                                <th className="p-2 text-right">M</th>
                                <th className="p-2 text-right">F</th>
                                <th className="p-2 text-right">Total</th>
                              </tr>
                            </thead>
                            <tbody>
                              {countryCountRows.map((r, idx) => (
                                <tr key={idx} className="border-t border-slate-800">
                                  <td className="p-2">
                                    {r.full || r.code} ({r.code})
                                  </td>
                                  <td className="p-2 text-center">{r.M}</td>
                                  <td className="p-2 text-center">{r.F}</td>
                                  <td className="p-2 text-center">{r.M + r.F}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  );
                }

                return null;
              };

              return (
                <SectionCard title="Reports">
                  <div className="mb-4">
                    <div className="flex flex-wrap gap-2">
                      {subTabs.map((st) => (
                        <button
                          key={st.key}
                          onClick={() => setReportTab(st.key)}
                          className={
                            "px-3 py-1.5 rounded-xl border text-xs md:text-sm " +
                            (reportTab === st.key
                              ? "bg-sky-600 border-sky-500 text-white"
                              : "bg-slate-900 border-slate-800 text-slate-200 hover:bg-slate-800")
                          }
                        >
                          {st.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center justify-between mb-3 text-xs md:text-sm">
                    <div className="text-slate-400">
                      Downloadable CSV for each report (Excel friendly).
                    </div>
                    <button
                      onClick={handleDownload}
                      className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 border border-emerald-500"
                    >
                      Download CSV
                    </button>
                  </div>

                  {renderTable()}
                </SectionCard>
              );
            })()}

            {tab === "help" && (
              <SectionCard title="Help & Formats">
                <div className="space-y-6 text-sm text-slate-300">
                  <div className="grid md:grid-cols-2 gap-4">
                    <div className="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
                      <h4 className="font-semibold mb-2 text-sky-300">Quick Start</h4>
                      <ol className="list-decimal pl-5 space-y-1">
                        <li>Go to <strong>Settings</strong> and enter the backend server URL if you want multi-device mode.</li>
                        <li>Create or load a tournament from <strong>Home</strong>.</li>
                        <li>Add players, then add referees with referee numbers.</li>
                        <li>Open <strong>Draw</strong>, assign each group to a Gillam, then click <strong>Generate</strong>.</li>
                        <li>Use <strong>Scoreboard</strong> to score fights and save results.</li>
                        <li>Use <strong>Reports</strong> for medals, rankings, brackets, CSV, and referee reports.</li>
                      </ol>
                    </div>
                    <div className="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
                      <h4 className="font-semibold mb-2 text-sky-300">Main Features</h4>
                      <ul className="list-disc pl-5 space-y-1">
                        <li>Tournament Manager: New / Resume / View / Archive / Re-open / Delete</li>
                        <li>Hybrid draw engine: Round Robin for smaller groups, Single Elimination for larger groups</li>
                        <li>Gillam-based scheduling</li>
                        <li>Integrated scoreboard with save-to-server</li>
                        <li>Country, medal, referee, and match reports</li>
                        <li>Designed for server-connected use across multiple screens</li>
                      </ul>
                    </div>
                  </div>

                  <div>
                    <h4 className="font-semibold mb-1">Players TXT format (recommended)</h4>
                    <code className="bg-slate-900 border border-slate-800 px-2 py-1 rounded block">
                      name | affiliation | sex(M/F) | actualKg | [seed] | [dob YYYY-MM-DD]
                    </code>
                    <p className="mt-1">
                      Example:{" "}
                      <span className="font-mono">
                        Abdullah Alreedy | Al-Hilal Club | M | 81.4 | 1 | 1990-05-20
                      </span>
                    </p>
                  </div>

                  <div>
                    <h4 className="font-semibold mb-1">Legacy players format</h4>
                    <code className="bg-slate-900 border border-slate-800 px-2 py-1 rounded block">
                      name | affiliation | weightLabel | [seed]
                    </code>
                    <p className="mt-1">
                      Example: <span className="font-mono">A. Alreedy | Al-Hilal Club | -81 | 1</span>
                    </p>
                  </div>

                  <div>
                    <h4 className="font-semibold mb-1">Referees TXT format</h4>
                    <code className="bg-slate-900 border border-slate-800 px-2 py-1 rounded block">
                      refNo | name | affiliation | rank | [assignScope] | [poolGillam]
                    </code>
                    <p className="mt-1">
                      Example: <span className="font-mono">07 | Ref A | Al-Hilal Club | 3 | pool | Gillam A</span>
                    </p>
                    <p className="mt-1 text-slate-400">
                      In <span className="font-mono">Global Assignment</span>, scope and pool values are ignored. In <span className="font-mono">Gillam Pool Assignment</span>, they are used.
                    </p>
                    <p className="mt-1 text-slate-400">
                      Old formats still supported: <span className="font-mono">refNo | name | affiliation | rank</span> and <span className="font-mono">name | affiliation</span>
                    </p>
                  </div>

                  <div className="grid md:grid-cols-2 gap-4">
                    <div className="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
                      <h4 className="font-semibold mb-2 text-sky-300">Settings</h4>
                      <ul className="list-disc pl-5 space-y-1">
                        <li>Backend server URL for synchronized multi-device mode</li>
                        <li>Number of Gillams</li>
                        <li>Round Robin threshold</li>
                        <li>Referee main-role avoid span</li>
                      </ul>
                    </div>
                    <div className="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
                      <h4 className="font-semibold mb-2 text-sky-300">Scoreboard Controls</h4>
                      <ul className="list-disc pl-5 space-y-1">
                        <li>H / YO / CH = scores</li>
                        <li>T / D / G = penalties</li>
                        <li>Left-click = add</li>
                        <li>Right-click = remove last of same type</li>
                        <li>Timer auto-sets: 4 min men / 3 min women</li>
                        <li>Fullscreen available for live use</li>
                      </ul>
                    </div>
                  </div>

                  <div>
                    <h4 className="font-semibold mb-1">Recommended Workflow</h4>
                    <ol className="list-decimal pl-5 space-y-1">
                      <li>Connect to the server from <strong>Settings</strong>.</li>
                      <li>Create a new tournament or load an existing one from <strong>Home</strong>.</li>
                      <li>Add players with real weight and DOB, or import them from TXT.</li>
                      <li>Add referees and assign referee numbers.</li>
                      <li>Generate the draw and sync it to the server.</li>
                      <li>Use the scoreboard during the event and save each fight result.</li>
                      <li>Review outputs in <strong>Reports</strong> and export CSV when needed.</li>
                    </ol>
                  </div>
                </div>
              </SectionCard>
            )}
          </main>

          <footer className="max-w-[98vw] mx-auto px-4 pb-10 text-xs text-slate-400">
            Single-page web app – open index.html directly in your browser.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <!-- APP SCRIPT END -->
</body>
</html>
