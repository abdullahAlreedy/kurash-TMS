// Auto-generate a code for countries without overrides using the first 3 clean letters.
function autoCodeFromName(name) {
  const letters = name.replace(/[^A-Za-z]/g, "").toUpperCase();
  if (!letters) return "UNK";
  if (letters.length <= 3) return letters;
  return letters.slice(0, 3);
}

// Final mapping used throughout the system.
const COUNTRY_NAME_TO_CODE = Object.fromEntries(
  ALL_COUNTRY_NAMES.map((fullName) => [
    fullName,
    COUNTRY_CODE_OVERRIDES[fullName] || autoCodeFromName(fullName)
  ])
);

// Reverse mapping: code to country name.
const COUNTRY_CODE_TO_NAME = Object.fromEntries(
  Object.entries(COUNTRY_NAME_TO_CODE).map(([full, code]) => [code, full])
);

// Backward-compatible resolver using the new mapping.
function resolveCountry(input) {
  const t = (input || "").trim();
  if (COUNTRY_NAME_TO_CODE[t]) return { code: COUNTRY_NAME_TO_CODE[t], full: t };
  const up = t.toUpperCase();
  if (COUNTRY_CODE_TO_NAME[up]) return { code: up, full: COUNTRY_CODE_TO_NAME[up] };
  return { code: up, full: t || "Unknown" };
}


function CountryFlag({ code }) {
  const upper = (code || "").toUpperCase();
  const baseClass =
    "w-10 h-6 md:w-14 md:h-8 rounded border border-slate-300 shadow-inner object-cover";

  if (!upper) {
    return <div className={baseClass + " bg-slate-700"} aria-label="flag" />;
  }

  // Convert code to lowercase and append _m to match flag file naming, e.g. ksa_m.jpg.
  const lower = upper.toLowerCase();

  const jpgPath = `flags/${lower}_m.jpg`;
  const pngPath = `flags/${lower}_m.png`;

  const handleError = (e) => {
    // If JPG is not found, try PNG with the same name.
    if (e.target.src.includes(".jpg")) {
      e.target.src = pngPath;
    } else {
      // If both fail, hide the image.
      e.target.style.display = "none";
    }
  };

  return (
    <img
      src={jpgPath}
      alt={`${upper} flag`}
      className={baseClass}
      onError={handleError}
    />
  );
}

    function isSchoolScope(scope) { return scope === "internal_school"; }

    function normalizedAffiliationMode(scope, mode) {

      const full = String(input || "").trim();

    }
    function defaultAgeGroupNumbForScope(scope) {
      if (isExternalScope(scope)) return 101;
      if (isSchoolScope(scope)) return 8;
      return 1;
    }
    function activeAgeGroups(scope) {
      if (isExternalScope(scope)) return EXTERNAL_AGE_GROUPS;
      if (isSchoolScope(scope)) return SCHOOL_AGE_GROUPS;
      return INTERNAL_AGE_GROUPS;
    }
    function ageGroupByNumb(numb, scope) {
      const n = Number(numb) || defaultAgeGroupNumbForScope(scope);
      return activeAgeGroups(scope).find((g) => Number(g.numb) === n) || activeAgeGroups(scope)[0];
    }
    function competitiveAgeGroups(scope) {
      return activeAgeGroups(scope).filter((g) => g.competitive);
    }
    function ageGroupFromAge(ageValue, scope) {
      const age = Number(ageValue);
      if (!Number.isFinite(age) || age < 0) return defaultAgeGroupNumbForScope(scope);
      if (isExternalScope(scope)) {
        if (age <= 17) return 103;
        if (age <= 21) return 102;
        return 101;
      }
      if (isSchoolScope(scope)) {
        if (age <= 9) return 8;
        if (age <= 12) return 7;
        if (age <= 15) return 9;
        return 10;
      }
      if (age <= 11) return 6;
      if (age <= 13) return 5;
      if (age <= 15) return 4;
      if (age <= 17) return 3;
      if (age <= 21) return 2;
      return 1;
    }
    function defaultManualGroupsForScope(scope) {
      const out = {};
      competitiveAgeGroups(scope).forEach((g) => {
        out[g.numb] = ["Group A"];
      });
      return out;
    }
    function manualGroupsForAge(manualGroupsByAge, ageGroupNumb, scope) {
      const group = ageGroupByNumb(ageGroupNumb, scope);
      const raw = manualGroupsByAge?.[group?.numb];
      const arr = Array.isArray(raw) ? raw.map((x, i) => cleanManualGroupName(x, `Group ${i + 1}`)).filter(Boolean) : [];
      return arr.length ? arr : ["Group A"];
    }
    function normalizeManualGroup(value, manualGroupsByAge, ageGroupNumb, scope) {
      const arr = manualGroupsForAge(manualGroupsByAge, ageGroupNumb, scope);
      return arr.includes(value) ? value : arr[0];
    }
    function fmtClass(x) {
      const t = String(x);
      return t.endsWith("+") ? "+" + t.replace("+", "") : "-" + t;
    }
    function weightsForGroup(ageGroupNumb, sex, scope) {
      const group = ageGroupByNumb(ageGroupNumb, scope);
      if (!group?.competitive) return [];
      if (isExternalScope(scope)) return EXTERNAL_WEIGHTS[group.weightGr]?.[sex === "F" ? "F" : "M"] || [];
      const source = sex === "F" ? INTERNAL_FEMALE_WEIGHTS_BY_GR : INTERNAL_MALE_WEIGHTS_BY_GR;
      return source[group.weightGr] || [];
    }
    function bucketWeight(sex, actualKg, ageGroupNumb, scope) {
      const v = Math.max(0, Number(actualKg) || 0);
      const arr = weightsForGroup(ageGroupNumb || 1, sex, scope || "internal_local");
      if (!arr.length) return "";
      for (const w of arr) {
        const label = String(w);
        const limit = Number(label.replace("+", ""));
        if (!label.endsWith("+") && v <= limit) return fmtClass(label);
      }
      const last = String(arr[arr.length - 1]);
      return last.endsWith("+") ? fmtClass(last) : "+" + last;
    }
    function ageGroupLabel(numb, scope) { return ageGroupByNumb(numb, scope)?.label || "-"; }
    function ageGroupArabicLabel(numb, scope) { return ageGroupByNumb(numb, scope)?.arLabel || ""; }
    function ageGroupTitleProps(numb, scope) {

    }
    function groupKeyOfPlayer(p, weightMode) {
      return `${p.ageGroupNumb || 1}|${p.sex || "M"}|${groupSlotOfPlayer(p, weightMode)}`;
    }
    function parseGroupKey(gk) {
      const parts = String(gk || "").split("|");
      if (parts.length >= 3) return { ageGroupNumb: Number(parts[0]) || 1, sex: parts[1], weight: parts[2], slot: parts[2] };
      return { ageGroupNumb: 1, sex: parts[0] || "M", weight: parts[1] || "", slot: parts[1] || "" };

      return `${ageGroupLabel(p.ageGroupNumb, scope)} | ${p.sex === "F" ? "Women" : "Men"} | ${slotLabel}`;
    }
    function matchDurationSecondsForBout(bout, playersIndex, scope, manualOverrideSeconds) {
      if (Number(manualOverrideSeconds) > 0) return Number(manualOverrideSeconds);
      const p = parseGroupKey(bout?.groupKey);
      const g = ageGroupByNumb(p.ageGroupNumb, scope || "internal_local");
      if (g?.defaultSeconds) return g.defaultSeconds;
      const A = playersIndex?.get?.(bout?.blueId);
      const G = playersIndex?.get?.(bout?.greenId);
      const sex = bout?.sex || A?.sex || G?.sex || "M";
      return sex === "F" ? 3 * 60 : 4 * 60;
    }

    function formatWeightsForPreview(weights) {

        }));
    }

    function calcAge(dobStr) {
      if (!dobStr) return "";
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return "";
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return age >= 0 ? age : "";
    }

    function makeGillamNames(n) {
      const names = [];
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let i = 0; i < n; i++) {
        const letter = letters[i] || String(i + 1);
        names.push("Gillam " + letter);
      }
      return names;
    }

    function bySeedThenName(a, b) {
      const sa = a.seed ?? Number.POSITIVE_INFINITY;
      const sb = b.seed ?? Number.POSITIVE_INFINITY;
      if (sa !== sb) return sa - sb;
      return String(a.name || "").localeCompare(String(b.name || ""));
    }

    function withByeIfOdd(ids) {
      return ids.length % 2 === 1 ? ids.concat(["BYE"]) : ids;
    }

    function buildRoundRobinForWeight(plist) {
      const seeded = plist.slice().sort(bySeedThenName).map((p) => p.id);
      const arr = withByeIfOdd(seeded);
      const n = arr.length;
      const half = n / 2;
      const rounds = [];
      for (let r = 0; r < n - 1; r++) {
        const pairs = [];
        for (let i = 0; i < half; i++) {
          const a = arr[i];
          const b = arr[n - 1 - i];
          if (a !== "BYE" && b !== "BYE") pairs.push([a, b]);
        }
        rounds.push(pairs);
        const fixed = arr[0];
        const rest = arr.slice(1);
        rest.unshift(rest.pop());
        arr.splice(0, arr.length, fixed, ...rest);
      }
      return rounds;
    }

    // NEW: build Single Elimination nodes (local bracket for a weight)
    function buildSingleEliminationNodes(plist) {
      // plist: array of players (objects)
      const participants = plist.map((p) => ({ type: "player", playerId: p.id }));
      const bouts = [];
      let round = 1;
      let current = participants;
      while (current.length > 1) {
        const next = [];
        for (let i = 0; i < current.length; i += 2) {
          const a = current[i];
          const b = current[i + 1];
          if (!b) {
            // bye
            next.push(a);
          } else {
            const localId = bouts.length + 1;
            bouts.push({ localId, round, sourceA: a, sourceB: b });
            next.push({ type: "bout", boutLocalId: localId });
          }
        }
        current = next;
        round++;
      }
      return bouts;
    }

    // UPDATED: mix bouts across weights; now takes bout objects instead of [a,b]
function mixBoutsAcrossWeights(input, weightsOrder) {
      const weights =
        weightsOrder && weightsOrder.length ? weightsOrder.slice() : Object.keys(input);

      // For each group, keep a copy of its bout queue with blueId / greenId / localId / type / round.
      const queues = new Map(weights.map((w) => [w, (input[w] || []).slice()]));

      // Final result: an array of [groupKey, boutDesc].
      const result = [];

      // Last bout played by each player: playerId -> boutIndex.
      const lastBoutIndexByPlayer = new Map();

      // Recently used groups, used to avoid immediate repetition when possible.
      const lastWeights = [];

      function canUseBout(bout, weightKey, requireRest, avoidSameWeight) {
        const idxNow = result.length;
        const players = [];
        if (bout.blueId) players.push(bout.blueId);
        if (bout.greenId) players.push(bout.greenId);

        // Rest rule: at least two bouts between two bouts for the same player (gap >= 3).
        if (requireRest) {
          for (const pid of players) {
            const lastIdx = lastBoutIndexByPlayer.get(pid);
            if (lastIdx != null && idxNow - lastIdx <= 2) {
              return false;
            }
          }
        }

        // Avoid repeating the same group immediately whenever possible.
        if (avoidSameWeight && lastWeights.length > 0) {
          const lastW = lastWeights[lastWeights.length - 1];
          if (weightKey === lastW) {
            return false;
          }
        }

        return true;
      }

      function pickNext() {
        // Try progressively relaxed selection modes:
        // 1) Rest + no group repetition.
        // 2) Rest only.
        // 3) No group repetition only.
        // 4) No constraints when necessary.
        const modes = [
          { requireRest: true, avoidSameWeight: true },
          { requireRest: true, avoidSameWeight: false },
          { requireRest: false, avoidSameWeight: true },
          { requireRest: false, avoidSameWeight: false }
        ];

        for (const mode of modes) {
          const { requireRest, avoidSameWeight } = mode;
          for (const w of weights) {
            const q = queues.get(w);
            if (!q || !q.length) continue;

            let idx = q.findIndex((bout) =>
              canUseBout(bout, w, requireRest, avoidSameWeight)
            );
            if (idx === -1) continue;

            const bout = q.splice(idx, 1)[0];
            return [w, bout];
          }
        }

        return null;
      }

      while (true) {
        const pick = pickNext();
        if (!pick) break;
        const [w, bout] = pick;
        const idxNow = result.length;

        result.push([w, bout]);

        const players = [];
        if (bout.blueId) players.push(bout.blueId);
        if (bout.greenId) players.push(bout.greenId);
        for (const pid of players) {
          lastBoutIndexByPlayer.set(pid, idxNow);
        }

        lastWeights.push(w);
        if (lastWeights.length > 2) lastWeights.shift();
      }

      return result;
    }

       function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function assignReferees(bouts, playersIndex, referees, avoidSpan, options) {

      const settings = options || {};
      const assignmentMode = settings.assignmentMode || "global";
      const fallbackToGlobal = settings.fallbackToGlobal !== false;

      const globalPool = shuffle((referees || []).slice());
      const poolByGillam = new Map();

      function refsForGillam(gillam) {
        if (!poolByGillam.has(gillam)) {
          const filtered = (referees || []).filter((r) => {
            if (!r) return false;
            const scope = r.assignScope || "global";
            if (scope === "global") return true;
            if (scope === "pool") return (r.poolGillam || "") === (gillam || "");
            return true;
          });
          poolByGillam.set(gillam, shuffle(filtered));
        }
        return poolByGillam.get(gillam);
      }

      const recentMainByGillam = new Map();
      const recentJudgeByGillam = new Map();
      const recentMainGlobal = [];
      const recentJudgeGlobal = [];
      avoidSpan = avoidSpan ?? 6;

      function getRecentArrays(gillam) {
        if (assignmentMode !== "gillam_pool") {
          return { main: recentMainGlobal, judge: recentJudgeGlobal };
        }
        if (!recentMainByGillam.has(gillam)) recentMainByGillam.set(gillam, []);
        if (!recentJudgeByGillam.has(gillam)) recentJudgeByGillam.set(gillam, []);
        return { main: recentMainByGillam.get(gillam), judge: recentJudgeByGillam.get(gillam) };
      }

      function getPool(gillam) {
        if (assignmentMode === "gillam_pool") {
          const local = refsForGillam(gillam);
          if (local && local.length) return local;
          if (!fallbackToGlobal) return [];
        }
        return globalPool;
      }

      function isNeutralAffiliationCode(code) {
        const c = String(code || "").trim().toUpperCase();
        return !c || c === "NA" || c === "NONE" || c === "N/A" || c === "CLB" || c === "CLUB";
      }

      function takeCandidate(pool, avoidCountries, recent, alsoAvoid) {
        alsoAvoid = alsoAvoid || new Set();
        if (!pool || !pool.length) return null;

        const effectiveAvoid = new Set(
          Array.from(avoidCountries || []).filter((code) => !isNeutralAffiliationCode(code))
        );

        for (let i = 0; i < pool.length; i++) {
          const r = pool[i];
          if (effectiveAvoid.has(r.country)) continue;
          if (alsoAvoid.has(r.id)) continue;
          if (recent.includes(r.id)) continue;
          pool.push(pool.splice(i, 1)[0]);
          return r.id;
        }

        for (let i = 0; i < pool.length; i++) {
          const r = pool[i];
          if (effectiveAvoid.has(r.country)) continue;
          if (alsoAvoid.has(r.id)) continue;
          pool.push(pool.splice(i, 1)[0]);
          return r.id;
        }

        for (let i = 0; i < pool.length; i++) {
          const r = pool[i];
          if (alsoAvoid.has(r.id)) continue;
          pool.push(pool.splice(i, 1)[0]);
          return r.id;
        }

        return null;
      }

      const out = [];
      for (const b of bouts) {
        const A = playersIndex.get(b.blueId);
        const G = playersIndex.get(b.greenId);
        const avoid = new Set([A?.country, G?.country].filter(Boolean));
        const pool = getPool(b.gillam);
        const recent = getRecentArrays(b.gillam);

        const manualMain = b.manualMainRef || null;
        const manualJudge1 = b.manualJudge1 || null;
        const manualJudge2 = b.manualJudge2 || null;
        const hasManual = !!(manualMain || manualJudge1 || manualJudge2);

        const main = manualMain || takeCandidate(pool, avoid, recent.main);
        const j1 = manualJudge1 || takeCandidate(pool, avoid, recent.judge, new Set([main]));
        const j2 = manualJudge2 || takeCandidate(pool, avoid, recent.judge, new Set([main, j1]));

        if (main) {
          recent.main.unshift(main);
          if (recent.main.length > avoidSpan) recent.main.pop();
        }
        if (j1) recent.judge.unshift(j1);
        if (j2) recent.judge.unshift(j2);
        if (recent.judge.length > avoidSpan * 2) recent.judge.splice(avoidSpan * 2);

        out.push({
          boutNo: b.boutNo,
          mainRef: main,
          judge1: j1,
          judge2: j2,
          manual: hasManual,
          gillam: b.gillam || ""
        });
      }
      return out;
    }

    function computeScores(events) {
      const base = {
        blue: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
        green: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
        halalWinner: null,
        lastScoreSide: null,
        lastPenaltySide: null
      };

      function sideKey(s) { return s === "blue" ? "blue" : "green"; }

      for (const ev of events) {
        const s = sideKey(ev.side);
        const o = s === "blue" ? "green" : "blue";

        if (ev.type === "H" || ev.type === "YO" || ev.type === "CH") {
          if (ev.type === "H") {
            base[s].H += 1;
            if (!base.halalWinner) base.halalWinner = s;
          } else if (ev.type === "YO") {
            base[s].YO += 1;
          } else if (ev.type === "CH") {
            base[s].CH += 1;
          }
          while (base[s].YO >= 2) {
            base[s].YO -= 2;
            base[s].H += 1;
            if (!base.halalWinner) base.halalWinner = s;
          }
          base.lastScoreSide = s;
        } else if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
          const lvl = ev.type === "T" ? 1 : ev.type === "D" ? 2 : 3;
          if (lvl > base[s].penaltyLevel) {
            base[s].penaltyLevel = lvl;
            base.lastScoreSide = o;
            if (lvl === 3 && !base.halalWinner) {
              base.halalWinner = o;
            }
          }
          base.lastPenaltySide = s;
        }
      }

      const disp = {
        blue: { H: base.blue.H, YO: base.blue.YO, CH: base.blue.CH, penaltyLevel: base.blue.penaltyLevel },
        green: { H: base.green.H, YO: base.green.YO, CH: base.green.CH, penaltyLevel: base.green.penaltyLevel },
        halalWinner: base.halalWinner,
        lastScoreSide: base.lastScoreSide,
        lastPenaltySide: base.lastPenaltySide
      };

      const pBlue = base.blue.penaltyLevel;
      const pGreen = base.green.penaltyLevel;

      if (pGreen === 1) disp.blue.CH += 1;
      else if (pGreen === 2) disp.blue.YO += 1;
      else if (pGreen === 3) disp.blue.H += 1;

      if (pBlue === 1) disp.green.CH += 1;
      else if (pBlue === 2) disp.green.YO += 1;
      else if (pBlue === 3) disp.green.H += 1;

      ["blue", "green"].forEach((side) => {
        const s = disp[side];
        while (s.YO >= 2) {
          s.YO -= 2;
          s.H += 1;
          if (!disp.halalWinner) {
            disp.halalWinner = side;
          }
        }
      });

      return disp;
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function decideWinner(state, isTimeUp) {
      if (state.halalWinner) return state.halalWinner;

      const b = state.blue;
      const g = state.green;

      if (b.H !== g.H) return b.H > g.H ? "blue" : "green";
      if (b.YO !== g.YO) return b.YO > g.YO ? "blue" : "green";
      if (b.CH !== g.CH) return b.CH > g.CH ? "blue" : "green";

      if (!isTimeUp) return null;

      if (b.penaltyLevel !== g.penaltyLevel) {
        return b.penaltyLevel > g.penaltyLevel ? "green" : "blue";
      }

      if (state.lastPenaltySide) {
        return state.lastPenaltySide === "blue" ? "green" : "blue";
      }

      if (state.lastScoreSide) {
        return state.lastScoreSide;
      }

      return null;
    }

    function rankToStars(rank) {
      const n = Math.max(1, Math.min(3, Number(rank) || 1));
      return "★".repeat(n);
    }

    function formatRefDisplay(r, mode = "name_only") {
      if (!r) return "";
      const num = String(r.refNo || "").trim();
      const name = String(r.name || "").trim();
      const country = String(r.country || "").trim();
      const stars = rankToStars(r.rank);

      if (mode === "number_only") {
        return num ? `#${num}` : "";
      }

      if (mode === "number_name") {
        const left = num ? `#${num}` : "";
        const middle = name || "";
        const right = [country ? `(${country})` : "", stars].filter(Boolean).join(" ");
        return [left, middle, right].filter(Boolean).join(" ");
      }

      return [name || (num ? `#${num}` : ""), country ? `(${country})` : "", stars]
        .filter(Boolean)
        .join(" ");
    }


    // --- group key handling: "M|-81", "F|-63" ---
function groupKeyComparator(a, b) {
      const A = parseGroupKey(a);
      const B = parseGroupKey(b);
      if (A.ageGroupNumb !== B.ageGroupNumb) return A.ageGroupNumb - B.ageGroupNumb;
      if (A.sex !== B.sex) return A.sex === "M" ? -1 : 1;
      const numA = Number(String(A.weight).replace("+", "").replace("-", ""));
      const numB = Number(String(B.weight).replace("+", "").replace("-", ""));
      return numA - numB;
    }

      // helper to download CSV (used in reports)
      function downloadCSV(filename, columns, rows) {
        if (!rows || !rows.length) {
          alert("No data to export.");
          return;
        }
        const header = columns.map((c) => c.label).join(",");
        const lines = rows.map((row) =>
          columns
            .map((c) => {
              const v = row[c.key];
              const s = v == null ? "" : String(v);
              return '"' + s.replace(/"/g, '""') + '"';
            })
            .join(",")
        );
        const blob = new Blob([header + "\n" + lines.join("\n")], {
          type: "text/csv;charset=utf-8;"
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(url);
          a.remove();
        }, 500);
      }

      function ensureAudioContext() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audioCtxRef.current) {
          audioCtxRef.current = new AC();
        }
        const ctx = audioCtxRef.current;
        if (ctx.state === "suspended") {
          ctx.resume();
        }
        return ctx;
      }

      // Longer bell (~3 seconds)
      function playBell() {
        try {
          const ctx = ensureAudioContext();
          if (!ctx) return;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(1000, ctx.currentTime);
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + 0.1);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
          o.connect(g);
          g.connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + 3);
        } catch (e) {}
      }

      // Longer half-time ping (~3 seconds, different tone)
      function playHalfPing() {
        try {
          const ctx = ensureAudioContext();
          if (!ctx) return;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "square";
          o.frequency.setValueAtTime(600, ctx.currentTime);
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
          o.connect(g);
          g.connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + 3);
        } catch (e) {}
      }

          setTimerMs((ms) => {
            if (ms <= 1000) {
              if (ms > 0) {
                playBell();
              }
              setTimerRunning(false);
              return 0;
            }

            const newMs = ms - 1000;

            const initial = initialFightMsRef.current || 0;
            const halfMs = initial / 2;
            if (
              !halfPingDoneRef.current &&
              initial > 0 &&
              ms > halfMs &&
              newMs <= halfMs
            ) {
              const scores = sbComputedRef.current;
              if (scores) {
                const sides = ["blue", "green"];
                const allZero = sides.every((side) => {
                  const s = scores[side];
                  return (
                    s &&
                    s.H === 0 &&
                    s.YO === 0 &&
                    s.CH === 0 &&
                    s.penaltyLevel === 0
                  );
                });
                if (allZero) {
                  playHalfPing();
                  halfPingDoneRef.current = true;
                  setTimerRunning(false);
                }
              }
            }

            return newMs;
          });
        }, 1000);
        return () => clearInterval(id);

          }
          if (
            Object.prototype.hasOwnProperty.call(patch, "sex") ||
            Object.prototype.hasOwnProperty.call(patch, "actualKg") ||
            Object.prototype.hasOwnProperty.call(patch, "name") ||
            Object.prototype.hasOwnProperty.call(patch, "country") ||
            Object.prototype.hasOwnProperty.call(patch, "ageGroupNumb") ||
            Object.prototype.hasOwnProperty.call(patch, "dob")

          if (parts.length >= 4 && /^[MF]$/i.test(parts[2])) {
            const [name, countryIn, sexIn, actualRaw, seedRaw, dobRaw] = parts;
            const { code, full } = resolveAffiliation(countryIn, tournamentScope, affiliationMode);
            const sex = sexIn.toUpperCase();

            const age = calcAge(dob);
            const id = `${code}-${name.replace(/\s+/g, "").toUpperCase()}-${weight.replace("+", "P").replace("-", "N")}`;
            const detectedAgeGroupNumb = age !== "" ? ageGroupFromAge(age, tournamentScope) : ageGroupNumb;

          .split(/\r?\n/)

          .filter((l) => l && !l.startsWith("#"));
        const acc = [];
        let localIdx = refs.length + 1;

          const parts = line.split("|").map((p) => p.trim());
          let refNo = localIdx;
          let name = "";
          let countryIn = defaultAffiliation(tournamentScope, affiliationMode).full;
          let rank = 1;
          let assignScope = "global";
          let poolGillam = "";

          if (parts.length >= 6) {
            [refNo, name, countryIn, rank, assignScope, poolGillam] = parts;
          } else if (parts.length === 5) {
            [refNo, name, countryIn, rank, assignScope] = parts;
          } else if (parts.length === 4) {
            [refNo, name, countryIn, rank] = parts;
          } else if (parts.length === 3) {
            [name, countryIn, rank] = parts;
          } else if (parts.length >= 2) {
            [name, countryIn] = parts;
          } else {
            continue;
          }

          const { code, full } = resolveAffiliation(countryIn, tournamentScope, affiliationMode);
          const scopeNormalized = String(assignScope || "global").trim().toLowerCase() === "pool" ? "pool" : "global";

          acc.push({
            id: `REF-${String(localIdx).padStart(3, "0")}`,
            refNo: refNo || localIdx,
            name,
            countryFull: full,
            country: code,
            rank: Math.max(1, Math.min(3, Number(rank) || 1)),
            assignScope: scopeNormalized,
            poolGillam: poolGillam || ""
          });
          localIdx++;
        }
        setRefs((prev) => [...prev, ...acc]);

      function getEligibleRefereesForGillam(gillam, refsInput) {
        const source = Array.isArray(refsInput) ? refsInput : refs;
        if (refAssignmentMode !== "gillam_pool") {
          return source.slice();
        }
        return source.filter((r) => {
          const scope = (r?.assignScope || "global");
          if (scope === "global") return true;
          return (r?.poolGillam || "") === (gillam || "");
        });

      function getActiveGillamsFromConfig() {

          const cfg = weightConfig[gk];
          if (!cfg || !cfg.include) return;
          const gillamName = gillamNames[cfg.gillamIndex] || gillamNames[0];
          if (gillamName) active.add(gillamName);

        return Array.from(active);

      function buildWaveIndexByBout(scheduleInput) {
        const out = new Map();
        const perGillam = new Map();
        (scheduleInput?.bouts || []).forEach((b) => {
          const g = b.gillam || "";
          const wave = perGillam.get(g) || 0;
          out.set(b.boutNo, wave);
          perGillam.set(g, wave + 1);
        });
        return out;
      }

      function buildRefereeValidationPayload(scheduleInput) {
        const errors = [];
        const warnings = [];
        const errorSet = new Set();
        const warningSet = new Set();

        function pushError(msg) {
          if (!errorSet.has(msg)) {
            errorSet.add(msg);
            errors.push(msg);
          }
        }

        function pushWarning(msg) {
          if (!warningSet.has(msg)) {
            warningSet.add(msg);
            warnings.push(msg);
          }
        }

        if ((refs || []).length < 3) {
          pushError("At least 3 referees are required to generate assignments.");
        }

        const activeGillams = getActiveGillamsFromConfig();

        if (refAssignmentMode === "gillam_pool") {
          (refs || []).forEach((r) => {
            if ((r?.assignScope || "global") === "pool" && !(r?.poolGillam || "")) {
              pushError(`Referee ${formatRefDisplay(r, "number_name") || r.id || "Unknown"} is marked as Gillam Pool but has no Gillam selected.`);
            }
          });

          activeGillams.forEach((gillam) => {
            const eligible = getEligibleRefereesForGillam(gillam, refs);
            const dedicated = (refs || []).filter((r) => (r?.assignScope || "global") === "pool" && (r?.poolGillam || "") === gillam);
            if (eligible.length < 3) {
              pushError(`${gillam} has only ${eligible.length} eligible referees. Minimum required is 3.`);
            }
            if (!dedicated.length) {
              pushWarning(`${gillam} has no dedicated pool referees. It will rely entirely on global referees.`);
            }
          });
        }

        const scheduleObj = scheduleInput || schedule;
        if (scheduleObj?.assignments?.length) {
          const assignmentsByBout = new Map((scheduleObj.assignments || []).map((a) => [a.boutNo, a]));
          (scheduleObj.bouts || []).forEach((b) => {
            const asg = assignmentsByBout.get(b.boutNo) || {};
            const roles = [
              { key: "mainRef", label: "Main Ref" },
              { key: "judge1", label: "Judge 1" },
              { key: "judge2", label: "Judge 2" }
            ];
            const chosen = roles.map((r) => asg[r.key]).filter(Boolean);
            if (chosen.length && new Set(chosen).size !== chosen.length) {
              pushError(`Fight #${b.boutNo} has the same referee assigned more than once.`);
            }
            roles.forEach((r) => {
              if (!asg[r.key]) {
                pushError(`Fight #${b.boutNo} is missing ${r.label}.`);
              }
            });
          });

          const waveByBout = buildWaveIndexByBout(scheduleObj);
          const conflictMap = new Map();
          (scheduleObj.bouts || []).forEach((b) => {
            const asg = assignmentsByBout.get(b.boutNo) || {};
            const wave = waveByBout.get(b.boutNo) || 0;
            [asg.mainRef, asg.judge1, asg.judge2].filter(Boolean).forEach((refId) => {
              const key = `${refId}__${wave}`;
              if (!conflictMap.has(key)) conflictMap.set(key, []);
              conflictMap.get(key).push({ boutNo: b.boutNo, gillam: b.gillam || "" });
            });
          });
          conflictMap.forEach((items, key) => {
            if (items.length <= 1) return;
            const refId = key.split("__")[0];
            const refObj = (refs || []).find((r) => r.id === refId);
            const label = refObj ? formatRefDisplay(refObj, "number_name") : refId;
            const fights = items.map((it) => `#${it.boutNo} (${it.gillam})`).join(", ");
            pushWarning(`${label} appears in parallel wave assignments: ${fights}. Review cooldown / cross-mat availability.`);
          });
        }

        return { errors, warnings };
      }

      function buildRefereeSummaryRows(scheduleInput) {
        if (!scheduleInput?.assignments?.length) return [];
        const rows = (refs || []).map((r) => ({
          id: r.id,
          refNo: r.refNo || "",
          label: formatRefDisplay(r, "number_name") || r.name || r.id,
          country: r.country || "",
          scope: (r.assignScope || "global") === "pool" ? `Pool${r.poolGillam ? ` • ${r.poolGillam}` : ""}` : "Global",
          mainCount: 0,
          judge1Count: 0,
          judge2Count: 0,
          total: 0,
          manualCount: 0,
          gillamCounts: {}
        }));
        const byId = new Map(rows.map((r) => [r.id, r]));
        (scheduleInput.assignments || []).forEach((asg) => {
          const gillam = asg.gillam || ((scheduleInput.bouts || []).find((b) => b.boutNo === asg.boutNo)?.gillam) || "-";
          [[asg.mainRef, "mainCount"], [asg.judge1, "judge1Count"], [asg.judge2, "judge2Count"]].forEach(([refId, key]) => {
            if (!refId || !byId.has(refId)) return;
            const row = byId.get(refId);
            row[key] += 1;
            row.total += 1;
            row.gillamCounts[gillam] = (row.gillamCounts[gillam] || 0) + 1;
            if (asg.manual) row.manualCount += 1;
          });
        });
        const activeRows = rows.filter((r) => r.total > 0);
        const avgTotal = activeRows.length
          ? activeRows.reduce((sum, r) => sum + r.total, 0) / activeRows.length
          : 0;
        activeRows.forEach((r) => {
          r.imbalance = Math.round((r.total - avgTotal) * 100) / 100;
          r.gillamsText = Object.entries(r.gillamCounts)
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([g, n]) => `${g}: ${n}`)
            .join(" • ");
        });
        activeRows.sort((a, b) => b.total - a.total || b.mainCount - a.mainCount || String(a.label).localeCompare(String(b.label)));
        return activeRows;
      }

      function recalcAssignmentsWithCurrentRules(scheduleInput, refsInput) {
        if (!scheduleInput) return null;
        const pIndex = new Map(players.map((p) => [p.id, p]));
        const withManualOnBouts = scheduleInput.bouts.map((b) => {
          const existing = (scheduleInput.assignments || []).find((a) => a.boutNo === b.boutNo) || {};
          return {
            ...b,
            manualMainRef: existing.manual ? existing.mainRef : null,
            manualJudge1: existing.manual ? existing.judge1 : null,
            manualJudge2: existing.manual ? existing.judge2 : null
          };
        });
        const assignments = assignReferees(
          withManualOnBouts,
          pIndex,
          refsInput || refs,
          refAvoidSpan,
          { assignmentMode: refAssignmentMode, fallbackToGlobal: true }
        );
        return { ...scheduleInput, assignments };
      }

      function updateManualAssignment(boutNo, patch) {
        if (!ensureWritable("Manual referee assignment")) return;
        setSchedule((prev) => {
          if (!prev) return prev;
          const current = (prev.assignments || []).find((a) => a.boutNo === boutNo) || { boutNo };
          const nextItem = {
            ...current,
            ...patch,
            manual: true
          };
          const selected = [nextItem.mainRef, nextItem.judge1, nextItem.judge2].filter(Boolean);
          if (selected.length && new Set(selected).size !== selected.length) {
            alert("The same referee cannot be assigned twice in the same fight.");
            return prev;
          }
          const nextAssignments = (prev.assignments || []).filter((a) => a.boutNo !== boutNo);
          nextAssignments.push(nextItem);
          nextAssignments.sort((a, b) => a.boutNo - b.boutNo);
          const nextSchedule = { ...prev, assignments: nextAssignments };
          setDrawValidation(buildRefereeValidationPayload(nextSchedule));
          return nextSchedule;
        });
      }

      function clearManualAssignment(boutNo) {
        if (!ensureWritable("Manual referee assignment")) return;
        setSchedule((prev) => {
          if (!prev) return prev;
          const bout = (prev.bouts || []).find((b) => b.boutNo === boutNo);
          if (!bout) return prev;
          const remaining = (prev.assignments || []).filter((a) => a.boutNo !== boutNo);
          const pIndex = new Map(players.map((p) => [p.id, p]));
          const auto = assignReferees(
            [{ ...bout }],
            pIndex,
            refs,
            refAvoidSpan,
            { assignmentMode: refAssignmentMode, fallbackToGlobal: true }
          )[0];
          const nextSchedule = { ...prev, assignments: [...remaining, auto].sort((a, b) => a.boutNo - b.boutNo) };
          setDrawValidation(buildRefereeValidationPayload(nextSchedule));
          return nextSchedule;
        });
      }

      function generateSchedule() {
        if (!ensureWritable("Generating the schedule")) return;
        const byGroup = new Map(); // key: ageGroup|sex|weight-or-manual-group
        for (const p of players) {
          const slot = groupSlotOfPlayer(p, weightMode);
          if (!slot || !p.sex) continue;
          const key = groupKeyOfPlayer(p, weightMode);
          if (!byGroup.has(key)) byGroup.set(key, []);
          byGroup.get(key).push(p);
        }

        // per group bouts + local bracket links
        const perGroupBouts = {};
        const perGroupLinksLocal = {};

         for (const [gk, plistRaw] of byGroup.entries()) {
          // sort by seed then name for both RR & SE
          const plist = plistRaw.slice().sort(bySeedThenName);
          const groupSize = plist.length;

          if (groupSize <= roundRobinMax) {      // use setting
            // Round Robin
            const rrRounds = buildRoundRobinForWeight(plist);
            const rrPairs = rrRounds.flat();

            let rrBouts = rrPairs.map(([a, b], idx) => ({
              localId: idx + 1,
              type: "RR",
              round: 0,
              sourceA: { type: "player", playerId: a },
              sourceB: { type: "player", playerId: b },
              blueId: a,
              greenId: b
            }));

            // Move bouts involving Seed 1 and Seed 2 toward the end of the queue.
            const seedRank = new Map();
            plist.forEach((pl, idx) => {
              // The plist array is already sorted by bySeedThenName.
              seedRank.set(pl.id, idx + 1);
            });

            rrBouts.sort((b1, b2) => {
              const s1a = seedRank.get(b1.blueId) || 999;
              const s1b = seedRank.get(b1.greenId) || 999;
              const s2a = seedRank.get(b2.blueId) || 999;
              const s2b = seedRank.get(b2.greenId) || 999;

              const b1HasTop = s1a <= 2 || s1b <= 2;
              const b2HasTop = s2a <= 2 || s2b <= 2;
              const b1BothTop = s1a <= 2 && s1b <= 2;
              const b2BothTop = s2a <= 2 && s2b <= 2;

              const score1 = b1BothTop ? 2 : b1HasTop ? 1 : 0;
              const score2 = b2BothTop ? 2 : b2HasTop ? 1 : 0;

              if (score1 !== score2) return score1 - score2;

              const minSeed1 = Math.min(s1a, s1b);
              const minSeed2 = Math.min(s2a, s2b);
              return minSeed1 - minSeed2;
            });

            perGroupBouts[gk] = rrBouts;
            perGroupLinksLocal[gk] = {};
          } else {
            // Single Elimination
            const nodes = buildSingleEliminationNodes(plist);
            const groupBouts = nodes.map((node) => {
              const la = node.sourceA;
              const lb = node.sourceB;
              const blueId = la.type === "player" ? la.playerId : null;
              const greenId = lb.type === "player" ? lb.playerId : null;
              return {
                localId: node.localId,
                type: "SE",
                round: node.round,
                sourceA: la,
                sourceB: lb,
                blueId,
                greenId
              };
            });
            perGroupBouts[gk] = groupBouts;

            // build local links (winner goes to next round)
            const links = {};
            nodes.forEach((node) => {
              const toLocalId = node.localId;
              const addLink = (src, side) => {
                if (src.type === "bout") {
                  const fromId = src.boutLocalId;
                  if (!links[fromId]) links[fromId] = [];
                  links[fromId].push({ toLocalId, side });
                }
              };
              addLink(node.sourceA, "blue");
              addLink(node.sourceB, "green");
            });
            perGroupLinksLocal[gk] = links;
          }
        }

        // compute max round per group (for Single Elimination brackets)
        const maxRoundPerGroup = {};
        Object.entries(perGroupBouts).forEach(([gk, list]) => {
          const maxR = list
            .filter((b) => b.type === "SE")
            .reduce((acc, b) => Math.max(acc, b.round || 0), 0);
          maxRoundPerGroup[gk] = maxR;
        });

        // build mixed schedule:
        // 1) all Round Robin + early SE rounds (R1, R2, ...) mixed with rest constraint
        // 2) then all Semi-finals & Finals ordered by weight (lighter -> heavier) regardless of sex
        const allMixed = [];
        for (let gi = 0; gi < gillamNames.length; gi++) {
          const gName = gillamNames[gi];
          const weightsForGillam = weightsWithPlayers.filter((gk) => {
            const cfg = weightConfig[gk];
            return cfg && cfg.include && cfg.gillamIndex === gi;
          });
          if (!weightsForGillam.length) continue;

          const subInput = {};
          const lateRecords = [];

          for (const gk of weightsForGillam) {
            const boutsList = perGroupBouts[gk] || [];
            const maxR = maxRoundPerGroup[gk] || 0;

            const early = [];
            const late = [];

            boutsList.forEach((b) => {
              if (
                b.type === "SE" &&
                maxR >= 2 &&
                (b.round === maxR || b.round === maxR - 1)
              ) {
                // Semi-final or Final -> late block
                late.push(b);
              } else {
                // Round Robin or early SE rounds
                early.push(b);
              }
            });

            subInput[gk] = early;

            // cache late bouts with weight numeric value for later sorting
            const parsed = parseGroupKey(gk);
            const weightLabel = parsed.weight;
            const weightNumeric =
              Number(String(weightLabel).replace("+", "").replace("-", "")) || 0;

            late.forEach((b) => {
              lateRecords.push({
                gillamName: gName,
                groupKey: gk,
                boutDesc: b,
                weightNumeric,
                round: b.round || 0,
                maxRound: maxR
              });
            });
          }

          // mix early rounds across weights
          const mixedEarly = mixBoutsAcrossWeights(subInput, weightsForGillam);
          mixedEarly.forEach(([gk, boutDesc]) => {
            allMixed.push({ gillamName: gName, groupKey: gk, boutDesc });
          });

          // now add Semi-finals & Finals at the end of this Gillam:
          //   - first all Semi-finals (lighter -> heavier)
          //   - then all Finals (lighter -> heavier)
          lateRecords.sort((a, b) => {
            const isSemiA = a.maxRound >= 2 && a.round === a.maxRound - 1;
            const isFinalA = a.maxRound >= 1 && a.round === a.maxRound;
            const isSemiB = b.maxRound >= 2 && b.round === b.maxRound - 1;
            const isFinalB = b.maxRound >= 1 && b.round === b.maxRound;

            const rankA = isSemiA ? 0 : isFinalA ? 1 : 2;
            const rankB = isSemiB ? 0 : isFinalB ? 1 : 2;

            if (rankA !== rankB) return rankA - rankB;
            if (a.weightNumeric !== b.weightNumeric) {
              return a.weightNumeric - b.weightNumeric; // lighter first
            }
            return (a.groupKey || "").localeCompare(b.groupKey || "");
          });

          lateRecords.forEach((rec) => {
            allMixed.push({
              gillamName: rec.gillamName,
              groupKey: rec.groupKey,
              boutDesc: rec.boutDesc
            });
          });
        }

        // assign global bout numbers & build bracketLinks global
        const globalBouts = [];
        const localToGlobal = new Map(); // key: groupKey|localId -> boutNo
        let counter = 1;

        for (const item of allMixed) {
          const { gillamName, groupKey, boutDesc } = item;
          const { ageGroupNumb, sex, weight: weightLabel } = parseGroupKey(groupKey);
          const boutNo = counter++;
          localToGlobal.set(groupKey + "|" + boutDesc.localId, boutNo);

          let stage = "RR";
          if (boutDesc.type === "SE") {
            const maxR = maxRoundPerGroup[groupKey] || 0;
            if (maxR && boutDesc.round === maxR) {
              stage = "Final";
            } else if (maxR && boutDesc.round === maxR - 1) {
              stage = "Semi-final";
            } else {
              stage = "R" + boutDesc.round;
            }
          }

          globalBouts.push({
            boutNo,
            gillam: gillamName,
            ageGroupNumb,
            ageGroupLabel: ageGroupLabel(ageGroupNumb, tournamentScope),
            sex,
            weight: weightLabel,
            blueId: boutDesc.blueId,
            greenId: boutDesc.greenId,
            stage,
            groupKey,
            localId: boutDesc.localId,
            isElimination: boutDesc.type === "SE"
          });
        }

        const bracketLinks = {};
        Object.entries(perGroupLinksLocal).forEach(([gk, linksLocal]) => {
          Object.keys(linksLocal).forEach((fromLocalStr) => {
            const fromLocal = Number(fromLocalStr);
            const fromGlobal = localToGlobal.get(gk + "|" + fromLocal);
            if (!fromGlobal) return;
            const arrLocal = linksLocal[fromLocal];
            arrLocal.forEach((lnk) => {
              const toGlobal = localToGlobal.get(gk + "|" + lnk.toLocalId);
              if (!toGlobal) return;
              if (!bracketLinks[fromGlobal]) bracketLinks[fromGlobal] = [];
              bracketLinks[fromGlobal].push({
                toBoutNo: toGlobal,
                side: lnk.side
              });
            });
          });
        });

        const pIndex = new Map(players.map((p) => [p.id, p]));
        const assignments = assignReferees(
          globalBouts,
          pIndex,
          refs,
          refAvoidSpan,
          { assignmentMode: refAssignmentMode, fallbackToGlobal: true }
        );

        // Build the final schedule payload once.
        const schedulePayload = { bouts: globalBouts, assignments, bracketLinks };
        const validation = buildRefereeValidationPayload(schedulePayload);
        setDrawValidation(validation);

        if (validation.errors.length) {
          alert("Generate blocked until referee validation errors are fixed. Check the validation panel in Draw & Gillams.");
          return;
        }

        // Store the schedule in the app state.
        setSchedule(schedulePayload);
        setBoutMeta({});
        setActiveBoutNo(null);
        setSbEvents([]);
        setTimerMs(0);
        setTimerRunning(false);
        setShowMeta(false);
        initialFightMsRef.current = 0;
        halfPingDoneRef.current = false;

        // NEW: push schedule to backend if serverUrl is set
        syncScheduleToServer(schedulePayload);
      }

      function exportCSV() {
        if (!schedule) return;
        const { bouts, assignments } = schedule;
        const pIndex = new Map(players.map((p) => [p.id, p]));
        const header = [
          "BoutNo","Gillam","AgeGroup","Sex","Weight","BlueName","BlueAffiliation","GreenName","GreenAffiliation","Stage","MainRef","Judge1","Judge2"
        ];
        const lines = [header.join(",")];
        for (const b of bouts) {
          const A = pIndex.get(b.blueId);
          const G = pIndex.get(b.greenId);
          const asg = assignments.find((x) => x.boutNo === b.boutNo);
          const R1 = refs.find((r) => r.id === asg?.mainRef);
          const R2 = refs.find((r) => r.id === asg?.judge1);
          const R3 = refs.find((r) => r.id === asg?.judge2);
          lines.push([
            b.boutNo,
            b.gillam,
            b.ageGroupLabel || ageGroupLabel(b.ageGroupNumb, tournamentScope),
            b.sex || "",
            b.weight,
            A?.name || "",
            A?.country || "",
            G?.name || "",
            G?.country || "",
            b.stage,
            R1 ? `${R1.name} (${R1.country})` : "",
            R2 ? `${R2.name} (${R2.country})` : "",
            R3 ? `${R3.name} (${R3.country})` : ""
          ].join(","));
        }
        const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "kurash_draw_schedule.csv";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
      }

      function selectBoutForScore(no) {
        setActiveBoutNo(no);
        const meta = boutMeta[no];
        let initialMs = 0;

        if (schedule && no != null) {
          const bout = schedule.bouts.find((b) => b.boutNo === no);
          if (bout) {
            const pIndex = new Map(players.map((p) => [p.id, p]));
            const baseSec = matchDurationSecondsForBout(bout, pIndex, tournamentScope, manualDurationSeconds);
            initialMs = baseSec * 1000;
          }
        }

        if (meta) {
          setSbEvents(meta.events || []);
          if (meta.durationSec != null) {
            setTimerMs(meta.durationSec * 1000);
            initialFightMsRef.current = initialMs || (meta.durationSec * 1000);
          } else {
            setTimerMs(initialMs);
            initialFightMsRef.current = initialMs;
          }
        } else {
          setSbEvents([]);
          setTimerMs(initialMs);
          initialFightMsRef.current = initialMs;
        }
        setTimerRunning(false);
        setShowMeta(false);
        halfPingDoneRef.current = false;
      }

      function addEvent(side, type) {
        if (!ensureWritable("Scoring") || !activeBoutNo || !schedule) return;
        setSbEvents((prev) => [...prev, { side, type, atMs: timerMs }]);
      }

      function removeLastEvent(side, type) {
        if (!ensureWritable("Editing score events")) return;
        setSbEvents((prev) => {
          const next = prev.slice();
          for (let i = next.length - 1; i >= 0; i--) {
            const ev = next[i];
            if (ev.side === side && ev.type === type) {
              next.splice(i, 1);
              break;
            }
          }
          return next;
        });
      }

      function adjustTimerBySeconds(deltaSeconds) {
        if (!ensureWritable("Adjusting timer")) return;
        setTimerMs((prev) => Math.max(0, prev + deltaSeconds * 1000));
      }

      function handleScoreButton(side, type, isRightClick, canAdd, event) {
        if (event) event.preventDefault();
        if (isRightClick) {
          removeLastEvent(side, type);
        } else {
          if (!canAdd) return;
          addEvent(side, type);
        }
      }


      function fullResetCurrentBout() {
        if (!ensureWritable("Full reset") || !activeBoutNo || !schedule) return;
        const bout = schedule.bouts.find((b) => b.boutNo === activeBoutNo);
        const pIndex = new Map(players.map((p) => [p.id, p]));
        const sec = matchDurationSecondsForBout(bout, pIndex, tournamentScope, manualDurationSeconds);
        setTimerRunning(false);
        setSbEvents([]);
        setTimerMs(sec * 1000);
        initialFightMsRef.current = sec * 1000;
        halfPingDoneRef.current = false;
        setShowMeta(false);
        setBoutMeta((prev) => {
          const next = { ...prev };
          delete next[activeBoutNo];
          return next;
        });
      }

      async function sendIntegratedResultToServer(boutNo, payload) {
        const base = normalizedServerBase();
        if (!base) return null;
        try {
          const res = await fetch(base + "/api/bout/" + boutNo + "/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            console.error("Integrated scoreboard save failed:", res.status, data);
            setServerStatus("error");
            setServerStatusMsg("Result save failed: HTTP " + res.status);
            return null;
          }
          setServerStatus("ok");
          setServerStatusMsg("Result saved to server.");
          return data?.bout || null;
        } catch (err) {
          console.error("Integrated scoreboard save error:", err);
          setServerStatus("error");
          setServerStatusMsg("Error saving result to server.");
          return null;
        }
      }

      async function refreshResultsFromServer(silent = false) {
        const base = normalizedServerBase();
        if (!base) return;
        try {
          const res = await fetch(base + "/api/tournament/current");
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (!data?.schedule) return;
          setSchedule(data.schedule);
          setBoutMeta(buildBoutMetaFromSchedule(data.schedule));
          if (Array.isArray(data.players)) setPlayers(data.players);
          if (Array.isArray(data.refs)) setRefs(data.refs);
          if (data.meta) setCurrentTournamentMeta(data.meta);
          if (!silent) setTournamentActionMsg("Results refreshed from server.");
        } catch (err) {
          console.error("Refresh results error:", err);
          if (!silent) setTournamentActionMsg("Could not refresh results from server.");
        }
      }

      async function saveResultToBout() {
        if (!ensureWritable("Saving results") || !activeBoutNo || !schedule) return;
        const scores = computeScores(sbEvents);
        const isTimeUp = timerMs === 0;
        const winnerSide = decideWinner(scores, isTimeUp || !!scores.halalWinner);
        if (!winnerSide) {
          alert("No clear winner yet according to current scores and penalties.");
          return;
        }
        const durationMs = timerMs;
        const durationSec = Math.floor(durationMs / 1000);
        const localMeta = { events: sbEvents, durationSec, winner: winnerSide };
        setBoutMeta((prev) => ({
          ...prev,
          [activeBoutNo]: localMeta
        }));

        const bluePenalties = { T: 0, D: 0, G: 0 };
        const greenPenalties = { T: 0, D: 0, G: 0 };
        for (const ev of sbEvents) {
          if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
            const obj = ev.side === "blue" ? bluePenalties : greenPenalties;
            obj[ev.type] += 1;
          }
        }

        const metaEvents = sbEvents.map((ev) => ({
          timeSec: Math.floor(ev.atMs / 1000),
          timeStr: formatTime(ev.atMs),
          type: ev.type,
          side: ev.side,
          text: (ev.side === "blue" ? "BLUE " : "GREEN ") + ev.type
        }));

        const savedBoutFromServer = await sendIntegratedResultToServer(activeBoutNo, {
          winner: winnerSide,
          blueScore: {
            H: scores.blue.H,
            YO: scores.blue.YO,
            CH: scores.blue.CH
          },
          greenScore: {
            H: scores.green.H,
            YO: scores.green.YO,
            CH: scores.green.CH
          },
          bluePenalties,
          greenPenalties,
          meta: metaEvents,
          durationMs
        });

        setSchedule((prev) => {
          if (!prev) return prev;
          const updatedBouts = (prev.bouts || []).map((b) => {
            if (Number(b.boutNo) !== Number(activeBoutNo)) return b;
            return {
              ...b,
              ...(savedBoutFromServer || {}),
              winner: winnerSide,
              blueScore: { H: scores.blue.H, YO: scores.blue.YO, CH: scores.blue.CH },
              greenScore: { H: scores.green.H, YO: scores.green.YO, CH: scores.green.CH },
              bluePenalties,
              greenPenalties,
              meta: metaEvents,
              durationMs,
              finished: true,
              savedAt: savedBoutFromServer?.savedAt || new Date().toISOString()
            };
          });
          return { ...prev, bouts: updatedBouts };
        });

        // propagate winner to next elimination bout(s) if any
        const currentBout = schedule.bouts.find((b) => b.boutNo === activeBoutNo);
        const winnerPlayerId =
          winnerSide === "blue" ? currentBout?.blueId : currentBout?.greenId;

        if (winnerPlayerId && schedule.bracketLinks && schedule.bracketLinks[activeBoutNo]) {
          const links = schedule.bracketLinks[activeBoutNo];
          setSchedule((prev) => {
            if (!prev) return prev;
            const updatedBouts = prev.bouts.map((b) => {
              const link = links.find((lnk) => lnk.toBoutNo === b.boutNo);
              if (!link) return b;
              if (link.side === "blue" && b.blueId !== winnerPlayerId) {
                return { ...b, blueId: winnerPlayerId };
              }
              if (link.side === "green" && b.greenId !== winnerPlayerId) {
                return { ...b, greenId: winnerPlayerId };
              }
              return b;
            });
            return { ...prev, bouts: updatedBouts };
          });
        }

        alert("Result stored for bout #" + activeBoutNo);
      }

      function metaForBout(no) { return boutMeta[no] || null; }

      const timerColorClass = timerRunning ? "text-white" : "text-red-500";

      // group players by group/sex/country for reports
      const groupedPlayers = useMemo(() => {
        const byGroup = new Map();
        const bySex = { M: [], F: [] };
        const byCountry = new Map();
        players.forEach((p) => {
          const slot = groupSlotOfPlayer(p, weightMode);
          const gk = p.sex && slot ? groupKeyOfPlayer(p, weightMode) : null;
          if (gk) {
            if (!byGroup.has(gk)) byGroup.set(gk, []);
            byGroup.get(gk).push(p);
          }
          if (p.sex === "M" || p.sex === "F") bySex[p.sex].push(p);
          if (p.country) {
            if (!byCountry.has(p.country)) byCountry.set(p.country, []);
            byCountry.get(p.country).push(p);
          }
        });
        return { byGroup, bySex, byCountry };
      }, [players, weightMode, manualGroupsByAge]);

      // reports data (player / country / matches / penalties / counts)

        const boutsByGroup = new Map();
        schedule.bouts.forEach((b) => {
          const key = b.groupKey || (b.ageGroupNumb && b.sex && b.weight ? `${b.ageGroupNumb}|${b.sex}|${b.weight}` : "UNKNOWN");
          if (!boutsByGroup.has(key)) boutsByGroup.set(key, []);
          boutsByGroup.get(key).push(b);
        });

        const playerStats = new Map();

        function ensurePlayer(id) {
          if (!id) return null;
          if (!playerStats.has(id)) {
            const p = playersIndex.get(id);
            playerStats.set(id, {
              playerId: id,
              name: p?.name || "",
              country: p?.country || "",
              sex: p?.sex || "",
              weight: p?.weight || "",
              wins: 0,
              losses: 0,
              medals: []
            });
          }
          return playerStats.get(id);
        }

const groupModes = new Map(); // gk -> 'RR' or 'SE'
groupedPlayers.byGroup.forEach((plist, gk) => {
  groupModes.set(gk, plist.length <= roundRobinMax ? "RR" : "SE");
});


        // accumulate wins/losses from boutMeta
        Object.entries(boutMeta).forEach(([boutNoStr, meta]) => {
          const boutNo = Number(boutNoStr);
          const b = schedule.bouts.find((x) => x.boutNo === boutNo);
          if (!b) return;
          const blueId = b.blueId;
          const greenId = b.greenId;
          if (!blueId || !greenId) return;
          if (!meta || !meta.winner) return;
          const wp = meta.winner === "blue" ? blueId : greenId;
          const lp = meta.winner === "blue" ? greenId : blueId;
          const ws = ensurePlayer(wp);
          const ls = ensurePlayer(lp);
          if (ws) ws.wins += 1;
          if (ls) ls.losses += 1;
        });

        // medals from groups
        groupedPlayers.byGroup.forEach((plist, gk) => {
          const mode = groupModes.get(gk) || "RR";
          const boutList = boutsByGroup.get(gk) || [];
          let maxRound = 0;
          boutList.forEach((b) => {
            if (b.isElimination && b.stage && b.stage.startsWith("R")) {
              const r = Number(b.stage.slice(1)) || 0;
              if (r > maxRound) maxRound = r;
            }
            if (b.stage === "Semi-final") {
              if (maxRound < 2) maxRound = 2;
            }
            if (b.stage === "Final") {
              if (maxRound < 3) maxRound = 3;
            }
          });

          if (mode === "RR") {
            const stats = plist.map((p) => {
              const st = ensurePlayer(p.id) || {
                playerId: p.id,
                name: p.name,
                country: p.country,
                sex: p.sex,
                weight: p.weight,
                wins: 0,
                losses: 0,
                medals: []
              };
              return st;
            });
            stats.sort((a, b) => {
              if (b.wins !== a.wins) return b.wins - a.wins;
              if (a.losses !== b.losses) return a.losses - b.losses;
              return String(a.name || "").localeCompare(String(b.name || ""));
            });
            if (stats[0]) stats[0].medals.push("Gold");
            if (stats[1]) stats[1].medals.push("Silver");
            if (stats[2]) stats[2].medals.push("Bronze");
            if (stats[3]) stats[3].medals.push("Bronze");
          } else {
            if (!maxRound) return;
            // final
            const finalBouts = boutList.filter(
              (b) => b.stage === "Final" || (b.stage && b.stage.startsWith("R") && Number(b.stage.slice(1)) === maxRound)
            );
            const finalBout = finalBouts[0];
            if (finalBout) {
              const meta = boutMeta[finalBout.boutNo];
              if (meta && meta.winner && finalBout.blueId && finalBout.greenId) {
                const champId = meta.winner === "blue" ? finalBout.blueId : finalBout.greenId;
                const silverId = meta.winner === "blue" ? finalBout.greenId : finalBout.blueId;
                const champ = ensurePlayer(champId);
                const silver = ensurePlayer(silverId);
                if (champ) champ.medals.push("Gold");
                if (silver) silver.medals.push("Silver");
              }
            }
            // semi finals: losers get bronze
            const semiBouts = boutList.filter(
              (b) =>
                b.stage === "Semi-final" ||
                (b.stage && b.stage.startsWith("R") && Number(b.stage.slice(1)) === maxRound - 1)
            );
            semiBouts.forEach((b) => {
              const meta = boutMeta[b.boutNo];
              if (!meta || !meta.winner || !b.blueId || !b.greenId) return;
              const loserId = meta.winner === "blue" ? b.greenId : b.blueId;
              const st = ensurePlayer(loserId);
              if (st) st.medals.push("Bronze");
            });
          }
        });

        const playerResults = Array.from(playerStats.values()).sort((a, b) => {
          const medalWeight = (p) =>
            p.medals.includes("Gold")
              ? 3
              : p.medals.includes("Silver")
              ? 2
              : p.medals.includes("Bronze")
              ? 1
              : 0;
          const aw = medalWeight(a);
          const bw = medalWeight(b);
          if (bw !== aw) return bw - aw;
          if (b.wins !== a.wins) return b.wins - a.wins;
          if (a.losses !== b.losses) return a.losses - b.losses;
          return String(a.name || "").localeCompare(String(b.name || ""));
        });

        const countryStats = new Map();
        function addCountryMedal(country, medal) {
          if (!country) return;
          if (!countryStats.has(country)) {
            countryStats.set(country, { country, gold: 0, silver: 0, bronze: 0, total: 0 });
          }
          const cs = countryStats.get(country);
          if (medal === "Gold") cs.gold += 1;
          else if (medal === "Silver") cs.silver += 1;
          else if (medal === "Bronze") cs.bronze += 1;
          cs.total = cs.gold + cs.silver + cs.bronze;
        }
        playerResults.forEach((p) => {
          p.medals.forEach((m) => addCountryMedal(p.country, m));
        });
        const countryResults = Array.from(countryStats.values()).sort((a, b) => {
          if (b.gold !== a.gold) return b.gold - a.gold;
          if (b.silver !== a.silver) return b.silver - a.silver;
          if (b.bronze !== a.bronze) return b.bronze - a.bronze;
          return String(a.country).localeCompare(String(b.country));
        });

        const matchesReport = schedule.bouts.map((b) => {
          const A = b.blueId ? playersIndex.get(b.blueId) : null;
          const G = b.greenId ? playersIndex.get(b.greenId) : null;
          const meta = boutMeta[b.boutNo];
          let winnerName = "-";
          if (meta && meta.winner) {
            winnerName =
              meta.winner === "blue" ? (A?.name || "Blue") : (G?.name || "Green");
          }
          return {
            boutNo: b.boutNo,
            gillam: b.gillam,
            sex: b.sex === "F" ? "Women" : "Men",
            weight: b.weight,
            blueName: A?.name || "",
            blueCountry: A?.country || "",
            greenName: G?.name || "",
            greenCountry: G?.country || "",
            stage: b.stage || "",
            winnerName,
            duration: meta && meta.durationSec != null ? meta.durationSec : null
          };
        });

        const penaltiesReport = Object.entries(boutMeta)
          .map(([boutNoStr, meta]) => {
            const boutNo = Number(boutNoStr);
            const b = schedule.bouts.find((x) => x.boutNo === boutNo);
            const A = b && b.blueId ? playersIndex.get(b.blueId) : null;
            const G = b && b.greenId ? playersIndex.get(b.greenId) : null;
            const counts = {
              blue: { T: 0, D: 0, G: 0 },
              green: { T: 0, D: 0, G: 0 }
            };
            (meta.events || []).forEach((ev) => {
              if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
                const side = ev.side === "blue" ? "blue" : "green";
                counts[side][ev.type] += 1;
              }
            });
            return {
              boutNo,
              gillam: b?.gillam || "",
              sex: b?.sex === "F" ? "Women" : "Men",
              weight: b?.weight || "",
              blueName: A?.name || "",
              greenName: G?.name || "",
              blueT: counts.blue.T,
              blueD: counts.blue.D,
              blueG: counts.blue.G,
              greenT: counts.green.T,
              greenD: counts.green.D,
              greenG: counts.green.G
            };
          })
          .sort((a, b) => a.boutNo - b.boutNo);

        const refereeReport = schedule.bouts.map((b) => {
          const asg = schedule.assignments.find((x) => x.boutNo === b.boutNo);
          const mainRefObj = asg ? refs.find((r) => r.id === asg.mainRef) : null;
          const judge1Obj = asg ? refs.find((r) => r.id === asg.judge1) : null;
          const judge2Obj = asg ? refs.find((r) => r.id === asg.judge2) : null;
          return {
            boutNo: b.boutNo,
            gillam: b.gillam,
            sex: b.sex === "F" ? "Women" : "Men",
            weight: b.weight,
            mainRef: mainRefObj ? formatRefDisplay(mainRefObj, "number_name") : "",
            judge1: judge1Obj ? formatRefDisplay(judge1Obj, "number_name") : "",
            judge2: judge2Obj ? formatRefDisplay(judge2Obj, "number_name") : ""
          };
        });

        const playersByWeight = [];
        groupedPlayers.byGroup.forEach((plist, gk) => {
          const { sex, weight } = parseGroupKey(gk);
          const sexLabel = sex === "F" ? "Women" : "Men";
          const sorted = plist
            .slice()
            .sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));
          playersByWeight.push({ groupKey: gk, sexLabel, weight, players: sorted });
        });
        playersByWeight.sort((a, b) => groupKeyComparator(a.groupKey, b.groupKey));

        const countsByWeight = playersByWeight.map((g) => ({
          groupKey: g.groupKey,
          sexLabel: g.sexLabel,
          weight: g.weight,
          count: g.players.length
        }));

        const countsBySex = [
          { sex: "Men", count: groupedPlayers.bySex.M.length },
          { sex: "Women", count: groupedPlayers.bySex.F.length }
        ];

        const countryCounts = [];
        groupedPlayers.byCountry.forEach((plist, country) => {
          countryCounts.push({ country, count: plist.length });
        });
        countryCounts.sort((a, b) => b.count - a.count || a.country.localeCompare(b.country));

        const countsByCountrySex = [];
        groupedPlayers.byCountry.forEach((plist, country) => {
          const men = plist.filter((p) => p.sex === "M").length;
          const women = plist.filter((p) => p.sex === "F").length;
          countsByCountrySex.push({
            country,
            men,
            women,
            total: men + women
          });
        });
        countsByCountrySex.sort(
          (a, b) => b.total - a.total || a.country.localeCompare(b.country)
        );

        return {
          playerResults,
          countryResults,
          matchesReport,
          penaltiesReport,
          refereeReport,
          playersByWeight,
          countsByWeight,
          countsBySex,
          countryCounts,
          countsByCountrySex
        };
      }, [players, schedule, boutMeta, groupedPlayers, refs, weightMode, manualGroupsByAge, tournamentScope]);

      return (

                    greenName: G?.name || "",
                    greenCountry: G?.country || "",
                    mainRef: mainRefObj ? formatRefDisplay(mainRefObj, "number_name") : "",
                    judge1: judge1Obj ? formatRefDisplay(judge1Obj, "number_name") : "",
                    judge2: judge2Obj ? formatRefDisplay(judge2Obj, "number_name") : ""
                  });
                });
              }

              const refSummaryRows = buildRefereeSummaryRows(schedule);
              const refSummaryStats = {
                activeRefs: refSummaryRows.length,
                totalAssignments: refSummaryRows.reduce((sum, r) => sum + r.total, 0),
                maxTotal: refSummaryRows.length ? Math.max(...refSummaryRows.map((r) => r.total)) : 0,
                minTotal: refSummaryRows.length ? Math.min(...refSummaryRows.map((r) => r.total)) : 0
              };

              // --- PENALTIES & TANBEEH ROWS (T/D/G) ---
              const penaltyRows = [];
              if (hasSchedule) {
                schedule.bouts.forEach((b) => {
                  const meta = boutMeta[b.boutNo];
                  if (!meta || !meta.events || !meta.events.length) return;
                  const A = pIndex.get(b.blueId);
                  const G = pIndex.get(b.greenId);
                  meta.events.forEach((ev) => {
                    if (!["T", "D", "G"].includes(ev.type)) return;
                    const sideLabel = ev.side === "blue" ? "Blue" : "Green";
                    let typeLabel = ev.type;
                    if (ev.type === "T") typeLabel = "Tanbeeh (T)";
                    else if (ev.type === "D") typeLabel = "Dokki / Chala (D)";
                    else if (ev.type === "G") typeLabel = "Guram (G)";
                    penaltyRows.push({
                      boutNo: b.boutNo,
                      gillam: b.gillam,
                      sex: b.sex === "F" ? "Women" : "Men",
                      weight: b.weight,
                      blueName: A?.name || "",
                      greenName: G?.name || "",
                      side: sideLabel,
                      type: typeLabel,
                      time: formatTime(ev.atMs ?? 0)
                    });
                  });
                });
              }

              penaltyRows.sort((a, b) => {
                if (a.boutNo !== b.boutNo) return a.boutNo - b.boutNo;
                return a.time.localeCompare(b.time);
              });

              // --- PLAYERS BY WEIGHT (for list) ---
              const playersByWeightRows = [];
              groupedKeys.forEach((gk) => {
                const plist = (groupedPlayers.get(gk) || []).slice();
                plist.sort((a, b) =>
                  String(a.name || "").localeCompare(String(b.name || ""))
                );
                plist.forEach((p) => {
                  playersByWeightRows.push({
                    group: groupKeyLabel(gk),
                    name: p.name || "",
                    country: p.country || "",
                    sex: p.sex === "F" ? "F" : "M",
                    age: p.age !== "" && p.age != null ? p.age : "",
                    actualKg: p.actualKg || "",
                    seed: p.seed != null ? p.seed : ""
                  });
                });
              });

              // --- COUNTS SUMMARY ---
              const countByWeight = [];
              groupedKeys.forEach((gk) => {
                const plist = groupedPlayers.get(gk) || [];
                countByWeight.push({
                  group: groupKeyLabel(gk),
                  count: plist.length
                });
              });

              const countBySex = { M: 0, F: 0 };
              players.forEach((p) => {
                if (p.sex === "F") countBySex.F += 1;
                else countBySex.M += 1;
              });

              const countryMap = new Map(); // code => {code, full, M, F}
              players.forEach((p) => {
                const code = p.country || "";
                if (!code) return;
                if (!countryMap.has(code)) {
                  countryMap.set(code, {
                    code,
                    full: p.countryFull || code,
                    M: 0,
                    F: 0
                  });
                }
                const row = countryMap.get(code);
                if (p.sex === "F") row.F += 1;
                else row.M += 1;
              });
              const countryCountRows = Array.from(countryMap.values()).sort((a, b) =>
                String(a.full || a.code).localeCompare(String(b.full || b.code))
              );
              const totalCountries = countryCountRows.length;

              const downloadCSVFile = (filename, header, rows) => {
                if (!header || !rows) return;
                const lines = [
                  header.join(","),
                  ...rows.map((r) => header.map((h) => String(r[h] ?? "")).join(","))
                ];
                const blob = new Blob([lines.join("\n")], {
                  type: "text/csv;charset=utf-8;"
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                  URL.revokeObjectURL(url);
                  a.remove();
                }, 500);
              };

              // --- BUILD CSV STRUCTURE PER REPORT TAB ---
              let csvHeader = null;
              let csvRows = null;
              if (reportTab === "playerResults") {
                const rows = [];
                groupedKeys.forEach((gk) => {

                      Country: e.player.country || "",

                      Losses: e.losses,
                      Fights: e.fights
                    });
                  });
