<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kurash TMS Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #111827;
      padding: 30px;
      border-radius: 12px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .links a {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background: #1f2937;
      border-radius: 8px;
      color: white;
      text-decoration: none;
    }

    .links a:hover {
      background: #374151;
    }

    .server {
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="card">
    <h2>Kurash TMS</h2>
    <p>Enter Password</p>
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Enter</button>
    <p id="error" style="color:red;"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="card hidden">
    <h2>System Access</h2>

<div class="links">
  <a href="#" onclick="openMain()">MAIN</a>
  <a href="scoreboard_v5.html">Scoreboard</a>
  <a href="player_screenv3.html">Player Screen</a>
  <a href="referee_screen.html">Referee Screen</a>
</div>

    <button onclick="logout()" style="background:#ef4444;">Logout</button>

    <div class="server">
      Server Online:<br />
      https://kurash-tms.onrender.com
    </div>
  </div>

  <script>
    const PASSWORD = "51205120@bdc"; // 🔴 غيّرها هنا

    function login() {
      const input = document.getElementById("password").value;

      if (input === PASSWORD) {
        localStorage.setItem("auth", "1");
        showDashboard();
      } else {
        document.getElementById("error").innerText = "Wrong password";
      }
    }
const MAIN_PASSWORD = "1981"; // 🔴 غيرها

function openMain() {
  const pass = prompt("Enter MAIN password");

  if (pass === MAIN_PASSWORD) {
    window.location.href = "main%20-%20web.html";
  } else if (pass !== null) {
    alert("Wrong password");
  }
}
    function showDashboard() {
      document.getElementById("login").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
    }

    function logout() {
      localStorage.removeItem("auth");
      location.reload();
    }

    // Auto login if saved
    if (localStorage.getItem("auth") === "1") {
      showDashboard();
    }
  </script>

</body>
</html>
