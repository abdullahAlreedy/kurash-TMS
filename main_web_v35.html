            const manualGroup = manualGroupsForAge(manualGroupsByAge, detectedAgeGroupNumb, tournamentScope)[0];
            const slot = isManualGroupsMode(weightMode) ? manualGroup : finalWeight;
            const finalId = `${code}-${name.replace(/\s+/g, "").toUpperCase()}-${String(slot || "").replace("+", "P").replace("-", "N").replace(/\s+/g, "")}`;
            acc.push({ id: finalId, name, countryFull: full, country: code, sex, ageGroupNumb: detectedAgeGroupNumb, actualKg, weight: finalWeight, manualGroup, seed, dob, age });
          } else if (parts.length >= 3) {
            const [name, countryIn, weightIn, seedRaw] = parts;
            const { code, full } = resolveAffiliation(countryIn, tournamentScope, affiliationMode);
            const sex = "M";
            const actualKg = 0;
            const weight = (weightIn || "").replace(/\s+/g, "");
            const seed = seedRaw ? Number(seedRaw) : undefined;
            const id = `${code}-${name.replace(/\s+/g, "").toUpperCase()}-${weight.replace("+", "P").replace("-", "N")}`;
            const ageGroupNumb = defaultAgeGroupNumbForScope(tournamentScope);
            const manualGroup = manualGroupsForAge(manualGroupsByAge, ageGroupNumb, tournamentScope)[0];
            acc.push({ id, name, countryFull: full, country: code, sex, ageGroupNumb, actualKg, weight, manualGroup, seed, dob: "", age: "" });
          }
        }
        setPlayers((prev) => [...prev, ...acc]);
        markUnsynced();
      }

      function addRef() {
        if (!ensureWritable("Adding referees")) return;
        const defAff = defaultAffiliation(tournamentScope, affiliationMode);
        const nextNo = refs.length + 1;
        const r = {
          id: `REF-${String(nextNo).padStart(3, "0")}`,
          refNo: nextNo,
          name: "",
          countryFull: defAff.full,
          country: defAff.code,
          rank: 1,
          assignScope: "global",
          poolGillam: ""
        };
        setRefs((s) => [...s, r]);
        markUnsynced();
      }

      function recalcRef(idx, patch) {
        if (!ensureWritable("Editing referees")) return;
        setRefs((prev) => {
          let next = prev.slice();
          const current = next[idx] || {};
          const r = { ...current, ...patch };
          if (Object.prototype.hasOwnProperty.call(patch, "countryFull")) {
            const { code, full } = resolveAffiliation(patch.countryFull, tournamentScope, affiliationMode);
            r.countryFull = full;
            r.country = code;
          }
          r.rank = Math.max(1, Math.min(3, Number(r.rank) || 1));
          next[idx] = r;
          next = next.map((ref, i) => ({
            ...ref,
            id: `REF-${String(i + 1).padStart(3, "0")}`,
            refNo: i + 1,
            rank: Math.max(1, Math.min(3, Number(ref.rank) || 1)),
            assignScope: (ref.assignScope || "global") === "pool" ? "pool" : "global",
            poolGillam: ref.poolGillam || ""
          }));
          return next;
        });
        markUnsynced();
      }

      function setAllRefereeScopes(scope) {
        if (!ensureWritable("Changing referee scopes")) return;
        const nextScope = scope === "pool" ? "pool" : "global";
        setRefs((prev) => (prev || []).map((ref, i) => ({
          ...ref,
          id: `REF-${String(i + 1).padStart(3, "0")}`,
          refNo: i + 1,
          rank: Math.max(1, Math.min(3, Number(ref.rank) || 1)),
          assignScope: nextScope,
          poolGillam: nextScope === "pool" ? (ref.poolGillam || gillamNames[i % Math.max(1, gillamNames.length)] || "") : ""
        })));
        markUnsynced();
      }

      function randomizeRefereeGillamPools() {
        if (!ensureWritable("Balancing referee Gillam pools")) return;
        const names = Array.isArray(gillamNames) && gillamNames.length ? gillamNames : makeGillamNames(Math.max(1, numGillams));
        if (!names.length) return;
        setRefs((prev) => {
          const rows = (prev || []).map((ref, i) => ({ ref, originalIndex: i }));
          const shuffled = shuffle(rows);
          const poolByIndex = new Map();
          shuffled.forEach((row, order) => {
            poolByIndex.set(row.originalIndex, names[order % names.length]);
          });
          return rows.map(({ ref, originalIndex }, i) => ({
            ...ref,
            id: `REF-${String(i + 1).padStart(3, "0")}`,
            refNo: i + 1,
            rank: Math.max(1, Math.min(3, Number(ref.rank) || 1)),
            assignScope: "pool",
            poolGillam: poolByIndex.get(originalIndex) || names[i % names.length]
          }));
        });
        markUnsynced();
      }

      function handleImportRefsTXT(text) {
        if (!ensureWritable("Importing referees")) return;
        const lines = text
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter((l) => l && !l.startsWith("#"));
        const acc = [];
        let localIdx = refs.length + 1;
        for (const line of lines) {
          const parts = line.split("|").map((p) => p.trim());
          let refNo = localIdx;
          let name = "";
          let countryIn = defaultAffiliation(tournamentScope, affiliationMode).full;
          let rank = 1;
          let assignScope = "global";
          let poolGillam = "";

          if (parts.length >= 6) {
            [refNo, name, countryIn, rank, assignScope, poolGillam] = parts;
          } else if (parts.length === 5) {
            [refNo, name, countryIn, rank, assignScope] = parts;
          } else if (parts.length === 4) {
            [refNo, name, countryIn, rank] = parts;
          } else if (parts.length === 3) {
            [name, countryIn, rank] = parts;
          } else if (parts.length >= 2) {
            [name, countryIn] = parts;
          } else {
            continue;
          }

          const { code, full } = resolveAffiliation(countryIn, tournamentScope, affiliationMode);
          const scopeNormalized = String(assignScope || "global").trim().toLowerCase() === "pool" ? "pool" : "global";

          acc.push({
            id: `REF-${String(localIdx).padStart(3, "0")}`,
            refNo: refNo || localIdx,
            name,
            countryFull: full,
            country: code,
            rank: Math.max(1, Math.min(3, Number(rank) || 1)),
            assignScope: scopeNormalized,
            poolGillam: poolGillam || ""
          });
          localIdx++;
        }
        setRefs((prev) => [...prev, ...acc]);
        markUnsynced();
      }

      function getEligibleRefereesForGillam(gillam, refsInput) {
        const source = Array.isArray(refsInput) ? refsInput : refs;
        if (refAssignmentMode !== "gillam_pool") {
          return source.slice();
        }
        return source.filter((r) => {
          const scope = (r?.assignScope || "global");
          if (scope === "global") return true;
          return (r?.poolGillam || "") === (gillam || "");
        });
      }

      function getActiveGillamsFromConfig() {
        const active = new Set();
        weightsWithPlayers.forEach((gk) => {
          const cfg = weightConfig[gk];
          if (!cfg || !cfg.include) return;
          const gillamName = gillamNames[cfg.gillamIndex] || gillamNames[0];
          if (gillamName) active.add(gillamName);
        });
        return Array.from(active);
      }

      function buildWaveIndexByBout(scheduleInput) {
        const out = new Map();
        const perGillam = new Map();
        (scheduleInput?.bouts || []).forEach((b) => {
          const g = b.gillam || "";
          const wave = perGillam.get(g) || 0;
          out.set(b.boutNo, wave);
          perGillam.set(g, wave + 1);
        });
        return out;
      }

      function buildRefereeValidationPayload(scheduleInput) {
        const errors = [];
        const warnings = [];
        const errorSet = new Set();
        const warningSet = new Set();

        function pushError(msg) {
          if (!errorSet.has(msg)) {
            errorSet.add(msg);
            errors.push(msg);
          }
        }

        function pushWarning(msg) {
          if (!warningSet.has(msg)) {
            warningSet.add(msg);
            warnings.push(msg);
          }
        }

        if ((refs || []).length < 3) {
          pushError("At least 3 referees are required to generate assignments.");
        }

        const activeGillams = getActiveGillamsFromConfig();

        if (refAssignmentMode === "gillam_pool") {
          (refs || []).forEach((r) => {
            if ((r?.assignScope || "global") === "pool" && !(r?.poolGillam || "")) {
              pushError(`Referee ${formatRefDisplay(r, "number_name") || r.id || "Unknown"} is marked as Gillam Pool but has no Gillam selected.`);
            }
          });

          activeGillams.forEach((gillam) => {
            const eligible = getEligibleRefereesForGillam(gillam, refs);
            const dedicated = (refs || []).filter((r) => (r?.assignScope || "global") === "pool" && (r?.poolGillam || "") === gillam);
            if (eligible.length < 3) {
              pushError(`${gillam} has only ${eligible.length} eligible referees. Minimum required is 3.`);
            }
            if (!dedicated.length) {
              pushWarning(`${gillam} has no dedicated pool referees. It will rely entirely on global referees.`);
            }
          });
        }

        const scheduleObj = scheduleInput || schedule;
        if (scheduleObj?.assignments?.length) {
          const assignmentsByBout = new Map((scheduleObj.assignments || []).map((a) => [a.boutNo, a]));
          (scheduleObj.bouts || []).forEach((b) => {
            const asg = assignmentsByBout.get(b.boutNo) || {};
            const roles = [
              { key: "mainRef", label: "Main Ref" },
              { key: "judge1", label: "Judge 1" },
              { key: "judge2", label: "Judge 2" }
            ];
            const chosen = roles.map((r) => asg[r.key]).filter(Boolean);
            if (chosen.length && new Set(chosen).size !== chosen.length) {
              pushError(`Fight #${b.boutNo} has the same referee assigned more than once.`);
            }
            roles.forEach((r) => {
              if (!asg[r.key]) {
                pushError(`Fight #${b.boutNo} is missing ${r.label}.`);
              }
            });
          });

          const waveByBout = buildWaveIndexByBout(scheduleObj);
          const conflictMap = new Map();
          (scheduleObj.bouts || []).forEach((b) => {
            const asg = assignmentsByBout.get(b.boutNo) || {};
            const wave = waveByBout.get(b.boutNo) || 0;
            [asg.mainRef, asg.judge1, asg.judge2].filter(Boolean).forEach((refId) => {
              const key = `${refId}__${wave}`;
              if (!conflictMap.has(key)) conflictMap.set(key, []);
              conflictMap.get(key).push({ boutNo: b.boutNo, gillam: b.gillam || "" });
            });
          });
          conflictMap.forEach((items, key) => {
            if (items.length <= 1) return;
            const refId = key.split("__")[0];
            const refObj = (refs || []).find((r) => r.id === refId);
            const label = refObj ? formatRefDisplay(refObj, "number_name") : refId;
            const fights = items.map((it) => `#${it.boutNo} (${it.gillam})`).join(", ");
            pushWarning(`${label} appears in parallel wave assignments: ${fights}. Review cooldown / cross-mat availability.`);
          });
        }

        return { errors, warnings };
      }

      function buildRefereeSummaryRows(scheduleInput) {
        if (!scheduleInput?.assignments?.length) return [];
        const rows = (refs || []).map((r) => ({
          id: r.id,
          refNo: r.refNo || "",
          label: formatRefDisplay(r, "number_name") || r.name || r.id,
          country: r.country || "",
          scope: (r.assignScope || "global") === "pool" ? `Pool${r.poolGillam ? ` • ${r.poolGillam}` : ""}` : "Global",
          mainCount: 0,
          judge1Count: 0,
          judge2Count: 0,
          total: 0,
          manualCount: 0,
          gillamCounts: {}
        }));
        const byId = new Map(rows.map((r) => [r.id, r]));
        (scheduleInput.assignments || []).forEach((asg) => {
          const bout = (scheduleInput.bouts || []).find((b) => String(b.boutNo) === String(asg.boutNo));
          if (!isRefereeAllocationBout(bout)) return;
          const gillam = asg.gillam || bout?.gillam || "-";
          [[asg.mainRef, "mainCount"], [asg.judge1, "judge1Count"], [asg.judge2, "judge2Count"]].forEach(([refId, key]) => {
            if (!refId || !byId.has(refId)) return;
            const row = byId.get(refId);
            row[key] += 1;
            row.total += 1;
            row.gillamCounts[gillam] = (row.gillamCounts[gillam] || 0) + 1;
            if (asg.manual) row.manualCount += 1;
          });
        });
        const activeRows = rows.filter((r) => r.total > 0);
        const avgTotal = activeRows.length
          ? activeRows.reduce((sum, r) => sum + r.total, 0) / activeRows.length
          : 0;
        activeRows.forEach((r) => {
          r.imbalance = Math.round((r.total - avgTotal) * 100) / 100;
          r.gillamsText = Object.entries(r.gillamCounts)
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([g, n]) => `${g}: ${n}`)
            .join(" • ");
        });
        activeRows.sort((a, b) => b.total - a.total || b.mainCount - a.mainCount || String(a.label).localeCompare(String(b.label)));
        return activeRows;
      }

      function recalcAssignmentsWithCurrentRules(scheduleInput, refsInput) {
        if (!scheduleInput) return null;
        const pIndex = new Map(players.map((p) => [p.id, p]));
        const withManualOnBouts = scheduleInput.bouts.map((b) => {
          const existing = (scheduleInput.assignments || []).find((a) => a.boutNo === b.boutNo) || {};
          return {
            ...b,
            manualMainRef: existing.manual ? existing.mainRef : null,
            manualJudge1: existing.manual ? existing.judge1 : null,
            manualJudge2: existing.manual ? existing.judge2 : null
          };
        });
        const assignments = assignReferees(
          withManualOnBouts,
          pIndex,
          refsInput || refs,
          refAvoidSpan,
          { assignmentMode: refAssignmentMode, fallbackToGlobal: true, mainAvoidSpanMode: refAvoidSpanMode }
        );
        return { ...scheduleInput, assignments };
      }

      function updateManualAssignment(boutNo, patch) {
        if (!ensureWritable("Manual referee assignment")) return;
        setSchedule((prev) => {
          if (!prev) return prev;
          const current = (prev.assignments || []).find((a) => a.boutNo === boutNo) || { boutNo };
          const nextItem = {
            ...current,
            ...patch,
            manual: true
          };
          const selected = [nextItem.mainRef, nextItem.judge1, nextItem.judge2].filter(Boolean);
          if (selected.length && new Set(selected).size !== selected.length) {
            alert("The same referee cannot be assigned twice in the same fight.");
            return prev;
          }
          const nextAssignments = (prev.assignments || []).filter((a) => a.boutNo !== boutNo);
          nextAssignments.push(nextItem);
          nextAssignments.sort((a, b) => a.boutNo - b.boutNo);
          const nextSchedule = { ...prev, assignments: nextAssignments };
          setDrawValidation(buildRefereeValidationPayload(nextSchedule));
          return nextSchedule;
        });
      }

      function clearManualAssignment(boutNo) {
        if (!ensureWritable("Manual referee assignment")) return;
        setSchedule((prev) => {
          if (!prev) return prev;
          const bout = (prev.bouts || []).find((b) => b.boutNo === boutNo);
          if (!bout) return prev;
          const remaining = (prev.assignments || []).filter((a) => a.boutNo !== boutNo);
          const pIndex = new Map(players.map((p) => [p.id, p]));
          const auto = assignReferees(
            [{ ...bout }],
            pIndex,
            refs,
            refAvoidSpan,
            { assignmentMode: refAssignmentMode, fallbackToGlobal: true, mainAvoidSpanMode: refAvoidSpanMode }
          )[0];
          const nextSchedule = { ...prev, assignments: [...remaining, auto].sort((a, b) => a.boutNo - b.boutNo) };
          setDrawValidation(buildRefereeValidationPayload(nextSchedule));
          return nextSchedule;
        });
      }

      function startDrawPresentation() {
        const names = shuffle((players || [])
          .map((p) => String(p?.name || "").trim())
          .filter(Boolean))
          .slice(0, 28);
        if (!names.length) return;
        setDrawAnimation({ active: true, phase: "shuffling", names });
        setTimeout(() => {
          setDrawAnimation((prev) => prev.active ? { ...prev, phase: "locking" } : prev);
        }, 1300);
        setTimeout(() => {
          setDrawAnimation({ active: false, phase: "idle", names: [] });
        }, 3000);
      }

      function randomizeDrawGillamsEqually() {
        if (!ensureWritable("Balancing Gillams")) return;
        const names = Array.isArray(gillamNames) && gillamNames.length ? gillamNames : makeGillamNames(Math.max(1, Number(numGillams) || 1));
        if (!names.length) return;
        const activeGroups = shuffle((weightsWithPlayers || []).slice());
        setWeightConfig((prev) => {
          const next = { ...(prev || {}) };
          activeGroups.forEach((gk, idx) => {
            const old = next[gk] || { include: true, gillamIndex: 0 };
            next[gk] = { ...old, include: old.include !== false, gillamIndex: idx % names.length };
          });
          return next;
        });
        markUnsynced();
      }

      function generateSchedule() {
        if (!ensureWritable("Generating the schedule")) return;
        const signoffSummary = delegationSignoffSummary();
        if (signoffSummary.pending > 0) {
          const pendingNames = signoffSummary.affiliations.filter((a) => !a.signed).map((a) => a.name).join(", ");
          const proceed = window.confirm(`Delegation sign-off warning:\n${signoffSummary.pending} affiliation(s) have not signed their final team list.\n\nPending: ${pendingNames || "-"}\n\nContinue generating the draw anyway?`);
          if (!proceed) return;
        }
        startDrawPresentation();
        const byGroup = new Map(); // key: ageGroup|sex|weight-or-manual-group
        for (const p of players) {
          const slot = groupSlotOfPlayer(p, weightMode);
          if (!slot || !p.sex) continue;
          const key = groupKeyOfPlayer(p, weightMode);
          if (!byGroup.has(key)) byGroup.set(key, []);
          byGroup.get(key).push(p);
        }

        // per group bouts + local bracket links
        const perGroupBouts = {};
        const perGroupLinksLocal = {};

         for (const [gk, plistRaw] of byGroup.entries()) {
          // Draw rule v35.3:
          // - seed > 0: distribute seeded players apart in bracket positions.
          // - seed = 0 or empty: treated as unseeded and shuffled randomly on every Generate Draw click.
          // - mixed groups: seeded players keep seeding, all zero/empty seed players are shuffled into the remaining slots.
          const plist = seededRandomizedPlayerOrder(plistRaw);
          const groupSize = plist.length;

          if (groupSize <= roundRobinMax) {      // use setting
            // Round Robin
            const rrRounds = buildRoundRobinForWeight(plist);
            const rrPairs = rrRounds.flat();

            let rrBouts = rrPairs.map(([a, b], idx) => ({
              localId: idx + 1,
              type: "RR",
              round: 0,
              sourceA: { type: "player", playerId: a },
              sourceB: { type: "player", playerId: b },
              blueId: a,
              greenId: b
            }));

            // Move bouts involving Seed 1 and Seed 2 toward the end of the queue.
            const seedRank = new Map();
            plist.forEach((pl, idx) => {
              const seed = normalizedSeedValue(pl);
              if (seed > 0) seedRank.set(pl.id, seed);
            });

            rrBouts.sort((b1, b2) => {
              const s1a = seedRank.get(b1.blueId) || 999;
              const s1b = seedRank.get(b1.greenId) || 999;
              const s2a = seedRank.get(b2.blueId) || 999;
              const s2b = seedRank.get(b2.greenId) || 999;

              const b1HasTop = s1a <= 2 || s1b <= 2;
              const b2HasTop = s2a <= 2 || s2b <= 2;
              const b1BothTop = s1a <= 2 && s1b <= 2;
              const b2BothTop = s2a <= 2 && s2b <= 2;

              const score1 = b1BothTop ? 2 : b1HasTop ? 1 : 0;
              const score2 = b2BothTop ? 2 : b2HasTop ? 1 : 0;

              if (score1 !== score2) return score1 - score2;

              const minSeed1 = Math.min(s1a, s1b);
              const minSeed2 = Math.min(s2a, s2b);
              return minSeed1 - minSeed2;
            });

            perGroupBouts[gk] = rrBouts;
            perGroupLinksLocal[gk] = {};
          } else {
            // Single Elimination
            const nodes = buildSingleEliminationNodes(plistRaw, byeAllocationMode);
            const groupBouts = nodes.map((node) => {
              const la = node.sourceA;
              const lb = node.sourceB;
              const blueId = la.type === "player" ? la.playerId : null;
              const greenId = lb.type === "player" ? lb.playerId : null;
              return {
                localId: node.localId,
                type: "SE",
                round: node.round,
                sourceA: la,
                sourceB: lb,
                blueId,
                greenId
              };
            });
            perGroupBouts[gk] = groupBouts;

            // build local links (winner goes to next round)
            const links = {};
            nodes.forEach((node) => {
              const toLocalId = node.localId;
              const addLink = (src, side) => {
                if (src.type === "bout") {
                  const fromId = src.boutLocalId;
                  if (!links[fromId]) links[fromId] = [];
                  links[fromId].push({ toLocalId, side });
                }
              };
              addLink(node.sourceA, "blue");
              addLink(node.sourceB, "green");
            });
            perGroupLinksLocal[gk] = links;
          }
        }

        // compute max round per group (for Single Elimination brackets)
        const maxRoundPerGroup = {};
        Object.entries(perGroupBouts).forEach(([gk, list]) => {
          const maxR = list
            .filter((b) => b.type === "SE")
            .reduce((acc, b) => Math.max(acc, b.round || 0), 0);
          maxRoundPerGroup[gk] = maxR;
        });

        // build mixed schedule:
        // 1) all Round Robin + early SE rounds (R1, R2, ...) mixed with rest constraint
        // 2) then all Semi-finals & Finals ordered by weight (lighter -> heavier) regardless of sex
        const allMixed = [];
        for (let gi = 0; gi < gillamNames.length; gi++) {
          const gName = gillamNames[gi];
          const weightsForGillam = weightsWithPlayers.filter((gk) => {
            const cfg = weightConfig[gk];
            return cfg && cfg.include && cfg.gillamIndex === gi;
          });
          if (!weightsForGillam.length) continue;

          const subInput = {};
          const lateRecords = [];

          for (const gk of weightsForGillam) {
            const boutsList = perGroupBouts[gk] || [];
            const maxR = maxRoundPerGroup[gk] || 0;

            const early = [];
            const late = [];

            boutsList.forEach((b) => {
              if (
                b.type === "SE" &&
                maxR >= 2 &&
                (b.round === maxR || b.round === maxR - 1)
              ) {
                // Semi-final or Final -> late block
                late.push(b);
              } else {
                // Round Robin or early SE rounds
                early.push(b);
              }
            });

            subInput[gk] = early;

            // cache late bouts with weight numeric value for later sorting
            const parsed = parseGroupKey(gk);
            const weightLabel = parsed.weight;
            const weightNumeric =
              Number(String(weightLabel).replace("+", "").replace("-", "")) || 0;

            late.forEach((b) => {
              lateRecords.push({
                gillamName: gName,
                groupKey: gk,
                boutDesc: b,
                weightNumeric,
                round: b.round || 0,
                maxRound: maxR
              });
            });
          }

          // mix early rounds across weights
          const mixedEarly = mixBoutsAcrossWeights(subInput, weightsForGillam);
          mixedEarly.forEach(([gk, boutDesc]) => {
            allMixed.push({ gillamName: gName, groupKey: gk, boutDesc });
          });

          // now add Semi-finals & Finals at the end of this Gillam:
          //   - first all Semi-finals (lighter -> heavier)
          //   - then all Finals (lighter -> heavier)
          lateRecords.sort((a, b) => {
            const isSemiA = a.maxRound >= 2 && a.round === a.maxRound - 1;
            const isFinalA = a.maxRound >= 1 && a.round === a.maxRound;
            const isSemiB = b.maxRound >= 2 && b.round === b.maxRound - 1;
            const isFinalB = b.maxRound >= 1 && b.round === b.maxRound;

            const rankA = isSemiA ? 0 : isFinalA ? 1 : 2;
            const rankB = isSemiB ? 0 : isFinalB ? 1 : 2;

            if (rankA !== rankB) return rankA - rankB;
            if (a.weightNumeric !== b.weightNumeric) {
              return a.weightNumeric - b.weightNumeric; // lighter first
            }
            return (a.groupKey || "").localeCompare(b.groupKey || "");
          });

          lateRecords.forEach((rec) => {
            allMixed.push({
              gillamName: rec.gillamName,
              groupKey: rec.groupKey,
              boutDesc: rec.boutDesc
            });
          });
        }

        // assign public bout numbers & build bracketLinks global
        // Patch 5Q rule:
        // BYE / auto-advance artifacts must not consume the public fight order.
        // If a non-real internal bout ever exists, it receives a decimal internal number
        // (for example 70.1) and is excluded from dropdowns/referee allocation.
        const globalBouts = [];
        const localToGlobal = new Map(); // key: groupKey|localId -> boutNo
        let counter = 1;
        let internalByeSerial = 0;

        function isHardByeGeneratedSlot(value) {
          const t = String(value ?? "").trim().toUpperCase();
          return t === "BYE" || t === "BYE_EMPTY" || t === "AUTO_ADVANCE" ;
        }

        function isInternalNonFightOrderBoutDesc(desc) {
          if (!desc) return true;
          if (desc.autoAdvanced === true) return true;
          if (isHardByeGeneratedSlot(desc.blueId) || isHardByeGeneratedSlot(desc.greenId)) return true;
          return false;
        }

        for (const item of allMixed) {
          const { gillamName, groupKey, boutDesc } = item;
          const { ageGroupNumb, sex, weight: weightLabel } = parseGroupKey(groupKey);
          const internalNonFightOrder = isInternalNonFightOrderBoutDesc(boutDesc);
          const boutNo = internalNonFightOrder
            ? Number(`${Math.max(1, counter - 1)}.${++internalByeSerial}`)
            : counter++;
          if (!internalNonFightOrder) internalByeSerial = 0;
          localToGlobal.set(groupKey + "|" + boutDesc.localId, boutNo);

          let stage = "RR";
          if (boutDesc.type === "SE") {
            const maxR = maxRoundPerGroup[groupKey] || 0;
            if (maxR && boutDesc.round === maxR) {
              stage = "Final";
            } else if (maxR && boutDesc.round === maxR - 1) {
              stage = "Semi-final";
            } else {
              stage = "R" + boutDesc.round;
            }
          }

          globalBouts.push({
            boutNo,
            publicBoutNo: internalNonFightOrder ? null : boutNo,
            internalBoutNo: internalNonFightOrder ? boutNo : null,
            internalOnly: !!internalNonFightOrder,
            excludedFromFightOrder: !!internalNonFightOrder,
            gillam: gillamName,
            ageGroupNumb,
            ageGroupLabel: ageGroupLabel(ageGroupNumb, tournamentScope),
            sex,
            weight: weightLabel,
            blueId: boutDesc.blueId,
            greenId: boutDesc.greenId,
            stage,
            groupKey,
            localId: boutDesc.localId,
            isElimination: boutDesc.type === "SE"
          });
        }

        const bracketLinks = {};
        Object.entries(perGroupLinksLocal).forEach(([gk, linksLocal]) => {
          Object.keys(linksLocal).forEach((fromLocalStr) => {
            const fromLocal = Number(fromLocalStr);
            const fromGlobal = localToGlobal.get(gk + "|" + fromLocal);
            if (!fromGlobal) return;
            const arrLocal = linksLocal[fromLocal];
            arrLocal.forEach((lnk) => {
              const toGlobal = localToGlobal.get(gk + "|" + lnk.toLocalId);
              if (!toGlobal) return;
              if (!bracketLinks[fromGlobal]) bracketLinks[fromGlobal] = [];
              bracketLinks[fromGlobal].push({
                toBoutNo: toGlobal,
                side: lnk.side
              });
            });
          });
        });

        const pIndex = new Map(players.map((p) => [p.id, p]));
        const assignments = assignReferees(
          globalBouts,
          pIndex,
          refs,
          refAvoidSpan,
          { assignmentMode: refAssignmentMode, fallbackToGlobal: true, mainAvoidSpanMode: refAvoidSpanMode }
        );

        // Build the final schedule payload once.
        const schedulePayload = { bouts: globalBouts, assignments, bracketLinks };
        const validation = buildRefereeValidationPayload(schedulePayload);
        setDrawValidation(validation);

        if (validation.errors.length) {
          alert("Generate blocked until referee validation errors are fixed. Check the validation panel in Draw & Gillams.");
          return;
        }

        // Store the schedule in the app state.
        setSchedule(schedulePayload);
        setBoutMeta({});
        setActiveBoutNo(null);
        setSbEvents([]);
        setTimerMs(0);
        setTimerRunning(false);
        setShowMeta(false);
        initialFightMsRef.current = 0;
        halfPingDoneRef.current = false;
        markUnsynced();

        // NEW: push schedule to backend if serverUrl is set
        syncScheduleToServer(schedulePayload);
      }

      function delegationAffiliationName(p) {
        return String(
          p?.countryFull ||
          p?.affiliation ||
          p?.club ||
          p?.country ||
          "No Affiliation"
        ).trim() || "No Affiliation";
      }

      const delegationAffiliations = useMemo(() => {
        const map = new Map();
        (players || []).forEach((p) => {
          const name = delegationAffiliationName(p);
          if (!map.has(name)) map.set(name, { name, count: 0 });
          map.get(name).count += 1;
        });
        return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
      }, [players]);

      const selectedDelegationPlayers = useMemo(() => {
        const selected = delegationAffiliation || delegationAffiliations[0]?.name || "";
        return (players || []).filter((p) => delegationAffiliationName(p) === selected);
      }, [players, delegationAffiliation, delegationAffiliations]);

      useEffect(() => {
        if (!delegationAffiliation && delegationAffiliations.length) {
          setDelegationAffiliation(delegationAffiliations[0].name);
        }
      }, [delegationAffiliation, delegationAffiliations]);

      function delegationSignoffSummary() {
        const list = delegationAffiliations.map((a) => ({
          ...a,
          approval: delegationApprovals?.[a.name] || null,
          signed: !!delegationApprovals?.[a.name]?.signedAt
        }));
        const unsigned = list.filter((x) => !x.signed);
        return {
          affiliations: list,
          signed: list.filter((x) => x.signed),
          unsigned,
          pending: unsigned.length
        };
      }

      function signatureCanvasPoint(e) {
        const canvas = delegationSignatureRef.current;
        if (!canvas) return null;
        const rect = canvas.getBoundingClientRect();
        const p = e.touches && e.touches[0] ? e.touches[0] : e;
        const scaleX = rect.width ? canvas.width / rect.width : 1;
        const scaleY = rect.height ? canvas.height / rect.height : 1;
        return { x: (p.clientX - rect.left) * scaleX, y: (p.clientY - rect.top) * scaleY };
      }

      function beginDelegationSignature(e) {
        e.preventDefault?.();
        const canvas = delegationSignatureRef.current;
        const pt = signatureCanvasPoint(e);
        if (!canvas || !pt) return;
        delegationDrawingRef.current = true;
        const ctx = canvas.getContext("2d");
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#0057c2";
        ctx.beginPath();
        ctx.moveTo(pt.x, pt.y);
      }

      function moveDelegationSignature(e) {
        if (!delegationDrawingRef.current) return;
        e.preventDefault?.();
        const canvas = delegationSignatureRef.current;
        const pt = signatureCanvasPoint(e);
        if (!canvas || !pt) return;
        const ctx = canvas.getContext("2d");
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
      }

      function endDelegationSignature(e) {
        e?.preventDefault?.();
        delegationDrawingRef.current = false;
      }

      function clearDelegationSignature() {
        const canvas = delegationSignatureRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function delegationSignatureDataUrl() {
        const canvas = delegationSignatureRef.current;
        if (!canvas) return "";
        return canvas.toDataURL("image/png");
      }

      function hasDelegationSignature() {
        const canvas = delegationSignatureRef.current;
        if (!canvas) return false;
        const ctx = canvas.getContext("2d");
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] !== 0) return true;
        }
        return false;
      }

      async function refreshDelegationApprovalsFromServer() {
        const base = normalizedServerBase();
        if (!base) {
          setDelegationStatusMsg("Enter server URL first, or continue with local approval status.");
          return;
        }
        try {
          const res = await fetch(base + "/api/delegation-signoff");
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          setDelegationApprovals(data.approvals || {});
          setDelegationStatusMsg("Delegation approvals refreshed from server.");
        } catch (err) {
          console.error("Delegation approval refresh failed", err);
          setDelegationStatusMsg("Could not refresh delegation approvals from server.");
        }
      }

      function drawDelegationSignatureFromDataUrl(dataUrl) {
        const canvas = delegationSignatureRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!dataUrl) return;
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const scale = Math.min(canvas.width / img.width, canvas.height / img.height, 1);
          const w = img.width * scale;
          const h = img.height * scale;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h) / 2;
          ctx.drawImage(img, x, y, w, h);
        };
        img.src = dataUrl;
      }

      useEffect(() => {
        const approval = delegationApprovals?.[delegationAffiliation];
        if (approval?.signedAt) {
          setDelegationRepresentativeName(approval.representativeName || "");
          setDelegationConfirm(true);
          setTimeout(() => drawDelegationSignatureFromDataUrl(approval.signatureDataUrl || ""), 0);
        } else {
          setDelegationRepresentativeName("");
          setDelegationConfirm(false);
          setTimeout(clearDelegationSignature, 0);
        }
      }, [delegationAffiliation, delegationApprovals]);

      async function submitDelegationApproval() {
        const affiliation = delegationAffiliation || delegationAffiliations[0]?.name || "";
        const representativeName = String(delegationRepresentativeName || "").trim();
        if (!affiliation) {
          alert("Select an affiliation first.");
          return;
        }
        if (!selectedDelegationPlayers.length) {
          alert("No players found for this affiliation.");
          return;
        }
        if (!representativeName) {
          alert("Enter representative name first.");
          return;
        }
        if (!delegationConfirm) {
          alert("Please confirm that the displayed data is correct.");
          return;
        }
        if (!hasDelegationSignature()) {
          alert("Please draw the representative signature first.");
          return;
        }
        const approval = {
          affiliation,
          representativeName,
          confirmationText: "I confirm that the above data is correct.",
          signatureDataUrl: delegationSignatureDataUrl(),
          playerSnapshot: selectedDelegationPlayers.map((p) => ({
            id: p.id,
            name: p.name,
            country: p.country,
            countryFull: p.countryFull,
            sex: p.sex,
            dob: p.dob,
            age: p.age,
            actualKg: p.actualKg,
            weight: p.weight,
            manualGroup: p.manualGroup,
            ageGroupNumb: p.ageGroupNumb,
            ageGroupLabel: ageGroupLabel(p.ageGroupNumb, tournamentScope)
          })),
          signedAt: new Date().toISOString()
        };
        const base = normalizedServerBase();
        if (!base) {
          setDelegationApprovals((prev) => ({ ...prev, [affiliation]: { ...approval, localOnly: true } }));
          setDelegationStatusMsg("Delegation approval saved locally. Connect the server to save official archive.");
          return;
        }
        try {
          const res = await fetch(base + "/api/delegation-signoff", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(approval)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data?.error || ("HTTP " + res.status));
          setDelegationApprovals(data.approvals || { ...delegationApprovals, [affiliation]: data.approval });
          setDelegationRepresentativeName("");
          setDelegationConfirm(false);
          clearDelegationSignature();
          setDelegationStatusMsg("Approval submitted and archived for " + affiliation + ".");
          try { localStorage.setItem("kurash_delegation_signoff_updated_at", String(Date.now())); } catch (e) {}
        } catch (err) {
          console.error("Delegation approval submit failed", err);
          setDelegationStatusMsg("Could not submit approval: " + err.message);
        }
      }

      function formatApprovalTimeOnly(value) {
        if (!value) return "";
        const raw = String(value);
        const m = raw.match(/T(\d{2}:\d{2})/);
        if (m) return m[1];
        const d = new Date(value);
        if (!Number.isNaN(d.getTime())) return d.toISOString().slice(11, 16);
        return raw.slice(0, 5);
      }

      function openDelegationDocument(approval) {
        if (!approval) return;
        const base = normalizedServerBase();
        if (base && approval.approvalId) {
          window.open(base + "/api/delegation-signoff/document/" + encodeURIComponent(approval.approvalId), "_blank");
          return;
        }
        const rows = (approval.playerSnapshot || []).map((p, idx) => `<tr><td>${idx + 1}</td><td>${String(p.name || "")}</td><td>${String(p.sex || "")}</td><td>${String(p.age || "")}</td><td>${String(p.actualKg || "")}</td><td>${String(p.weight || "")}</td></tr>`).join("");
        const html = `<!doctype html><html><head><meta charset="utf-8"><title>Delegation Approval</title><style>body{font-family:Arial;padding:24px;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;text-align:left}th{background:#f0f0f0}.sig{max-width:420px;max-height:170px;border:0;margin-top:6px}.meta{border:0;padding:0;margin:12px 0}.signature-title{color:#0057c2;font-weight:800}</style></head><body><h1>Delegation Team List Approval</h1><div class="meta"><p><b>Tournament:</b> ${currentTournamentMeta?.name || ""}</p><p><b>Affiliation:</b> ${approval.affiliation}</p><p><b>Representative:</b> ${approval.representativeName}</p><p><b>Signed at:</b> ${formatApprovalTimeOnly(approval.signedAt)}</p></div><p>I confirm that the above data is correct.</p><table><thead><tr><th>#</th><th>Name</th><th>Sex</th><th>Age</th><th>Actual Weight</th><th>Class/Group</th></tr></thead><tbody>${rows}</tbody></table><h3 class="signature-title">Signature</h3><img class="sig" src="${approval.signatureDataUrl || ""}"></body></html>`;
        const w = window.open("", "_blank");
        if (w) { w.document.write(html); w.document.close(); }
      }

      function exportCSV() {
        if (!schedule) return;
        const { bouts, assignments } = schedule;
        const pIndex = new Map(players.map((p) => [p.id, p]));
        const header = [
          "BoutNo","Gillam","AgeGroup","Sex","Weight","BlueName","BlueAffiliation","GreenName","GreenAffiliation","Stage","MainRef","Judge1","Judge2"
        ];
        const lines = [header.join(",")];
        for (const b of bouts) {
          const A = pIndex.get(b.blueId);
          const G = pIndex.get(b.greenId);
          const asg = assignments.find((x) => x.boutNo === b.boutNo);
          const R1 = refs.find((r) => r.id === asg?.mainRef);
          const R2 = refs.find((r) => r.id === asg?.judge1);
          const R3 = refs.find((r) => r.id === asg?.judge2);
          lines.push([
            b.boutNo,
            b.gillam,
            b.ageGroupLabel || ageGroupLabel(b.ageGroupNumb, tournamentScope),
            b.sex || "",
            b.weight,
            A?.name || "",
            A?.country || "",
            G?.name || "",
            G?.country || "",
            b.stage,
            R1 ? `${R1.name} (${R1.country})` : "",
            R2 ? `${R2.name} (${R2.country})` : "",
            R3 ? `${R3.name} (${R3.country})` : ""
          ].join(","));
        }
        const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "kurash_draw_schedule.csv";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
      }

      function showScoreSaveNotice(message) {
        setScoreSaveNotice(message);
        window.setTimeout(() => {
          setScoreSaveNotice((current) => current === message ? "" : current);
        }, 2400);
      }

      function toggleScoreboardTimer() {
        setScoreboardDirty(true);
        setTimerRunning((running) => !running);
      }

      function requestSelectBoutForScore(no) {
        if (activeBoutNo && no && Number(no) !== Number(activeBoutNo) && scoreboardDirty) {
          setPendingScoreBoutNo(Number(no));
          showScoreSaveNotice("Unsaved scoring changes detected. Choose Save & switch or Switch without saving.");
          return;
        }
        selectBoutForScore(no);
      }

      function switchToPendingBoutWithoutSaving() {
        const target = pendingScoreBoutNo;
        setPendingScoreBoutNo(null);
        setScoreboardDirty(false);
        if (target != null) selectBoutForScore(target);
      }

      function saveAndSwitchToPendingBout() {
        const target = pendingScoreBoutNo;
        const ok = saveResultToBout({ silent: true });
        if (ok === false) return;
        setPendingScoreBoutNo(null);
        setScoreboardDirty(false);
        if (target != null) selectBoutForScore(target);
      }

      function isHardByeFightOrderSlot(value) {
        const t = String(value ?? "").trim().toUpperCase();
        return t === "BYE" || t === "BYE_EMPTY" || t === "AUTO_ADVANCE";
      }

      function isBlockedEmptySlot(value) {
        return String(value ?? "").trim().toUpperCase().startsWith("BLOCKED_FROM_BOUT_");
      }

      function isTrueCompetitionBout(bout) {
        if (!bout) return false;
        if (bout.internalOnly || bout.excludedFromFightOrder || bout.autoAdvanced === true) return false;
        if (isHardByeFightOrderSlot(bout.blueId) || isHardByeFightOrderSlot(bout.greenId)) return false;
        return true;
      }

      function isWaitingForResultBout(bout) {
        if (!isTrueCompetitionBout(bout)) return false;
        return !String(bout.blueId || "").trim() || !String(bout.greenId || "").trim() || isBlockedEmptySlot(bout.blueId) || isBlockedEmptySlot(bout.greenId);
      }

      function isPlayableFightOrderBout(bout) {
        return isTrueCompetitionBout(bout) && !isWaitingForResultBout(bout);
      }

      function isSelectableFightOrderBout(bout) {
        // Selectable = visible in fight-order dropdowns. Waiting-for-result bouts remain visible but disabled.
        return isTrueCompetitionBout(bout);
      }

      function sourceLabelForBoutSide(targetBout, side) {
        if (!targetBout || !schedule?.bracketLinks) return "Waiting for result";
        for (const [fromNo, links] of Object.entries(schedule.bracketLinks || {})) {
          const arr = Array.isArray(links) ? links : [links];
          if (arr.some((lnk) => String(lnk?.toBoutNo || lnk?.targetBoutNo || lnk?.boutNo) === String(targetBout.boutNo) && String(lnk?.side || lnk?.targetSlot || lnk?.slot).toLowerCase().startsWith(side))) {
            return `Winner of Bout ${fromNo}`;
          }
        }
        return "Waiting for result";
      }

      function boutSideDisplayName(bout, side, playerObj) {
        const id = side === "blue" ? bout?.blueId : bout?.greenId;
        if (isHardByeFightOrderSlot(id)) return "BYE / Auto-advance";
        if (isBlockedEmptySlot(id)) return "Position blocked";
        if (!String(id || "").trim()) return sourceLabelForBoutSide(bout, side);
        return playerObj?.name || String(id || "");
      }

      function nextSelectableFightOrderBoutAfter(boutNo) {
        const bouts = schedule?.bouts || [];
        const idx = bouts.findIndex((b) => String(b.boutNo) === String(boutNo));
        if (idx < 0) return null;
        for (let i = idx + 1; i < bouts.length; i++) {
          if (isPlayableFightOrderBout(bouts[i])) return bouts[i];
        }
        return null;
      }

      function saveAndGoToNextBout() {
        if (!schedule?.bouts?.length || !activeBoutNo) return;
        const next = nextSelectableFightOrderBoutAfter(activeBoutNo);
        const ok = saveResultToBout({ silent: true });
        if (ok === false) return;
        if (next) selectBoutForScore(next.boutNo);
        else showScoreSaveNotice("Result saved. No next playable bout is available.");
      }

      function selectBoutForScore(no) {
        const targetBout = schedule?.bouts?.find?.((b) => String(b.boutNo) === String(no));
        if (targetBout && !isPlayableFightOrderBout(targetBout)) {
          showScoreSaveNotice("This bout is waiting for result and is not playable yet.");
          return false;
        }
        setActiveBoutNo(no);
        setScoreboardDirty(false);
        const meta = boutMeta[no];
        let initialMs = 0;

        if (schedule && no != null) {
          const bout = schedule.bouts.find((b) => String(b.boutNo) === String(no));
          if (bout) {
            const pIndex = new Map(players.map((p) => [p.id, p]));
            const baseSec = matchDurationSecondsForBout(bout, pIndex, tournamentScope, durationOverrides);
            initialMs = baseSec * 1000;
          }
        }

        if (meta) {
          setSbEvents(meta.events || []);
          if (meta.durationSec != null) {
            setTimerMs(meta.durationSec * 1000);
            initialFightMsRef.current = initialMs || (meta.durationSec * 1000);
          } else {
            setTimerMs(initialMs);
            initialFightMsRef.current = initialMs;
          }
        } else {
          setSbEvents([]);
          setTimerMs(initialMs);
          initialFightMsRef.current = initialMs;
        }
        setTimerRunning(false);
        setShowMeta(false);
        halfPingDoneRef.current = false;
      }

      function addEvent(side, type) {
        if (!ensureWritable("Scoring") || !activeBoutNo || !schedule) return;
        setScoreboardDirty(true);
        setSbEvents((prev) => [...prev, { side, type, atMs: timerMs }]);
      }

      function removeLastEvent(side, type) {
        if (!ensureWritable("Editing score events")) return;
        setScoreboardDirty(true);
        setSbEvents((prev) => {
          const next = prev.slice();
          for (let i = next.length - 1; i >= 0; i--) {
            const ev = next[i];
            if (ev.side === side && ev.type === type) {
              next.splice(i, 1);
              break;
            }
          }
          return next;
        });
      }

      function adjustTimerBySeconds(deltaSeconds) {
        if (!ensureWritable("Adjusting timer")) return;
        setScoreboardDirty(true);
        setTimerMs((prev) => Math.max(0, prev + deltaSeconds * 1000));
      }

      function parseManualTimeInput(rawValue, fallbackMs) {
        const raw = String(rawValue || "").trim();
        if (!raw) return null;

        if (raw.includes(":")) {
          const parts = raw.split(":").map((x) => Number(x));
          if (parts.length === 2 && parts.every((x) => Number.isFinite(x) && x >= 0)) {
            const [minutes, seconds] = parts;
            if (seconds >= 60) return null;
            return Math.max(0, (minutes * 60 + seconds) * 1000);
          }
        }

        const n = Number(raw);
        if (Number.isFinite(n) && n >= 0) {
          // 0-20 is treated as minutes for fast match-time entry; above 20 as seconds.
          const seconds = n <= 20 ? n * 60 : n;
          return Math.max(0, seconds * 1000);
        }

        return fallbackMs ?? null;
      }

      function setTimerManuallyFromPrompt() {
        if (!ensureWritable("Editing timer")) return;
        const current = formatTime(timerMs);
        const raw = window.prompt("Enter match time as mm:ss, minutes, or seconds", current);
        const nextMs = parseManualTimeInput(raw, timerMs);
        if (nextMs == null) return;
        setTimerRunning(false);
        setScoreboardDirty(true);
        setTimerMs(nextMs);
        initialFightMsRef.current = nextMs;
        halfPingDoneRef.current = false;
      }

      function handleTimerClick(e) {
        // Keep double-click reserved for manual time editing.
        if (e?.detail > 1) return;
        if (!ensureWritable("Starting/stopping timer")) return;
        setScoreboardDirty(true);
        setTimerRunning((running) => !running);
      }

      function handleScoreButton(side, type, isRightClick, canAdd, event) {
        if (event) event.preventDefault();
        if (isRightClick) {
          removeLastEvent(side, type);
        } else {
          if (!canAdd) return;
          addEvent(side, type);
        }
      }


      function fullResetCurrentBout() {
        if (!ensureWritable("Full reset") || !activeBoutNo || !schedule) return;
        const bout = schedule.bouts.find((b) => String(b.boutNo) === String(activeBoutNo));
        const pIndex = new Map(players.map((p) => [p.id, p]));
        const sec = matchDurationSecondsForBout(bout, pIndex, tournamentScope, durationOverrides);
        setTimerRunning(false);
        setScoreboardDirty(true);
        setSbEvents([]);
        setTimerMs(sec * 1000);
        initialFightMsRef.current = sec * 1000;
        halfPingDoneRef.current = false;
        setShowMeta(false);
        setBoutMeta((prev) => {
          const next = { ...prev };
          delete next[activeBoutNo];
          return next;
        });
      }

      async function sendIntegratedResultToServer(boutNo, payload) {
        const base = normalizedServerBase();
        if (!base) return null;
        try {
          // v35.6.7 Patch 2: integrated scoreboard saves only one bout to the merge-safe endpoint.
          const res = await fetch(base + "/api/bout/" + encodeURIComponent(boutNo) + "/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data?.ok === false) throw new Error(data?.error || ("HTTP " + res.status));
          if (data?.tournament?.schedule) {
            setSchedule(data.tournament.schedule);
            setCurrentTournamentMeta(data.tournament.meta || currentTournamentMeta);
            if (data.tournament.tournamentMeta?.delegationApprovals) setDelegationApprovals(data.tournament.tournamentMeta.delegationApprovals);
          }
          markSynced();
          return data;
        } catch (err) {
          console.error("Integrated scoreboard merge-safe save error:", err);
          setSyncMode("unsynced");
          setServerStatusMsg("Bout result saved locally. Server sync failed: " + err.message);
          return { ok: false, error: err.message };
        }
      }

      function applyResultToLocalSchedule(boutNo, payload) {
        let nextScheduleRef = null;
        setSchedule((prev) => {
          if (!prev?.bouts?.length) return prev;
          const updated = {
            ...prev,
            bouts: prev.bouts.map((b) => String(b.boutNo) === String(boutNo)
              ? { ...b, ...payload, finished: true, savedAt: new Date().toISOString() }
              : { ...b })
          };

          const currentBout = updated.bouts.find((b) => String(b.boutNo) === String(boutNo));
          const links = updated.bracketLinks?.[boutNo] || updated.bracketLinks?.[String(boutNo)] || [];
          const winnerPlayerId = payload.winner === "blue" ? currentBout?.blueId : payload.winner === "green" ? currentBout?.greenId : null;

          if (Array.isArray(links) && links.length) {
            updated.bouts = updated.bouts.map((b) => {
              const link = links.find((lnk) => String(lnk.toBoutNo) === String(b.boutNo));
              if (!link) return b;
              if (payload.resultType === "double_withdrawal") {
                const blocked = `BLOCKED_FROM_BOUT_${boutNo}`;
                if (link.side === "blue") return { ...b, blueId: blocked, positionBlocked: true, waitingForResult: false };
                if (link.side === "green") return { ...b, greenId: blocked, positionBlocked: true, waitingForResult: false };
                return b;
              }
              if (winnerPlayerId) {
                if (link.side === "blue") return { ...b, blueId: winnerPlayerId };
                if (link.side === "green") return { ...b, greenId: winnerPlayerId };
              }
              return b;
            });
          }

          // Do not auto-finish scheduled competitions here.
          // BYE advancement is bracket-only and not a competition; null means Waiting for result.
          updated.bouts = updated.bouts.map((b) => ({ ...b }));
          nextScheduleRef = updated;
          return updated;
        });
        return nextScheduleRef;
      }

      function saveWithdrawalResult(whichSide) {
        if (!ensureWritable("Saving withdrawal") || !activeBoutNo || !schedule) return;
        const currentBout = schedule.bouts.find((b) => b.boutNo === activeBoutNo);
        if (!currentBout) return;
        const both = whichSide === "both";
        const winner = both ? null : (whichSide === "blue" ? "green" : "blue");
        const payload = {
          winner,
          resultType: both ? "double_withdrawal" : "withdrawal",
          withdrawnSide: both ? "both" : whichSide,
          noContest: both,
          advances: both ? null : winner,
          meta: [{
            timeSec: Math.floor(timerMs / 1000),
            timeStr: formatTime(timerMs),
            type: both ? "DOUBLE_WITHDRAWAL" : "WITHDRAWAL",
            side: both ? "both" : whichSide,
            text: both ? "DOUBLE WITHDRAWAL / NO CONTEST" : (whichSide.toUpperCase() + " WITHDRAWAL")
          }],
          durationMs: timerMs,
          blueScore: { H: 0, YO: 0, CH: 0 },
          greenScore: { H: 0, YO: 0, CH: 0 },
          bluePenalties: { T: 0, D: 0, G: 0 },
          greenPenalties: { T: 0, D: 0, G: 0 }
        };

        setTimerRunning(false);
        setBoutMeta((prev) => ({
          ...prev,
          [activeBoutNo]: {
            events: [],
            durationSec: Math.floor(timerMs / 1000),
            winner,
            resultType: payload.resultType,
            withdrawnSide: payload.withdrawnSide,
            noContest: payload.noContest,
            savedAt: new Date().toISOString()
          }
        }));
        applyResultToLocalSchedule(activeBoutNo, payload);
        markUnsynced();
        sendIntegratedResultToServer(activeBoutNo, payload);
        setScoreboardDirty(false);
        showScoreSaveNotice(both ? "Double withdrawal saved. No winner will advance." : "Withdrawal result saved.");
        return true;
      }

      function saveResultToBout(options) {
        options = options || {};
        if (!ensureWritable("Saving results") || !activeBoutNo || !schedule) return false;
        const scores = computeScores(sbEvents);
        const isTimeUp = timerMs === 0;
        const winnerSide = decideWinner(scores, isTimeUp || !!scores.halalWinner);
        if (!winnerSide) {
          alert("No clear winner yet according to current scores and penalties.");
          return false;
        }
        const durationMs = timerMs;
        const durationSec = Math.floor(durationMs / 1000);
        setBoutMeta((prev) => ({
          ...prev,
          [activeBoutNo]: { events: sbEvents, durationSec, winner: winnerSide, resultType: "points", noContest: false, savedAt: new Date().toISOString() }
        }));

        const bluePenalties = { T: 0, D: 0, G: 0 };
        const greenPenalties = { T: 0, D: 0, G: 0 };
        for (const ev of sbEvents) {
          if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
            const obj = ev.side === "blue" ? bluePenalties : greenPenalties;
            obj[ev.type] += 1;
          }
        }

        const metaEvents = sbEvents.map((ev) => ({
          timeSec: Math.floor(ev.atMs / 1000),
          timeStr: formatTime(ev.atMs),
          type: ev.type,
          side: ev.side,
          text: (ev.side === "blue" ? "BLUE " : "GREEN ") + ev.type
        }));

        markUnsynced();
        sendIntegratedResultToServer(activeBoutNo, {
          winner: winnerSide,
          blueScore: {
            H: scores.blue.H,
            YO: scores.blue.YO,
            CH: scores.blue.CH
          },
          greenScore: {
            H: scores.green.H,
            YO: scores.green.YO,
            CH: scores.green.CH
          },
          bluePenalties,
          greenPenalties,
          meta: metaEvents,
          durationMs,
          resultType: "points",
          noContest: false
        });

        applyResultToLocalSchedule(activeBoutNo, { winner: winnerSide, resultType: "points", noContest: false, meta: metaEvents, durationMs, blueScore: { H: scores.blue.H, YO: scores.blue.YO, CH: scores.blue.CH }, greenScore: { H: scores.green.H, YO: scores.green.YO, CH: scores.green.CH }, bluePenalties, greenPenalties });

        // propagate winner to next elimination bout(s) if any
        const currentBout = schedule.bouts.find((b) => b.boutNo === activeBoutNo);
        const winnerPlayerId =
          winnerSide === "blue" ? currentBout?.blueId : currentBout?.greenId;

        if (winnerPlayerId && schedule.bracketLinks && schedule.bracketLinks[activeBoutNo]) {
          const links = schedule.bracketLinks[activeBoutNo];
          setSchedule((prev) => {
            if (!prev) return prev;
            const updatedBouts = prev.bouts.map((b) => {
              const link = links.find((lnk) => lnk.toBoutNo === b.boutNo);
              if (!link) return b;
              if (link.side === "blue" && b.blueId !== winnerPlayerId) {
                return { ...b, blueId: winnerPlayerId };
              }
              if (link.side === "green" && b.greenId !== winnerPlayerId) {
                return { ...b, greenId: winnerPlayerId };
              }
              return b;
            });
            return { ...prev, bouts: updatedBouts };
          });
        }

        setScoreboardDirty(false);
        showScoreSaveNotice("Result saved for bout #" + activeBoutNo);
        return true;
      }

      function metaForBout(no) { return boutMeta[no] || null; }

      const timerColorClass = timerRunning ? "text-white" : "text-red-500";

      // group players by group/sex/country for reports
      const groupedPlayers = useMemo(() => {
        const byGroup = new Map();
        const bySex = { M: [], F: [] };
        const byCountry = new Map();
        players.forEach((p) => {
          const slot = groupSlotOfPlayer(p, weightMode);
          const gk = p.sex && slot ? groupKeyOfPlayer(p, weightMode) : null;
          if (gk) {
            if (!byGroup.has(gk)) byGroup.set(gk, []);
            byGroup.get(gk).push(p);
          }
          if (p.sex === "M" || p.sex === "F") bySex[p.sex].push(p);
          if (p.country) {
            if (!byCountry.has(p.country)) byCountry.set(p.country, []);
            byCountry.get(p.country).push(p);
          }
        });
        return { byGroup, bySex, byCountry };
      }, [players, weightMode, manualGroupsByAge]);

      const filteredDrawGroups = useMemo(() => {
        const q = String(drawGroupSearch || "").trim().toLowerCase();
        return (weightsWithPlayers || []).filter((gk) => {
          if (!q) return true;
          const parsed = parseGroupKey(gk);
          const pCount = groupedPlayers.byGroup.get(gk)?.length || 0;
          const rowText = [
            ageGroupLabel(parsed.ageGroupNumb, tournamentScope),
            parsed.sex === "F" ? "Women" : "Men",
            parsed.weight,
            parsed.slot,
            pCount <= roundRobinMax ? "Round Robin" : "Single Elimination",
            pCount
          ].join(" ").toLowerCase();
          return rowText.includes(q);
        });
      }, [weightsWithPlayers, groupedPlayers, drawGroupSearch, tournamentScope, roundRobinMax]);

      const filteredDrawBouts = useMemo(() => {
        const q = String(drawBoutSearch || "").trim().toLowerCase();
        const pIndex = new Map((players || []).map((p) => [p.id, p]));
        return (schedule?.bouts || []).filter((b) => {
          if (!q) return true;
          const A = pIndex.get(b.blueId);
          const G = pIndex.get(b.greenId);
          const meta = metaForBout(b.boutNo);
          const winnerText = meta?.winner ? (meta.winner === "blue" ? A?.name || "Blue" : G?.name || "Green") : "";
          const rowText = [b.boutNo, b.gillam, b.sex === "F" ? "Women" : "Men", b.weight, b.stage, A?.name, A?.country, A?.countryFull, G?.name, G?.country, G?.countryFull, winnerText].join(" ").toLowerCase();
          return rowText.includes(q);
        });
      }, [schedule, players, drawBoutSearch, boutMeta]);

      const localLeagueStandings = useMemo(() => {
        if (!schedule?.bouts?.length) return [];
        const pIndex = new Map(players.map((p) => [p.id, p]));
        const groups = new Map();
        function playable(id) { return id && id !== "BYE" && id !== "BYE_EMPTY"; }
        function ensure(gk, id) {
          if (!playable(id)) return null;
          if (!groups.has(gk)) groups.set(gk, new Map());
          const g = groups.get(gk);
          if (!g.has(id)) {
            const p = pIndex.get(id) || {};
            g.set(id, { playerId: id, name: p.name || id, country: p.country || "", wins: 0, losses: 0, noContests: 0, tiebreakPoints: 0, scoreFor: { H: 0, YO: 0, CH: 0 } });
          }
          return g.get(id);
        }
        function priority(b) {
          if (b.resultType === "withdrawal" || b.resultType === "bye") return 1;
          const ws = b.winner === "blue" ? (b.blueScore || {}) : (b.greenScore || {});
          if (Number(ws.H || 0) > 0) return 5;
          if (Number(ws.YO || 0) > 0) return 4;
          if (Number(ws.CH || 0) > 0) return 3;
          return 2;
        }
        for (const b of schedule.bouts) {
          if (b.isElimination) continue;
          const gk = b.groupKey || `${b.ageGroupNumb || ""}|${b.sex || ""}|${b.weight || ""}`;
          const blue = ensure(gk, b.blueId);
          const green = ensure(gk, b.greenId);
          if (!blue || !green || !b.finished) continue;
          const bs = b.blueScore || {}, gs = b.greenScore || {};
          ["H", "YO", "CH"].forEach((k) => { blue.scoreFor[k] += Number(bs[k] || 0); green.scoreFor[k] += Number(gs[k] || 0); });
          if (b.resultType === "double_withdrawal" || b.noContest) { blue.losses++; green.losses++; blue.noContests++; green.noContests++; continue; }
          if (!b.winner) continue;
          const w = b.winner === "blue" ? blue : green;
          const l = b.winner === "blue" ? green : blue;
          w.wins++; l.losses++; w.tiebreakPoints += priority(b);
        }
        return Array.from(groups.entries()).map(([groupKey, map]) => ({
          groupKey,
          rows: Array.from(map.values()).sort((a,b) => b.wins-a.wins || a.losses-b.losses || b.tiebreakPoints-a.tiebreakPoints || b.scoreFor.H-a.scoreFor.H || b.scoreFor.YO-a.scoreFor.YO || b.scoreFor.CH-a.scoreFor.CH || String(a.name).localeCompare(String(b.name))).map((r,i)=>({rank:i+1,...r}))
        }));
      }, [schedule, players]);

      // reports data (player / country / matches / penalties / counts)
      const reportsData = useMemo(() => {
        if (!schedule) {
          return {
            playerResults: [],
            countryResults: [],
            matchesReport: [],
            penaltiesReport: [],
            refereeReport: [],
            playersByWeight: [],
            countsByWeight: [],
            countsBySex: [],
            countryCounts: [],
            countsByCountrySex: []
          };
        }

        const playersIndex = new Map(players.map((p) => [p.id, p]));
        const boutsByGroup = new Map();
        schedule.bouts.forEach((b) => {
          const key = b.groupKey || (b.ageGroupNumb && b.sex && b.weight ? `${b.ageGroupNumb}|${b.sex}|${b.weight}` : "UNKNOWN");
          if (!boutsByGroup.has(key)) boutsByGroup.set(key, []);
          boutsByGroup.get(key).push(b);
        });

        const playerStats = new Map();

        function ensurePlayer(id) {
          if (!id) return null;
          if (!playerStats.has(id)) {
            const p = playersIndex.get(id);
            playerStats.set(id, {
              playerId: id,
              name: p?.name || "",
              country: p?.country || "",
              sex: p?.sex || "",
              weight: p?.weight || "",
              wins: 0,
              losses: 0,
              medals: []
            });
          }
          return playerStats.get(id);
        }

const groupModes = new Map(); // gk -> 'RR' or 'SE'
groupedPlayers.byGroup.forEach((plist, gk) => {
  groupModes.set(gk, plist.length <= roundRobinMax ? "RR" : "SE");
});


        // accumulate wins/losses from boutMeta
        Object.entries(boutMeta).forEach(([boutNoStr, meta]) => {
          const boutNo = Number(boutNoStr);
          const b = schedule.bouts.find((x) => x.boutNo === boutNo);
          if (!b) return;
          const blueId = b.blueId;
          const greenId = b.greenId;
          if (!blueId || !greenId) return;
          if (!meta || !meta.winner) return;
          const wp = meta.winner === "blue" ? blueId : greenId;
          const lp = meta.winner === "blue" ? greenId : blueId;
          const ws = ensurePlayer(wp);
          const ls = ensurePlayer(lp);
          if (ws) ws.wins += 1;
          if (ls) ls.losses += 1;
        });

        // medals from groups
        groupedPlayers.byGroup.forEach((plist, gk) => {
          const mode = groupModes.get(gk) || "RR";
          const boutList = boutsByGroup.get(gk) || [];
          let maxRound = 0;
          boutList.forEach((b) => {
            if (b.isElimination && b.stage && b.stage.startsWith("R")) {
              const r = Number(b.stage.slice(1)) || 0;
              if (r > maxRound) maxRound = r;
            }
            if (b.stage === "Semi-final") {
              if (maxRound < 2) maxRound = 2;
            }
            if (b.stage === "Final") {
              if (maxRound < 3) maxRound = 3;
            }
          });

          if (mode === "RR") {
            const stats = plist.map((p) => {
              const st = ensurePlayer(p.id) || {
                playerId: p.id,
                name: p.name,
                country: p.country,
                sex: p.sex,
                weight: p.weight,
                wins: 0,
                losses: 0,
                medals: []
              };
              return st;
            });
            stats.sort((a, b) => {
              if (b.wins !== a.wins) return b.wins - a.wins;
              if (a.losses !== b.losses) return a.losses - b.losses;
              return String(a.name || "").localeCompare(String(b.name || ""));
            });
            if (stats[0]) stats[0].medals.push("Gold");
            if (stats[1]) stats[1].medals.push("Silver");
            if (stats[2]) stats[2].medals.push("Bronze");
            if (stats[3]) stats[3].medals.push("Bronze");
          } else {
            if (!maxRound) return;
            // final
            const finalBouts = boutList.filter(
              (b) => b.stage === "Final" || (b.stage && b.stage.startsWith("R") && Number(b.stage.slice(1)) === maxRound)
            );
            const finalBout = finalBouts[0];
            if (finalBout) {
              const meta = boutMeta[finalBout.boutNo];
              if (meta && meta.winner && finalBout.blueId && finalBout.greenId) {
                const champId = meta.winner === "blue" ? finalBout.blueId : finalBout.greenId;
                const silverId = meta.winner === "blue" ? finalBout.greenId : finalBout.blueId;
                const champ = ensurePlayer(champId);
                const silver = ensurePlayer(silverId);
                if (champ) champ.medals.push("Gold");
                if (silver) silver.medals.push("Silver");
              }
            }
            // semi finals: losers get bronze
            const semiBouts = boutList.filter(
              (b) =>
                b.stage === "Semi-final" ||
                (b.stage && b.stage.startsWith("R") && Number(b.stage.slice(1)) === maxRound - 1)
            );
            semiBouts.forEach((b) => {
              const meta = boutMeta[b.boutNo];
              if (!meta || !meta.winner || !b.blueId || !b.greenId) return;
              const loserId = meta.winner === "blue" ? b.greenId : b.blueId;
              const st = ensurePlayer(loserId);
              if (st) st.medals.push("Bronze");
            });
          }
        });

        const playerResults = Array.from(playerStats.values()).sort((a, b) => {
          const medalWeight = (p) =>
            p.medals.includes("Gold")
              ? 3
              : p.medals.includes("Silver")
              ? 2
              : p.medals.includes("Bronze")
              ? 1
              : 0;
          const aw = medalWeight(a);
          const bw = medalWeight(b);
          if (bw !== aw) return bw - aw;
          if (b.wins !== a.wins) return b.wins - a.wins;
          if (a.losses !== b.losses) return a.losses - b.losses;
          return String(a.name || "").localeCompare(String(b.name || ""));
        });

        const countryStats = new Map();
        function addCountryMedal(country, medal) {
          if (!country) return;
          if (!countryStats.has(country)) {
            countryStats.set(country, { country, gold: 0, silver: 0, bronze: 0, total: 0 });
          }
          const cs = countryStats.get(country);
          if (medal === "Gold") cs.gold += 1;
          else if (medal === "Silver") cs.silver += 1;
          else if (medal === "Bronze") cs.bronze += 1;
          cs.total = cs.gold + cs.silver + cs.bronze;
        }
        playerResults.forEach((p) => {
          p.medals.forEach((m) => addCountryMedal(p.country, m));
        });
        const countryResults = Array.from(countryStats.values()).sort((a, b) => {
          if (b.gold !== a.gold) return b.gold - a.gold;
          if (b.silver !== a.silver) return b.silver - a.silver;
          if (b.bronze !== a.bronze) return b.bronze - a.bronze;
          return String(a.country).localeCompare(String(b.country));
        });

        const matchesReport = schedule.bouts.map((b) => {
          const A = b.blueId ? playersIndex.get(b.blueId) : null;
          const G = b.greenId ? playersIndex.get(b.greenId) : null;
          const meta = boutMeta[b.boutNo];
          let winnerName = "-";
          if (meta && meta.winner) {
            winnerName =
              meta.winner === "blue" ? (A?.name || "Blue") : (G?.name || "Green");
          }
          return {
            boutNo: b.boutNo,
            gillam: b.gillam,
            sex: b.sex === "F" ? "Women" : "Men",
            weight: b.weight,
            blueName: A?.name || "",
            blueCountry: A?.country || "",
            greenName: G?.name || "",
            greenCountry: G?.country || "",
            stage: b.stage || "",
            winnerName,
            duration: meta && meta.durationSec != null ? meta.durationSec : null
          };
        });

        const penaltiesReport = Object.entries(boutMeta)
          .map(([boutNoStr, meta]) => {
            const boutNo = Number(boutNoStr);
            const b = schedule.bouts.find((x) => x.boutNo === boutNo);
            const A = b && b.blueId ? playersIndex.get(b.blueId) : null;
            const G = b && b.greenId ? playersIndex.get(b.greenId) : null;
            const counts = {
              blue: { T: 0, D: 0, G: 0 },
              green: { T: 0, D: 0, G: 0 }
            };
            (meta.events || []).forEach((ev) => {
              if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
                const side = ev.side === "blue" ? "blue" : "green";
                counts[side][ev.type] += 1;
              }
            });
            return {
              boutNo,
              gillam: b?.gillam || "",
              sex: b?.sex === "F" ? "Women" : "Men",
              weight: b?.weight || "",
              blueName: A?.name || "",
              greenName: G?.name || "",
              blueT: counts.blue.T,
              blueD: counts.blue.D,
              blueG: counts.blue.G,
              greenT: counts.green.T,
              greenD: counts.green.D,
              greenG: counts.green.G
            };
          })
          .sort((a, b) => a.boutNo - b.boutNo);

        const refereeReport = schedule.bouts.map((b) => {
          const asg = schedule.assignments.find((x) => x.boutNo === b.boutNo);
          const mainRefObj = asg ? refs.find((r) => r.id === asg.mainRef) : null;
          const judge1Obj = asg ? refs.find((r) => r.id === asg.judge1) : null;
          const judge2Obj = asg ? refs.find((r) => r.id === asg.judge2) : null;
          return {
            boutNo: b.boutNo,
            gillam: b.gillam,
            sex: b.sex === "F" ? "Women" : "Men",
            weight: b.weight,
            mainRef: mainRefObj ? formatRefDisplay(mainRefObj, "number_name") : "",
            judge1: judge1Obj ? formatRefDisplay(judge1Obj, "number_name") : "",
            judge2: judge2Obj ? formatRefDisplay(judge2Obj, "number_name") : ""
          };
        });

        const playersByWeight = [];
        groupedPlayers.byGroup.forEach((plist, gk) => {
          const { sex, weight } = parseGroupKey(gk);
          const sexLabel = sex === "F" ? "Women" : "Men";
          const sorted = plist
            .slice()
            .sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));
          playersByWeight.push({ groupKey: gk, sexLabel, weight, players: sorted });
        });
        playersByWeight.sort((a, b) => groupKeyComparator(a.groupKey, b.groupKey));

        const countsByWeight = playersByWeight.map((g) => ({
          groupKey: g.groupKey,
          sexLabel: g.sexLabel,
          weight: g.weight,
          count: g.players.length
        }));

        const countsBySex = [
          { sex: "Men", count: groupedPlayers.bySex.M.length },
          { sex: "Women", count: groupedPlayers.bySex.F.length }
        ];

        const countryCounts = [];
        groupedPlayers.byCountry.forEach((plist, country) => {
          countryCounts.push({ country, count: plist.length });
        });
        countryCounts.sort((a, b) => b.count - a.count || a.country.localeCompare(b.country));

        const countsByCountrySex = [];
        groupedPlayers.byCountry.forEach((plist, country) => {
          const men = plist.filter((p) => p.sex === "M").length;
          const women = plist.filter((p) => p.sex === "F").length;
          countsByCountrySex.push({
            country,
            men,
            women,
            total: men + women
          });
        });
        countsByCountrySex.sort(
          (a, b) => b.total - a.total || a.country.localeCompare(b.country)
        );

        return {
          playerResults,
          countryResults,
          matchesReport,
          penaltiesReport,
          refereeReport,
          playersByWeight,
          countsByWeight,
          countsBySex,
          countryCounts,
          countsByCountrySex
        };
      }, [players, schedule, boutMeta, groupedPlayers, refs, weightMode, manualGroupsByAge, tournamentScope]);

      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 text-slate-100">

                else row.M += 1;
              });
              const countryCountRows = Array.from(countryMap.values()).sort((a, b) =>
