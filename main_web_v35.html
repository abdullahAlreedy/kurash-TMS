// Auto-generate a code for countries without overrides using the first 3 clean letters.
function autoCodeFromName(name) {
  const letters = name.replace(/[^A-Za-z]/g, "").toUpperCase();
  if (!letters) return "UNK";
  if (letters.length <= 3) return letters;
  return letters.slice(0, 3);
}

// Final mapping used throughout the system.
const COUNTRY_NAME_TO_CODE = Object.fromEntries(
  ALL_COUNTRY_NAMES.map((fullName) => [
    fullName,
    COUNTRY_CODE_OVERRIDES[fullName] || autoCodeFromName(fullName)
  ])
);

// Reverse mapping: code to country name.
const COUNTRY_CODE_TO_NAME = Object.fromEntries(
  Object.entries(COUNTRY_NAME_TO_CODE).map(([full, code]) => [code, full])
);

// Backward-compatible resolver using the new mapping.
function resolveCountry(input) {
  const t = (input || "").trim();
  if (COUNTRY_NAME_TO_CODE[t]) return { code: COUNTRY_NAME_TO_CODE[t], full: t };
  const up = t.toUpperCase();
  if (COUNTRY_CODE_TO_NAME[up]) return { code: up, full: COUNTRY_CODE_TO_NAME[up] };
  return { code: up, full: t || "Unknown" };
}


function CountryFlag({ code }) {
  const upper = (code || "").toUpperCase();
  const baseClass =
    "w-10 h-6 md:w-14 md:h-8 rounded border border-slate-300 shadow-inner object-cover";

  if (!upper) {
    return <div className={baseClass + " bg-slate-700"} aria-label="flag" />;
  }

  // Convert code to lowercase and append _m to match flag file naming, e.g. ksa_m.jpg.
  const lower = upper.toLowerCase();

  const jpgPath = `flags/${lower}_m.jpg`;
  const pngPath = `flags/${lower}_m.png`;

  const handleError = (e) => {
    // If JPG is not found, try PNG with the same name.
    if (e.target.src.includes(".jpg")) {
      e.target.src = pngPath;
    } else {
      // If both fail, hide the image.
      e.target.style.display = "none";
    }
  };

  return (
    <img
      src={jpgPath}
      alt={`${upper} flag`}
      className={baseClass}
      onError={handleError}
    />
  );
}

    function isExternalScope(scope) { return scope === "external" || scope === "international"; }
    function isSchoolScope(scope) { return scope === "internal_school"; }
    function isInternalScope(scope) { return !isExternalScope(scope); }
    function normalizedAffiliationMode(scope, mode) {
      if (isExternalScope(scope)) return "country";
      return mode === "club" ? "club" : "none";
    }
    function affiliationLabel(scope, mode) {
      const m = normalizedAffiliationMode(scope, mode);
      if (m === "country") return "Country";
      if (m === "club") return "Club";
      return "Affiliation";
    }
    function defaultAffiliation(scope, mode) {
      const m = normalizedAffiliationMode(scope, mode);
      if (m === "country") return { full: "Saudi Arabia", code: COUNTRY_NAME_TO_CODE["Saudi Arabia"] || "KSA" };
      if (m === "club") return { full: "", code: "CLB" };
      return { full: "No Affiliation", code: "NA" };
    }
    function resolveAffiliation(input, scope, mode) {
      const m = normalizedAffiliationMode(scope, mode);
      if (m === "country") return resolveCountry(input);
      if (m === "none") return defaultAffiliation(scope, mode);
      const full = String(input || "").trim();
      if (!full) return { full: "", code: "CLB" };
      return { full, code: autoCodeFromName(full) };
    }
    function defaultAgeGroupNumbForScope(scope) {
      if (isExternalScope(scope)) return 101;
      if (isSchoolScope(scope)) return 8;
      return 1;
    }
    function activeAgeGroups(scope) {
      if (isExternalScope(scope)) return EXTERNAL_AGE_GROUPS;
      if (isSchoolScope(scope)) return SCHOOL_AGE_GROUPS;
      return INTERNAL_AGE_GROUPS;
    }
    function ageGroupByNumb(numb, scope) {
      const n = Number(numb) || defaultAgeGroupNumbForScope(scope);
      return activeAgeGroups(scope).find((g) => Number(g.numb) === n) || activeAgeGroups(scope)[0];
    }
    function competitiveAgeGroups(scope) {
      return activeAgeGroups(scope).filter((g) => g.competitive);
    }
    function ageGroupFromAge(ageValue, scope) {
      const age = Number(ageValue);
      if (!Number.isFinite(age) || age < 0) return defaultAgeGroupNumbForScope(scope);
      if (isExternalScope(scope)) {
        if (age <= 17) return 103;
        if (age <= 21) return 102;
        return 101;
      }
      if (isSchoolScope(scope)) {
        if (age <= 9) return 8;
        if (age <= 12) return 7;
        if (age <= 15) return 9;
        return 10;
      }
      if (age <= 11) return 6;
      if (age <= 13) return 5;
      if (age <= 15) return 4;
      if (age <= 17) return 3;
      if (age <= 21) return 2;
      return 1;
    }
    function defaultManualGroupsForScope(scope) {
      const out = {};
      competitiveAgeGroups(scope).forEach((g) => {
        out[g.numb] = ["Group A"];
      });
      return out;
    }
    function manualGroupsForAge(manualGroupsByAge, ageGroupNumb, scope) {
      const group = ageGroupByNumb(ageGroupNumb, scope);
      const raw = manualGroupsByAge?.[group?.numb];
      const arr = Array.isArray(raw) ? raw.map((x, i) => cleanManualGroupName(x, `Group ${i + 1}`)).filter(Boolean) : [];
      return arr.length ? arr : ["Group A"];
    }
    function normalizeManualGroup(value, manualGroupsByAge, ageGroupNumb, scope) {
      const arr = manualGroupsForAge(manualGroupsByAge, ageGroupNumb, scope);
      return arr.includes(value) ? value : arr[0];
    }
    function fmtClass(x) {
      const t = String(x);
      return t.endsWith("+") ? "+" + t.replace("+", "") : "-" + t;
    }
    function weightsForGroup(ageGroupNumb, sex, scope) {
      const group = ageGroupByNumb(ageGroupNumb, scope);
      if (!group?.competitive) return [];
      if (isExternalScope(scope)) return EXTERNAL_WEIGHTS[group.weightGr]?.[sex === "F" ? "F" : "M"] || [];
      const source = sex === "F" ? INTERNAL_FEMALE_WEIGHTS_BY_GR : INTERNAL_MALE_WEIGHTS_BY_GR;
      return source[group.weightGr] || [];
    }
    function bucketWeight(sex, actualKg, ageGroupNumb, scope) {
      const v = Math.max(0, Number(actualKg) || 0);
      const arr = weightsForGroup(ageGroupNumb || 1, sex, scope || "internal_local");
      if (!arr.length) return "";
      for (const w of arr) {
        const label = String(w);
        const limit = Number(label.replace("+", ""));
        if (!label.endsWith("+") && v <= limit) return fmtClass(label);
      }
      const last = String(arr[arr.length - 1]);
      return last.endsWith("+") ? fmtClass(last) : "+" + last;
    }
    function ageGroupLabel(numb, scope) { return ageGroupByNumb(numb, scope)?.label || "-"; }
    function ageGroupArabicLabel(numb, scope) { return ageGroupByNumb(numb, scope)?.arLabel || ""; }
    function ageGroupTitleProps(numb, scope) {
      const ar = ageGroupArabicLabel(numb, scope);
      return ar ? { title: ar } : {};
    }
    function groupSlotOfPlayer(p, weightMode) {
      return isManualGroupsMode(weightMode) ? (p.manualGroup || "") : (p.weight || "");
    }
    function groupKeyOfPlayer(p, weightMode) {
      return `${p.ageGroupNumb || 1}|${p.sex || "M"}|${groupSlotOfPlayer(p, weightMode)}`;
    }
    function parseGroupKey(gk) {
      const parts = String(gk || "").split("|");
      if (parts.length >= 3) return { ageGroupNumb: Number(parts[0]) || 1, sex: parts[1], weight: parts[2], slot: parts[2] };
      return { ageGroupNumb: 1, sex: parts[0] || "M", weight: parts[1] || "", slot: parts[1] || "" };
    }
    function groupLabel(gk, scope, weightMode) {
      const p = parseGroupKey(gk);
      const slotLabel = isManualGroupsMode(weightMode) ? `Group ${p.slot}` : p.weight;
      return `${ageGroupLabel(p.ageGroupNumb, scope)} | ${p.sex === "F" ? "Women" : "Men"} | ${slotLabel}`;
    }

    // Safe bout slot label used by Draw, Scoreboard and Referee Management.
    // Keeps the UI from crashing if a bout was created by an older version
    // that does not carry manualGroup/weight in the same shape.
    function slotLabel(bout) {
      const parsed = parseGroupKey(bout?.groupKey);
      const raw = String(
        bout?.manualGroup ||
        bout?.manualGroupName ||
        bout?.groupName ||
        bout?.weight ||
        parsed.slot ||
        parsed.weight ||
        ""
      ).trim();
      if (!raw) return "";

      // IMPORTANT: this helper is defined outside App(), so it must not read
      // React state variables such as weightMode. Reading weightMode here caused
      // the Draw tab to crash with: "weightMode is not defined".
      const mode = bout?.weightMode || bout?.mode || "";
      const looksManualGroup =
        isManualGroupsMode(mode) ||
        !!bout?.manualGroup ||
        !!bout?.manualGroupName ||
        !!bout?.groupName ||
        /^group\b/i.test(raw);

      if (looksManualGroup) return /^group\b/i.test(raw) ? raw : `Group ${raw}`;
      return raw;
    }
    function matchDurationSecondsForBout(bout, playersIndex, scope, manualOverrideSeconds) {
      const A = playersIndex?.get?.(bout?.blueId);
      const G = playersIndex?.get?.(bout?.greenId);
      const sex = bout?.sex || A?.sex || G?.sex || "M";

      // v35.1: support separate manual duration overrides for men and women.
      // Backward-compatible: a plain number still overrides all bouts.
      if (manualOverrideSeconds && typeof manualOverrideSeconds === "object") {
        const override = sex === "F"
          ? Number(manualOverrideSeconds.women || 0)
          : Number(manualOverrideSeconds.men || 0);
        if (override > 0) return override;
      } else if (Number(manualOverrideSeconds) > 0) {
        return Number(manualOverrideSeconds);
      }

      const p = parseGroupKey(bout?.groupKey);
      const g = ageGroupByNumb(p.ageGroupNumb, scope || "internal_local");
      if (g?.defaultSeconds) return g.defaultSeconds;
      return sex === "F" ? 3 * 60 : 4 * 60;
    }

    function formatWeightsForPreview(weights) {
      return (weights || []).map((w) => fmtClass(w)).join(", ");
    }
    function weightPreviewRows(scope) {
      return activeAgeGroups(scope)
        .filter((g) => g.competitive)
        .map((g) => ({
          label: g.label,
          duration: g.defaultSeconds ? Math.round(g.defaultSeconds / 60) + " min" : "-",

          female: formatWeightsForPreview(weightsForGroup(g.numb, "F", scope))
        }));
    }

    function calcAge(dobStr) {
      if (!dobStr) return "";
      const d = new Date(dobStr);
      if (isNaN(d.getTime())) return "";
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
      return age >= 0 ? age : "";
    }

    function makeGillamNames(n) {
      const names = [];
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let i = 0; i < n; i++) {
        const letter = letters[i] || String(i + 1);
        names.push("Gillam " + letter);
      }
      return names;
    }

    function normalizedSeedValue(player) {
      const n = Number(player?.seed);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function bySeedThenName(a, b) {
      const sa = normalizedSeedValue(a) || Number.POSITIVE_INFINITY;
      const sb = normalizedSeedValue(b) || Number.POSITIVE_INFINITY;
      if (sa !== sb) return sa - sb;
      return String(a.name || "").localeCompare(String(b.name || ""));
    }

    function randomShufflePlayers(arr) {
      const a = (arr || []).slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function nextPowerOfTwo(n) {
      let p = 1;
      while (p < n) p *= 2;
      return p;
    }

    function bracketSeedOrder(size) {
      let order = [1];
      while (order.length < size) {
        const nextSize = order.length * 2;
        order = order.flatMap((seed) => [seed, nextSize + 1 - seed]);
      }
      return order;
    }

    function seededRandomizedPlayerOrder(plist) {
      const list = (plist || []).slice();
      const seeded = list
        .filter((p) => normalizedSeedValue(p) > 0)
        .sort((a, b) => normalizedSeedValue(a) - normalizedSeedValue(b) || String(a.name || "").localeCompare(String(b.name || "")));
      const unseeded = randomShufflePlayers(list.filter((p) => normalizedSeedValue(p) === 0));

      // If there are no seeded players, every Generate Draw click must create a new random draw.
      if (!seeded.length) return unseeded;

      const n = list.length;
      const bracketSize = nextPowerOfTwo(Math.max(1, n));
      const order = bracketSeedOrder(bracketSize);
      const seedSlots = order
        .map((seedNo, pos) => ({ seedNo, pos }))
        .filter((x) => x.pos < n)
        .sort((a, b) => a.seedNo - b.seedNo)
        .map((x) => x.pos);

      const out = new Array(n).fill(null);
      seeded.forEach((player, idx) => {
        const slot = seedSlots[idx];
        if (slot != null && slot < n && !out[slot]) out[slot] = player;
      });

      const remaining = randomShufflePlayers([
        ...seeded.filter((p) => !out.includes(p)),
        ...unseeded
      ]);
      for (let i = 0; i < n; i++) {
        if (!out[i]) out[i] = remaining.shift();
      }
      return out.filter(Boolean);
    }

    function withByeIfOdd(ids) {
      return ids.length % 2 === 1 ? ids.concat(["BYE"]) : ids;
    }

    function buildRoundRobinForWeight(plist) {
      // plist is already prepared by seededRandomizedPlayerOrder().
      // Seeded players stay distributed; seed=0/empty players are shuffled every draw.
      const seeded = plist.slice().map((p) => p.id);
      const arr = withByeIfOdd(seeded);
      const n = arr.length;
      const half = n / 2;
      const rounds = [];
      for (let r = 0; r < n - 1; r++) {
        const pairs = [];
        for (let i = 0; i < half; i++) {
          const a = arr[i];
          const b = arr[n - 1 - i];
          if (a !== "BYE" && b !== "BYE") pairs.push([a, b]);
        }
        rounds.push(pairs);
        const fixed = arr[0];
        const rest = arr.slice(1);
        rest.unshift(rest.pop());
        arr.splice(0, arr.length, fixed, ...rest);
      }
      return rounds;
    }

    // Build Single Elimination nodes using a full power-of-two bracket.
    // A first-round bye advances a player by exactly one round only; it must never
    // move a player directly to a semi-final/final just because the group size is not a power of two.
    function chooseByeRecipients(players, byeCount, mode) {
      const list = (players || []).slice();
      if (!byeCount || byeCount <= 0 || !list.length) return new Set();
      const count = Math.min(byeCount, list.length);
      const selected = [];

      function idOf(p) { return String(p?.id || ""); }
      function seedOf(p) { return normalizedSeedValue(p); }
      function pickWeighted(pool) {
        const seededValues = pool.map(seedOf).filter((n) => n > 0);
        const maxSeed = seededValues.length ? Math.max(...seededValues) : 0;
        const weights = pool.map((p) => {
          const seed = seedOf(p);
          if (seed > 0 && maxSeed > 0) return Math.max(1, maxSeed + 2 - seed);
          return 1;
        });
        const total = weights.reduce((a, b) => a + b, 0);
        let r = Math.random() * total;
        for (let i = 0; i < pool.length; i++) {
          r -= weights[i];
          if (r <= 0) return i;
        }
        return pool.length - 1;
      }

      if (mode === "equal_random_chance") {
        randomShufflePlayers(list).slice(0, count).forEach((p) => selected.push(p));
      } else if (mode === "weighted_random_by_seed") {
        const pool = list.slice();
        while (selected.length < count && pool.length) {
          const idx = pickWeighted(pool);
          selected.push(pool.splice(idx, 1)[0]);
        }
      } else {
        const seeded = list
          .filter((p) => seedOf(p) > 0)
          .sort((a, b) => seedOf(a) - seedOf(b) || String(a.name || "").localeCompare(String(b.name || "")));
        const unseeded = randomShufflePlayers(list.filter((p) => seedOf(p) === 0));
        [...seeded, ...unseeded].slice(0, count).forEach((p) => selected.push(p));
      }

      return new Set(selected.map(idOf).filter(Boolean));
    }

    function preferredBracketPositionForPlayer(player, bracketSize) {
      const seed = normalizedSeedValue(player);
      if (seed <= 0) return null;
      const order = bracketSeedOrder(bracketSize);
      const pos = order.findIndex((seedNo) => Number(seedNo) === Number(seed));
      return pos >= 0 ? pos : null;
    }

    function firstEmptyPlayerSlot(slots, preferredStart) {
      const n = slots.length;
      for (let offset = 0; offset < n; offset++) {
        const i = (Number(preferredStart || 0) + offset) % n;
        if (!slots[i]) return i;
      }
      return -1;
    }

    function placePlayerForBye(slots, player) {
      const n = slots.length;
      const preferred = preferredBracketPositionForPlayer(player, n);
      const candidates = [];
      if (preferred != null) candidates.push(preferred);
      for (let i = 0; i < n; i++) candidates.push(i);

      for (const pos of candidates) {
        if (pos == null || pos < 0 || pos >= n) continue;
        const opp = pos ^ 1;
        if (!slots[pos] && !slots[opp]) {
          slots[pos] = { type: "player", playerId: player.id };
          slots[opp] = { type: "bye" };
          return true;
        }
      }
      return false;
    }

    function placePlayerInBracket(slots, player) {
      const n = slots.length;
      const preferred = preferredBracketPositionForPlayer(player, n);
      if (preferred != null && !slots[preferred]) {
        slots[preferred] = { type: "player", playerId: player.id };
        return true;
      }
      const pos = firstEmptyPlayerSlot(slots, preferred || 0);
      if (pos >= 0) {
        slots[pos] = { type: "player", playerId: player.id };
        return true;
      }
      return false;
    }

    function buildSingleEliminationNodes(plist, byeAllocationMode) {
      const players = (plist || []).slice();
      const n = players.length;
      if (n <= 1) return [];

      const bracketSize = nextPowerOfTwo(n);
      const byeCount = Math.max(0, bracketSize - n);
      const mode = byeAllocationMode || "top_seeds_first";
      const byeRecipients = chooseByeRecipients(players, byeCount, mode);
      const slots = new Array(bracketSize).fill(null);

      const byId = new Map(players.map((p) => [String(p.id), p]));
      const byePlayers = Array.from(byeRecipients).map((id) => byId.get(String(id))).filter(Boolean);
      byePlayers.forEach((p) => placePlayerForBye(slots, p));

      const remainingSeeded = players
        .filter((p) => !byeRecipients.has(String(p.id)) && normalizedSeedValue(p) > 0)
        .sort((a, b) => normalizedSeedValue(a) - normalizedSeedValue(b) || String(a.name || "").localeCompare(String(b.name || "")));
      const remainingUnseeded = randomShufflePlayers(players.filter((p) => !byeRecipients.has(String(p.id)) && normalizedSeedValue(p) === 0));
      [...remainingSeeded, ...remainingUnseeded].forEach((p) => placePlayerInBracket(slots, p));

      for (let i = 0; i < slots.length; i++) {
        if (!slots[i]) slots[i] = { type: "bye" };
      }

      const bouts = [];
      let round = 1;
      let current = slots;
      while (current.length > 1) {
        const next = [];
        for (let i = 0; i < current.length; i += 2) {
          const a = current[i];
          const b = current[i + 1];
          const aBye = !a || a.type === "bye";
          const bBye = !b || b.type === "bye";

          if (aBye && bBye) {
            next.push({ type: "bye" });
          } else if (aBye) {
            next.push(b);
          } else if (bBye) {
            next.push(a);
          } else {
            const localId = bouts.length + 1;
            bouts.push({ localId, round, sourceA: a, sourceB: b });
            next.push({ type: "bout", boutLocalId: localId });
          }
        }
        current = next;
        round++;
      }
      return bouts;
    }

    // UPDATED: mix bouts across weights; now takes bout objects instead of [a,b]
function mixBoutsAcrossWeights(input, weightsOrder) {
      const weights =
        weightsOrder && weightsOrder.length ? weightsOrder.slice() : Object.keys(input);

      // For each group, keep a copy of its bout queue with blueId / greenId / localId / type / round.
      const queues = new Map(weights.map((w) => [w, (input[w] || []).slice()]));

      // Final result: an array of [groupKey, boutDesc].
      const result = [];

      // Last bout played by each player: playerId -> boutIndex.
      const lastBoutIndexByPlayer = new Map();

      // Recently used groups, used to avoid immediate repetition when possible.
      const lastWeights = [];

      function canUseBout(bout, weightKey, requireRest, avoidSameWeight) {
        const idxNow = result.length;
        const players = [];
        if (bout.blueId) players.push(bout.blueId);
        if (bout.greenId) players.push(bout.greenId);

        // Rest rule: at least two bouts between two bouts for the same player (gap >= 3).
        if (requireRest) {
          for (const pid of players) {
            const lastIdx = lastBoutIndexByPlayer.get(pid);
            if (lastIdx != null && idxNow - lastIdx <= 2) {
              return false;
            }
          }
        }

        // Avoid repeating the same group immediately whenever possible.
        if (avoidSameWeight && lastWeights.length > 0) {
          const lastW = lastWeights[lastWeights.length - 1];
          if (weightKey === lastW) {
            return false;
          }
        }

        return true;
      }

      function pickNext() {
        // Try progressively relaxed selection modes:
        // 1) Rest + no group repetition.
        // 2) Rest only.
        // 3) No group repetition only.
        // 4) No constraints when necessary.
        const modes = [
          { requireRest: true, avoidSameWeight: true },
          { requireRest: true, avoidSameWeight: false },
          { requireRest: false, avoidSameWeight: true },
          { requireRest: false, avoidSameWeight: false }
        ];

        for (const mode of modes) {
          const { requireRest, avoidSameWeight } = mode;
          for (const w of weights) {
            const q = queues.get(w);
            if (!q || !q.length) continue;

            let idx = q.findIndex((bout) =>
              canUseBout(bout, w, requireRest, avoidSameWeight)
            );
            if (idx === -1) continue;

            const bout = q.splice(idx, 1)[0];
            return [w, bout];
          }
        }

        return null;
      }

      while (true) {
        const pick = pickNext();
        if (!pick) break;
        const [w, bout] = pick;
        const idxNow = result.length;

        result.push([w, bout]);

        const players = [];
        if (bout.blueId) players.push(bout.blueId);
        if (bout.greenId) players.push(bout.greenId);
        for (const pid of players) {
          lastBoutIndexByPlayer.set(pid, idxNow);
        }

        lastWeights.push(w);
        if (lastWeights.length > 2) lastWeights.shift();
      }

      return result;
    }

       function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function assignReferees(bouts, playersIndex, referees, avoidSpan, options) {

      const settings = options || {};
      const assignmentMode = settings.assignmentMode || "global";
      const fallbackToGlobal = settings.fallbackToGlobal !== false;

      const globalPool = shuffle((referees || []).slice());
      const poolByGillam = new Map();

      function refsForGillam(gillam) {
        if (!poolByGillam.has(gillam)) {
          const filtered = (referees || []).filter((r) => {
            if (!r) return false;
            const scope = r.assignScope || "global";
            if (scope === "global") return true;
            if (scope === "pool") return (r.poolGillam || "") === (gillam || "");
            return true;
          });
          poolByGillam.set(gillam, shuffle(filtered));
        }
        return poolByGillam.get(gillam);
      }

      const recentMainByGillam = new Map();
      const recentJudgeByGillam = new Map();
      const recentMainGlobal = [];
      const recentJudgeGlobal = [];
      const configuredMainAvoidSpan = Math.max(1, Number(avoidSpan) || 6);
      const mainAvoidSpanMode = settings.mainAvoidSpanMode || "auto";

      function computeEffectiveMainAvoidSpan(pool) {
        if (mainAvoidSpanMode !== "auto") return configuredMainAvoidSpan;
        const available = Array.isArray(pool) ? pool.length : 0;
        if (available <= 1) return 1;
        return Math.max(1, Math.min(configuredMainAvoidSpan, available - 1));
      }

      function getRecentArrays(gillam) {
        if (assignmentMode !== "gillam_pool") {
          return { main: recentMainGlobal, judge: recentJudgeGlobal };
        }
        if (!recentMainByGillam.has(gillam)) recentMainByGillam.set(gillam, []);
        if (!recentJudgeByGillam.has(gillam)) recentJudgeByGillam.set(gillam, []);
        return { main: recentMainByGillam.get(gillam), judge: recentJudgeByGillam.get(gillam) };
      }

      function getPool(gillam) {
        if (assignmentMode === "gillam_pool") {
          const local = refsForGillam(gillam);
          if (local && local.length) return local;
          if (!fallbackToGlobal) return [];
        }
        return globalPool;
      }

      function isNeutralAffiliationCode(code) {
        const c = String(code || "").trim().toUpperCase();
        return !c || c === "NA" || c === "NONE" || c === "N/A" || c === "CLB" || c === "CLUB";
      }

      function takeCandidate(pool, avoidCountries, recent, alsoAvoid) {
        alsoAvoid = alsoAvoid || new Set();
        if (!pool || !pool.length) return null;

        const effectiveAvoid = new Set(
          Array.from(avoidCountries || []).filter((code) => !isNeutralAffiliationCode(code))
        );

        for (let i = 0; i < pool.length; i++) {
          const r = pool[i];
          if (effectiveAvoid.has(r.country)) continue;
          if (alsoAvoid.has(r.id)) continue;
          if (recent.includes(r.id)) continue;
          pool.push(pool.splice(i, 1)[0]);
          return r.id;
        }

        for (let i = 0; i < pool.length; i++) {
          const r = pool[i];
          if (effectiveAvoid.has(r.country)) continue;
          if (alsoAvoid.has(r.id)) continue;
          pool.push(pool.splice(i, 1)[0]);
          return r.id;
        }

        for (let i = 0; i < pool.length; i++) {
          const r = pool[i];
          if (alsoAvoid.has(r.id)) continue;
          pool.push(pool.splice(i, 1)[0]);
          return r.id;
        }

        return null;
      }

      function isHardByeAssignmentSlot(value) {
        const t = String(value ?? "").trim().toUpperCase();
        return t === "BYE" || t === "BYE_EMPTY" || t === "AUTO_ADVANCE" ;
      }

      function isResolvableContestForReferees(bout) {
        // BYE / auto-advance is not a competition and must not receive referees.
        // Waiting-for-result bouts are real scheduled competitions and should receive referees/workload from the beginning.
        if (!bout || bout.internalOnly || bout.excludedFromFightOrder || bout.autoAdvanced === true) return false;
        if (isHardByeAssignmentSlot(bout.blueId) || isHardByeAssignmentSlot(bout.greenId)) return false;
        return true;
      }

      const out = [];
      for (const b of bouts) {
        if (!isResolvableContestForReferees(b)) continue;
        const A = playersIndex.get(b.blueId);
        const G = playersIndex.get(b.greenId);
        const avoid = new Set([A?.country, G?.country].filter(Boolean));
        const pool = getPool(b.gillam);
        const recent = getRecentArrays(b.gillam);

        const manualMain = b.manualMainRef || null;
        const manualJudge1 = b.manualJudge1 || null;
        const manualJudge2 = b.manualJudge2 || null;
        const hasManual = !!(manualMain || manualJudge1 || manualJudge2);

        const effectiveMainAvoidSpan = computeEffectiveMainAvoidSpan(pool);
        const effectiveJudgeAvoidSpan = Math.max(1, effectiveMainAvoidSpan * 2);

        const main = manualMain || takeCandidate(pool, avoid, recent.main.slice(0, effectiveMainAvoidSpan));
        const j1 = manualJudge1 || takeCandidate(pool, avoid, recent.judge.slice(0, effectiveJudgeAvoidSpan), new Set([main]));
        const j2 = manualJudge2 || takeCandidate(pool, avoid, recent.judge.slice(0, effectiveJudgeAvoidSpan), new Set([main, j1]));

        if (main) {
          recent.main.unshift(main);
          if (recent.main.length > effectiveMainAvoidSpan) recent.main.splice(effectiveMainAvoidSpan);
        }
        if (j1) recent.judge.unshift(j1);
        if (j2) recent.judge.unshift(j2);
        if (recent.judge.length > effectiveJudgeAvoidSpan) recent.judge.splice(effectiveJudgeAvoidSpan);

        out.push({
          boutNo: b.boutNo,
          mainRef: main,
          judge1: j1,
          judge2: j2,
          manual: hasManual,
          gillam: b.gillam || ""
        });
      }
      return out;
    }

    function computeScores(events) {
      const base = {
        blue: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
        green: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
        halalWinner: null,
        lastScoreSide: null,
        lastPenaltySide: null
      };

      function sideKey(s) { return s === "blue" ? "blue" : "green"; }

      for (const ev of events) {
        const s = sideKey(ev.side);
        const o = s === "blue" ? "green" : "blue";

        if (ev.type === "H" || ev.type === "YO" || ev.type === "CH") {
          if (ev.type === "H") {
            base[s].H += 1;
            if (!base.halalWinner) base.halalWinner = s;
          } else if (ev.type === "YO") {
            base[s].YO += 1;
          } else if (ev.type === "CH") {
            base[s].CH += 1;
          }
          while (base[s].YO >= 2) {
            base[s].YO -= 2;
            base[s].H += 1;
            if (!base.halalWinner) base.halalWinner = s;
          }
          base.lastScoreSide = s;
        } else if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
          const lvl = ev.type === "T" ? 1 : ev.type === "D" ? 2 : 3;
          if (lvl > base[s].penaltyLevel) {
            base[s].penaltyLevel = lvl;
            base.lastScoreSide = o;
            if (lvl === 3 && !base.halalWinner) {
              base.halalWinner = o;
            }
          }
          base.lastPenaltySide = s;
        }
      }

      const disp = {
        blue: { H: base.blue.H, YO: base.blue.YO, CH: base.blue.CH, penaltyLevel: base.blue.penaltyLevel },
        green: { H: base.green.H, YO: base.green.YO, CH: base.green.CH, penaltyLevel: base.green.penaltyLevel },
        halalWinner: base.halalWinner,
        lastScoreSide: base.lastScoreSide,
        lastPenaltySide: base.lastPenaltySide
      };

      const pBlue = base.blue.penaltyLevel;
      const pGreen = base.green.penaltyLevel;

      if (pGreen === 1) disp.blue.CH += 1;
      else if (pGreen === 2) disp.blue.YO += 1;
      else if (pGreen === 3) disp.blue.H += 1;

      if (pBlue === 1) disp.green.CH += 1;
      else if (pBlue === 2) disp.green.YO += 1;
      else if (pBlue === 3) disp.green.H += 1;

      ["blue", "green"].forEach((side) => {
        const s = disp[side];
        while (s.YO >= 2) {
          s.YO -= 2;
          s.H += 1;
          if (!disp.halalWinner) {
            disp.halalWinner = side;
          }
        }
      });

      return disp;
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function decideWinner(state, isTimeUp) {
      if (state.halalWinner) return state.halalWinner;

      const b = state.blue;
      const g = state.green;

      if (b.H !== g.H) return b.H > g.H ? "blue" : "green";
      if (b.YO !== g.YO) return b.YO > g.YO ? "blue" : "green";
      if (b.CH !== g.CH) return b.CH > g.CH ? "blue" : "green";

      if (!isTimeUp) return null;

      if (b.penaltyLevel !== g.penaltyLevel) {
        return b.penaltyLevel > g.penaltyLevel ? "green" : "blue";
      }

      if (state.lastPenaltySide) {
        return state.lastPenaltySide === "blue" ? "green" : "blue";
      }

      if (state.lastScoreSide) {
        return state.lastScoreSide;
      }

      return null;
    }

    function rankToStars(rank) {
      const n = Math.max(1, Math.min(3, Number(rank) || 1));
      return "★".repeat(n);

    function formatRefDisplay(r, mode = "name_only") {
      if (!r) return "";
      const num = String(r.refNo || "").trim();
      const name = String(r.name || "").trim();
      const country = String(r.country || "").trim();

      function decodeBase64Utf8(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      function MainWebEmbeddedRefereeManagement() {
        const hostRef = useRef(null);
        useEffect(() => {
          const host = hostRef.current;
          if (!host) return;
          host.innerHTML = "";
          const shadow = host.attachShadow ? host.attachShadow({ mode: "open" }) : host;
          const css = decodeBase64Utf8(REF_MGMT_CSS_B64);
          const bodyHtml = decodeBase64Utf8(REF_MGMT_BODY_B64);
          const scriptText = decodeBase64Utf8(REF_MGMT_SCRIPT_B64);
          shadow.innerHTML = `<style>${css}</style>${bodyHtml}`;
          try {
            const runner = new Function("root", scriptText);
            runner(shadow);
          } catch (err) {
            console.error("Embedded Referee Management failed", err);
            const pre = document.createElement("pre");
            pre.style.color = "#fecaca";
            pre.style.background = "#3b0b12";
            pre.style.padding = "12px";
            pre.style.borderRadius = "8px";
            pre.textContent = "Embedded Referee Management failed: " + (err && err.message ? err.message : err);
            shadow.appendChild(pre);
          }
          return () => { host.innerHTML = ""; };
        }, []);
        return <div ref={hostRef} className="w-full min-h-[1500px]" />;
      }

          if (!raw) return false;

          setCurrentTournamentMeta(s.currentTournamentMeta || null);
          setFinalRefPool(Array.isArray(s.finalRefPool) ? s.finalRefPool : []);
          setSpecialBoutMap(s.specialBoutMap || s.currentTournamentMeta?.specialBoutMap || {});

      function buildBoutMetaFromSchedule(scheduleObj) {
        const out = {};
        const bouts = scheduleObj?.bouts || [];
        bouts.forEach((b) => {
          if (!b || !b.finished) return;
          const events = Array.isArray(b.meta)
            ? b.meta.map((ev) => ({
                side: ev.side,
                type: ev.type,
                atMs: Number(ev.timeSec || 0) * 1000
              }))
            : [];
          out[b.boutNo] = {
            events,
            durationSec: b.durationMs ? Math.floor(b.durationMs / 1000) : 0,
            winner: b.winner || null,
            resultType: b.resultType || "points",
            withdrawnSide: b.withdrawnSide || null,
            noContest: !!b.noContest,
            autoAdvanced: !!b.autoAdvanced,
            savedAt: b.savedAt || null
          };
        });
        return out;
      }

      function ensureWritable(actionLabel) {
        if (!isTournamentReadOnly) return true;
        alert((actionLabel || "This action") + " is disabled while viewing an archived tournament.");
        return false;

      function handleTournamentScopeChange(nextScope) {
        if (!ensureWritable("Changing tournament type")) return;
        const scope = nextScope || "internal_local";
        const defaultAgeGroup = defaultAgeGroupNumbForScope(scope);
        setTournamentScope(scope);
        const effectiveAffiliationMode = normalizedAffiliationMode(scope, affiliationMode);
        setAffiliationMode(effectiveAffiliationMode);
        setManualGroupsByAge((prev) => ({ ...defaultManualGroupsForScope(scope), ...(prev || {}) }));
        setPlayers((prev) =>
          (prev || []).map((p) => {
            const validGroup = activeAgeGroups(scope).some((g) => Number(g.numb) === Number(p.ageGroupNumb));
            const detectedByAge = p.age !== "" && p.age != null ? ageGroupFromAge(p.age, scope) : defaultAgeGroup;
            const ageGroupNumb = validGroup ? Number(p.ageGroupNumb) : detectedByAge;
            const sex = p.sex === "F" ? "F" : "M";
            const weight = bucketWeight(sex, p.actualKg, ageGroupNumb, scope);
            const manualGroup = normalizeManualGroup(p.manualGroup, manualGroupsByAge, ageGroupNumb, scope);
            const slot = isManualGroupsMode(weightMode) ? manualGroup : weight;
            const slotLabel = String(slot || "").replace("+", "P").replace("-", "N").replace(/\s+/g, "");
            const aff = normalizedAffiliationMode(scope, effectiveAffiliationMode) === "none" ? defaultAffiliation(scope, effectiveAffiliationMode) : resolveAffiliation(p.countryFull || p.country, scope, effectiveAffiliationMode);
            const id = `${aff.code || "UNK"}-${(p.name || "").replace(/\s+/g, "").toUpperCase()}-${slotLabel}`;
            return { ...p, countryFull: aff.full, country: aff.code, ageGroupNumb, weight, manualGroup, id };
          })
        );
        setRefs((prev) =>
          (prev || []).map((r) => {
            const aff = normalizedAffiliationMode(scope, effectiveAffiliationMode) === "none"
              ? defaultAffiliation(scope, effectiveAffiliationMode)
              : resolveAffiliation(r.countryFull || r.country, scope, effectiveAffiliationMode);
            return { ...r, countryFull: aff.full, country: aff.code };
          })
        );
        setSchedule(null);
        setBoutMeta({});
        setActiveBoutNo(null);
        setSbEvents([]);
        setTimerMs(0);
        setTimerRunning(false);
        setShowMeta(false);
        setDrawValidation({ errors: [], warnings: [] });
      }

        const payload = {
          name: String(newTournamentName || "").trim(),
          date: String(newTournamentDate || "").trim(),
          archiveCurrent: !!archiveCurrent
        };
        if (!payload.name || !payload.date) {
          alert("Enter tournament name and date first.");
          return;
        }
        if (!base) {
          const localMeta = {
            id: "local_" + Date.now(),
            name: payload.name,
            date: payload.date,
            status: "active",
            tournamentScope,
            affiliationMode,
            weightMode,
            manualGroupsByAge,
            manualDurationSeconds,
            manualDurationMenSeconds,
            manualDurationWomenSeconds,
            hideSeedPublic
          };
          clearTournamentWorkspace();
          setCurrentTournamentMeta(localMeta);

          markUnsynced();
          setTournamentActionMsg("Local offline tournament created. Add players/referees, then use Sync Now later if you connect a server.");
          setTimeout(() => saveLocalSnapshot("local_tournament_created"), 0);
          return;
        }
        try {
          const res = await fetch(base + "/api/tournament/new", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 409 && data?.activeTournament && !archiveCurrent) {
            const wantsArchive = window.confirm(
              "An active tournament already exists: " +
                data.activeTournament.name +
                "\n\nPress OK to archive it and start the new tournament."
            );
            if (wantsArchive) {
              await createTournamentOnServer(true);
            }
            return;
          }
          if (!res.ok) {
            throw new Error(data?.error || "HTTP " + res.status);
          }
          clearTournamentWorkspace();
          loadTournamentIntoApp(data.tournament, { readOnly: false });
          setTournamentActionMsg("New tournament created.");
          refreshTournamentList();
        } catch (err) {
          console.error("Create tournament error:", err);
          setTournamentActionMsg("Could not create tournament: " + err.message);
        }

      // helper to download CSV (used in reports)
      function downloadCSV(filename, columns, rows) {
        if (!rows || !rows.length) {
          alert("No data to export.");
          return;
        }
        const header = columns.map((c) => c.label).join(",");
        const lines = rows.map((row) =>
          columns
            .map((c) => {
              const v = row[c.key];
              const s = v == null ? "" : String(v);
              return '"' + s.replace(/"/g, '""') + '"';
            })
            .join(",")
        );
        const blob = new Blob([header + "\n" + lines.join("\n")], {
          type: "text/csv;charset=utf-8;"
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(url);
          a.remove();
        }, 500);
      }

      // Send the full local tournament snapshot to the backend server.
      // Direction rule: Sync Now pushes local data to the server; automatic refresh never overwrites unsynced local edits.
      async function syncScheduleToServer(newSchedule) {
        const base = normalizedServerBase();
        if (!base) return;

        try {
          setServerStatus("idle");
          setServerStatusMsg("Pushing local tournament data to server...");

          const metaBase = currentTournamentMeta || {};
          const payload = {
            players,
            refs,
            schedule: newSchedule || schedule || null,
            tournamentMeta: {
              ...metaBase,
              name: metaBase.name || newTournamentName || "Tournament",
              date: metaBase.date || newTournamentDate || new Date().toISOString().slice(0, 10),
              tournamentScope,
              affiliationMode,
              weightMode,
              manualGroupsByAge,
              manualDurationSeconds,
              manualDurationMenSeconds,
              manualDurationWomenSeconds,
              hideSeedPublic,
              byeAllocationMode,
              finalRefereePool: finalRefPool || [],
              specialBoutMap: specialBoutMap || {},
              refQuotaMap: refQuotaMap || {},
              examRefMap: examRefMap || {},
              refManualFilters: refManualFilters || { hideZero: true, hideReduced: false, finalPoolOnly: false, minAvg: 0 },
              delegationApprovals: delegationApprovals || {}
            }
          };

          const endpoint = payload.schedule ? "/api/schedule" : "/api/tournament/full-save";
          const res = await fetch(base + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setServerStatus("error");
            setServerStatusMsg("Sync failed: " + (data?.error || res.status));
            console.error("Sync failed:", data);
            return;
          }

          if (data?.tournament?.meta) setCurrentTournamentMeta(data.tournament.meta);
          if (data?.tournament?.tournamentMeta?.delegationApprovals) setDelegationApprovals(data.tournament.tournamentMeta.delegationApprovals);
          const stamp = data?.tournament?.schedule?.updatedAt || data?.tournament?.meta?.lastSavedAt || new Date().toISOString();
          setLastServerSnapshotAt(stamp);
          markSynced();
          setServerStatus("ok");
          setServerStatusMsg(data?.mergeSafe ? "Local data merged safely on server." : "Local data pushed to server successfully.");
        } catch (err) {
          console.error("Sync error:", err);
          setServerStatus("error");
          setServerStatusMsg("Error contacting server.");
        }
      }

      function mergeRefereeManagementPayload(data, reason) {
        if (!data) return;
        const serverRefs = Array.isArray(data.refs) ? data.refs : null;
        const serverBouts = Array.isArray(data.bouts) ? data.bouts : [];
        const serverAssignments = Array.isArray(data.assignments) ? data.assignments : null;
        const serverFinalPool = Array.isArray(data.finalRefereePool) ? data.finalRefereePool.map(String) : null;
        const serverSpecialBoutMap = data.specialBoutMap && typeof data.specialBoutMap === "object" && !Array.isArray(data.specialBoutMap) ? data.specialBoutMap : null;
        const serverRefQuotaMap = data.refQuotaMap && typeof data.refQuotaMap === "object" && !Array.isArray(data.refQuotaMap) ? data.refQuotaMap : null;
        const serverExamRefMap = data.examRefMap && typeof data.examRefMap === "object" && !Array.isArray(data.examRefMap) ? data.examRefMap : null;
        const serverRefManualFilters = data.refManualFilters && typeof data.refManualFilters === "object" && !Array.isArray(data.refManualFilters) ? data.refManualFilters : null;
        const serverStamp = data.lastSavedAt || data.scheduleVersion || data.meta?.updatedAt || new Date().toISOString();

        if (serverRefs) setRefs(serverRefs);
        if (serverFinalPool) setFinalRefPool(serverFinalPool);
        if (serverSpecialBoutMap) setSpecialBoutMap(serverSpecialBoutMap);
        if (serverRefQuotaMap) setRefQuotaMap(serverRefQuotaMap);
        if (serverExamRefMap) setExamRefMap(serverExamRefMap);
        if (serverRefManualFilters) setRefManualFilters({ hideZero: true, hideReduced: false, finalPoolOnly: false, minAvg: 0, ...serverRefManualFilters });

        setSchedule((prev) => {
          if (!prev || !Array.isArray(prev.bouts) || !prev.bouts.length) {
            return {
              ...(prev || {}),
              bouts: serverBouts,
              assignments: serverAssignments || data.assignments || [],
              bracketLinks: prev?.bracketLinks || data.bracketLinks || {},
              updatedAt: serverStamp
            };
          }

          const serverBoutByNo = new Map(serverBouts.map((b) => [String(b.boutNo), b]));
          const mergedBouts = prev.bouts.map((localBout) => {
            const serverBout = serverBoutByNo.get(String(localBout.boutNo));
            if (!serverBout) return localBout;
            return {
              ...localBout,
              refEvaluations: Array.isArray(serverBout.refEvaluations) ? serverBout.refEvaluations : (localBout.refEvaluations || []),
              mainRef: serverBout.mainRef ?? localBout.mainRef,
              judge1: serverBout.judge1 ?? localBout.judge1,
              judge2: serverBout.judge2 ?? localBout.judge2
            };
          });

          return {
            ...prev,
            bouts: mergedBouts,
            assignments: serverAssignments || prev.assignments || [],
            bracketLinks: data.bracketLinks || prev.bracketLinks || {},
            updatedAt: serverStamp
          };
        });

        setLastServerSnapshotAt(serverStamp);
        setSyncMode("online");
        setUnsyncedChanges(false);
        setRefMgmtStatusMsg("Referee management data refreshed from server" + (reason ? ` (${reason})` : "") + ".");
      }

      async function refreshRefereeManagementFromServer(reason) {
        const base = normalizedServerBase();
        if (!base) {
          setRefMgmtStatusMsg("Enter server URL first, or continue using local data.");
          return;
        }
        const reasonText = String(reason || "").toLowerCase();
        if (unsyncedChangesRef.current && (reasonText.includes("auto") || reasonText.includes("external"))) {
          setRefMgmtStatusMsg("Local changes are not synced. Use Sync Now before loading referee data from the server.");
          return;
        }
        try {
          const res = await fetch(base + "/api/referee-management?ts=" + Date.now());
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          mergeRefereeManagementPayload(data, reason || "manual refresh");
        } catch (err) {
          console.error("Referee management refresh error:", err);
          setSyncMode("server_error");
          setRefMgmtStatusMsg("Could not refresh referee management data from server: " + err.message);
        }
      }

      function ensureAudioContext() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audioCtxRef.current) {
          audioCtxRef.current = new AC();
        }
        const ctx = audioCtxRef.current;
        if (ctx.state === "suspended") {
          ctx.resume();
        }
        return ctx;
      }

      // Longer bell (~3 seconds)
      function playBell() {
        try {
          const ctx = ensureAudioContext();
          if (!ctx) return;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(1000, ctx.currentTime);
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + 0.1);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
          o.connect(g);
          g.connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + 3);
        } catch (e) {}
      }

      // Longer half-time ping (~3 seconds, different tone)
      function playHalfPing() {
        try {
          const ctx = ensureAudioContext();
          if (!ctx) return;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "square";
          o.frequency.setValueAtTime(600, ctx.currentTime);
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
          o.connect(g);
          g.connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + 3);
        } catch (e) {}
      }

      const stats = useMemo(
        () => ({ players: players.length, refs: refs.length }),
        [players, refs]
      );

      function rowMatchesSearch(row, query) {
        const q = String(query || "").trim().toLowerCase();
        if (!q) return true;
        return Object.values(row || {}).some((v) => String(v ?? "").toLowerCase().includes(q));
      }

      const filteredPlayers = useMemo(() => {
        const rows = (players || [])
          .map((p, idx) => ({ p, idx }))
          .filter(({ p, idx }) => rowMatchesSearch({ ...p, rowNo: idx + 1, affiliation: p.countryFull, code: p.country, bucket: p.weight }, playerSearch));

        const text = (v) => String(v ?? "").toLowerCase();
        const weightValue = (p) => {
          const raw = String(isManualGroupsMode(weightMode) ? (p.manualGroup || p.weight || "") : (p.weight || "")).replace(/^Group\s+/i, "").trim();
          const n = Number(raw.replace("+", "").replace("-", ""));
          return Number.isFinite(n) ? n : 9999;
        };

        rows.sort((a, b) => {
          if (playerSortMode === "country") {
            return text(a.p.countryFull || a.p.country).localeCompare(text(b.p.countryFull || b.p.country)) || text(a.p.name).localeCompare(text(b.p.name));
          }
          if (playerSortMode === "weight") {
            return weightValue(a.p) - weightValue(b.p) || text(a.p.countryFull || a.p.country).localeCompare(text(b.p.countryFull || b.p.country)) || text(a.p.name).localeCompare(text(b.p.name));
          }
          if (playerSortMode === "seed") {
            return (a.p.seed ?? 999999) - (b.p.seed ?? 999999) || text(a.p.name).localeCompare(text(b.p.name));
          }
          if (playerSortMode === "ageGroup") {
            return Number(a.p.ageGroupNumb || 0) - Number(b.p.ageGroupNumb || 0) || weightValue(a.p) - weightValue(b.p) || text(a.p.name).localeCompare(text(b.p.name));
          }
          if (playerSortMode === "sex") {
            return text(a.p.sex).localeCompare(text(b.p.sex)) || weightValue(a.p) - weightValue(b.p) || text(a.p.name).localeCompare(text(b.p.name));
          }
          if (playerSortMode === "name") {
            return text(a.p.name).localeCompare(text(b.p.name));
          }
          return a.idx - b.idx;
        });

        return rows;
      }, [players, playerSearch, playerSortMode, weightMode]);

      const filteredRefs = useMemo(() => {
        return (refs || []).map((r, idx) => ({ r, idx })).filter(({ r, idx }) => rowMatchesSearch({ ...r, rowNo: idx + 1 }, refSearch));
      }, [refs, refSearch]);

      const filteredMgmtRefs = useMemo(() => {
        const rows = (refs || []).map((r, idx) => ({ r, idx }))
          .filter(({ r, idx }) => rowMatchesSearch({ ...r, rowNo: idx + 1 }, refMgmtSearch));
        return refMgmtOnlyFinals ? rows.filter(({ r }) => finalRefPool.includes(r.id)) : rows;
      }, [refs, refMgmtSearch, refMgmtOnlyFinals, finalRefPool]);

      function refQuota(refId) {
        const n = Number(refQuotaMap?.[refId]);
        return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 100;
      }

      function refereeAvgNumber(refId) {
        const n = Number(refereeAverageScore(refId));
        return Number.isFinite(n) ? n : 0;
      }

      function isReducedRef(refId) { return refQuota(refId) < 100; }
      function isZeroQuotaRef(refId) { return refQuota(refId) <= 0; }

      function quotaBadgeClass(refId) {
        const q = refQuota(refId);
        if (q <= 0) return "bg-rose-950/60 border-rose-700 text-rose-200";
        if (q < 100) return "bg-amber-950/60 border-amber-700 text-amber-200";
        return "bg-emerald-950/40 border-emerald-700 text-emerald-200";
      }

      function isBoutSpecial(bout) {
        if (!bout) return false;
        if (specialBoutMap?.[bout.boutNo]) return true;
        const stage = String(bout.stage || "").toLowerCase();
        return stage.includes("final") || stage.includes("semi") || stage.includes("bronze");
      }

      function activeBoutIndexForRefGrace() {
        const bouts = schedule?.bouts || [];
        const idx = bouts.findIndex((b) => String(b.boutNo) === String(activeBoutNo));
        return idx >= 0 ? idx : -1;
      }

      function quotaAppliesToBout(bout) {
        const bouts = schedule?.bouts || [];
        const boutIdx = bouts.findIndex((b) => String(b.boutNo) === String(bout?.boutNo));
        const activeIdx = activeBoutIndexForRefGrace();
        if (boutIdx < 0) return true;
        if (activeIdx < 0) return true;
        return boutIdx > activeIdx + 1;
      }

      function refAllowedForAutoBout(ref, bout) {
        if (!ref) return false;
        const q = refQuota(ref.id);
        if (q <= 0 && quotaAppliesToBout(bout)) return false;
        if (q < 100 && isBoutSpecial(bout)) return false;
        return true;
      }

      function refAllowedByManualFilters(ref) {
        if (!ref) return false;
        const q = refQuota(ref.id);
        if (refManualFilters?.hideZero && q <= 0) return false;
        if (refManualFilters?.hideReduced && q < 100) return false;
        if (refManualFilters?.finalPoolOnly && !finalRefPool.includes(ref.id)) return false;
        const minAvg = Number(refManualFilters?.minAvg || 0);
        if (minAvg > 0 && refereeAvgNumber(ref.id) < minAvg) return false;
        return true;
      }

      function updateRefQuota(refId, quota) {
        if (!ensureWritable("Changing referee participation quota")) return;
        const nextQuota = Math.max(0, Math.min(100, Number(quota)));
        const avg = refereeAvgNumber(refId);
        const refObj = (refs || []).find((r) => r.id === refId);
        if (avg >= 90 && nextQuota < 100) {
          const ok = window.confirm(`Warning: ${refObj?.name || "This referee"} has a high average score (${avg}). Reduce participation quota to ${nextQuota}%?`);
          if (!ok) return;
        }
        setRefQuotaMap((prev) => ({ ...(prev || {}), [refId]: nextQuota }));
        setRefMgmtStatusMsg(`Participation quota updated. It affects assignments after the current bout and the next bout when an active bout is selected.`);
        markUnsynced();
      }

      function toggleSpecialBout(boutNo) {
        if (!ensureWritable("Marking special match")) return;
        setSpecialBoutMap((prev) => {
          const next = { ...(prev || {}) };
          if (next[boutNo]) delete next[boutNo];
          else next[boutNo] = { marked: true, markedAt: new Date().toISOString() };
          return next;
        });
        setRefMgmtStatusMsg("Special match marking updated locally. Save Assignments / Sync Now to preserve it on the server.");
        markUnsynced();
      }

      const refManagementIssues = useMemo(() => {
        const errors = [];
        const warnings = [];
        const byNo = new Map();
        const byName = new Map();
        (refs || []).forEach((r, idx) => {
          const refNo = String(r?.refNo || "").trim();
          const name = String(r?.name || "").trim();
          if (!name) warnings.push(`Referee row ${idx + 1} has no name.`);
          if (!refNo) warnings.push(`Referee row ${idx + 1} has no referee number.`);
          if (refNo) {
            if (byNo.has(refNo)) errors.push(`Duplicate referee number #${refNo}.`);
            byNo.set(refNo, true);
          }
          const key = name.toLowerCase();
          if (key) {
            if (byName.has(key)) warnings.push(`Possible duplicate referee name: ${name}.`);
            byName.set(key, true);
          }
        });

        const validIds = new Set((refs || []).map((r) => r.id));
        (finalRefPool || []).forEach((id) => {
          if (!validIds.has(id)) warnings.push(`Final pool contains a removed referee (${id}). Save/Clean Final Pool to remove it.`);
        });

        (schedule?.assignments || []).forEach((a) => {
          const ids = [a.mainRef, a.judge1, a.judge2].filter(Boolean).map(String);
          const unique = new Set(ids);
          if (ids.length !== unique.size) errors.push(`Bout #${a.boutNo}: same referee selected more than once in one match.`);
        });

        const byOrder = new Map();
        (schedule?.bouts || []).forEach((b, idx) => {
          const orderKey = String(b.round || b.roundNo || b.orderNo || b.localId || idx + 1);
          const a = (schedule?.assignments || []).find((x) => String(x.boutNo) === String(b.boutNo));
          if (!a) return;
          [a.mainRef, a.judge1, a.judge2].filter(Boolean).forEach((rid) => {
            const key = `${orderKey}|${rid}`;
            if (!byOrder.has(key)) byOrder.set(key, []);
            byOrder.get(key).push(b.gillam || "");
          });
        });
        byOrder.forEach((gillams, key) => {
          const uniqueGillams = Array.from(new Set(gillams.filter(Boolean)));
          if (uniqueGillams.length > 1) warnings.push(`One referee appears in multiple Gillams at the same bout order: ${uniqueGillams.join(", ")}.`);
        });

        (schedule?.bouts || []).forEach((b) => {
          if (isBoutSpecial(b)) {
            const a = (schedule?.assignments || []).find((x) => String(x.boutNo) === String(b.boutNo));
            [a?.mainRef, a?.judge1, a?.judge2].filter(Boolean).forEach((rid) => {
              if (isReducedRef(rid)) warnings.push(`Special bout #${b.boutNo}: reduced-quota referee is assigned manually/previously.`);
            });
          }
        });

        (refs || []).forEach((r) => {
          if (isZeroQuotaRef(r.id)) warnings.push(`${r.name || r.refNo}: participation quota is 0%; will be excluded from future automatic assignments after grace period.`);
          else if (isReducedRef(r.id)) warnings.push(`${r.name || r.refNo}: participation quota is reduced to ${refQuota(r.id)}%.`);
        });

        return { errors, warnings };
      }, [refs, schedule, finalRefPool, refQuotaMap, specialBoutMap]);


      const refMgmtBouts = useMemo(() => {
        const q = String(refMgmtBoutSearch || "").trim().toLowerCase();
        const pIndex = new Map((players || []).map((p) => [p.id, p]));
        return (schedule?.bouts || [])
          .map((b, idx) => {
            const A = b.blueId ? pIndex.get(b.blueId) : null;
            const G = b.greenId ? pIndex.get(b.greenId) : null;
            const assignment = (schedule?.assignments || []).find((a) => String(a.boutNo) === String(b.boutNo)) || { boutNo: b.boutNo };
            const ageLabel = ageGroupLabel(b.ageGroupNumb, tournamentScope) || "";
            const category = [ageLabel, b.sex === "F" ? "Women" : "Men", slotLabel(b)].filter(Boolean).join(" • ");
            const specialLabel = isBoutSpecial(b) ? "special marked important high-level" : "";
            const haystack = [b.boutNo, b.gillam, b.stage, category, specialLabel, A?.name, A?.country, G?.name, G?.country].join(" ").toLowerCase();
            return { b, idx, A, G, assignment, category, haystack };
          })
          .filter((row) => {
            if (refMgmtStageFilter !== "all" && String(row.b.stage || "") !== refMgmtStageFilter) return false;
            if (!q) return true;
            return row.haystack.includes(q);
          });
      }, [schedule, players, refMgmtBoutSearch, refMgmtStageFilter, tournamentScope]);

      const refMgmtStages = useMemo(() => {
        return Array.from(new Set((schedule?.bouts || []).map((b) => String(b.stage || "").trim()).filter(Boolean)));
      }, [schedule]);

      const refereePerformanceProfile = useMemo(() => {
        const byId = new Map((refs || []).map((r) => [r.id, {
          id: r.id,
          refNo: r.refNo,
          name: r.name || `#${r.refNo || ""}`,
          level: r.level || "Local",
          matches: 0,
          totals: [],
          avg: "-",
          tier: "-"
        }]));
        (schedule?.assignments || []).forEach((a) => {
          const bout = (schedule?.bouts || []).find((b) => String(b.boutNo) === String(a.boutNo));
          if (!isRefereeAllocationBout(bout)) return;
          [a.mainRef, a.judge1, a.judge2].filter(Boolean).forEach((id) => {
            const row = byId.get(id);
            if (row) row.matches += 1;
          });
        });
        (schedule?.bouts || []).forEach((bout) => {
          (bout.refEvaluations || []).forEach((ev) => {
            const row = byId.get(ev.refId);
            const n = Number(ev.total ?? ev.totalScore);
            if (row && Number.isFinite(n)) row.totals.push(n);
          });
        });
        const rows = Array.from(byId.values()).map((row) => {
          if (row.totals.length) {
            const avg = Math.round((row.totals.reduce((a,b)=>a+b,0) / row.totals.length) * 10) / 10;
            row.avg = avg;
            row.tier = avg >= 90 ? "A" : avg >= 80 ? "B" : avg >= 70 ? "C" : "D";
          }
          return row;
        });
        return rows.sort((a, b) => (Number(b.avg) || 0) - (Number(a.avg) || 0) || b.matches - a.matches || String(a.name).localeCompare(String(b.name)));
      }, [refs, schedule]);

      function eligibleRefsForBout(bout, manualMode = false) {
        const baseList = (refs || []).filter((r) => {
          if (refAssignmentMode !== "gillam_pool") return true;
          if ((r.assignScope || "global") === "global") return true;
          return (r.poolGillam || "") === (bout?.gillam || "");
        });
        const scoped = baseList.length ? baseList : (refs || []);
        const filtered = scoped.filter((r) => manualMode ? refAllowedByManualFilters(r) : refAllowedForAutoBout(r, bout));
        return filtered.length ? filtered : (manualMode ? scoped : filtered);
      }

      function isHardByeRefSlot(value) {
        const t = String(value ?? '').trim().toUpperCase();
        return t === 'BYE' || t === 'BYE_EMPTY' || t === 'AUTO_ADVANCE' ;
      }
      function isPlayedRefBout(bout) {
        if (!bout) return false;
        return !!(bout.finished || bout.completed || bout.savedAt || bout.resultType || bout.winner || bout.noContest || bout.autoAdvanced || bout.status === 'finished' || bout.status === 'completed');
      }
      function isNonRealRefBout(bout) {
        if (!bout) return true;
        if (bout.internalOnly || bout.excludedFromFightOrder || bout.autoAdvanced === true) return true;
        return isHardByeRefSlot(bout.blueId) || isHardByeRefSlot(bout.greenId);
      }
      function isRefereeAllocationBout(bout) {
        // Real contest OR future unresolved contest.
        // Hard BYE / auto-advance / internal-only byes are never called to the mat,
        // never receive referees, and never count in referee workload.
        return !!bout && !isNonRealRefBout(bout);
      }
      function isBlockedRefSlot(value) {
        return String(value ?? '').trim().toUpperCase().startsWith('BLOCKED_FROM_BOUT_');
      }
      function isAwaitingRefBout(bout) {
        if (!bout || isNonRealRefBout(bout)) return false;
        return !String(bout.blueId || '').trim() || !String(bout.greenId || '').trim() || isBlockedRefSlot(bout.blueId) || isBlockedRefSlot(bout.greenId);
      }
      function isCurrentOrNextRefBout(bout) {
        if (!schedule?.bouts?.length || !bout) return '';
        const byGillam = (schedule.bouts || []).filter((b)=>String(b.gillam || '') === String(bout.gillam || '')).sort((a,b)=>(Number(a.fightOrder||a.orderNo||a.boutNo)||0)-(Number(b.fightOrder||b.orderNo||b.boutNo)||0));
        const firstOpen = byGillam.findIndex((b)=>!isPlayedRefBout(b));
        if (firstOpen >= 0 && String(byGillam[firstOpen]?.boutNo) === String(bout.boutNo)) return 'CURRENT BOUT';
        if (firstOpen >= 0 && String(byGillam[firstOpen+1]?.boutNo) === String(bout.boutNo)) return 'NEXT BOUT';
        return '';
      }
      function refBoutAuditReasons(bout, assignment) {
        const reasons = [];
        if (isNonRealRefBout(bout)) reasons.push('NON-REAL / BYE / AUTO-ADVANCE');
        else if (isAwaitingRefBout(bout)) reasons.push('WAITING FOR RESULT');
        if (isPlayedRefBout(bout)) reasons.push('PLAYED / COMPLETED');
        const cn = isCurrentOrNextRefBout(bout);
        if (cn) reasons.push(cn);
        if (assignment?.manual || (assignment?.manualRoles && Object.keys(assignment.manualRoles).length)) reasons.push('MANUAL ROLE LOCK');
        if (!reasons.length) reasons.push('Eligible for rebalance');
        return reasons;
      }
      function refAssignmentForBout(no) {
        return (schedule?.assignments || []).find((a)=>String(a.boutNo)===String(no)) || { boutNo:no };
      }
      function setManualRoleFlag(item, role, flag) {
        const roles = { ...(item.manualRoles || {}) };
        if (flag) roles[role] = true;
        else delete roles[role];
        item.manualRoles = roles;
        item.manual = Object.keys(roles).length > 0;
        item.assignmentMode = item.manual ? 'MIXED' : 'AUTO';
        return item;
      }
      function updateMainWebRefereeRole(boutNo, role, value) {
        if (!ensureWritable('Manual referee assignment')) return;
        const bout = (schedule?.bouts || []).find((b)=>String(b.boutNo)===String(boutNo));
        if (!isRefereeAllocationBout(bout)) {
          alert('This is a BYE / auto-advance / non-mat bout. It is not called to the mat and cannot receive referees.');
          return;
        }
        setSchedule((prev)=>{
          if (!prev) return prev;
          const current = (prev.assignments || []).find((a)=>String(a.boutNo)===String(boutNo)) || { boutNo, gillam: bout?.gillam || '' };
          const nextItem = { ...current, [role]: value || '' };
          setManualRoleFlag(nextItem, role, !!value);
          const selected = [nextItem.mainRef, nextItem.judge1, nextItem.judge2].filter(Boolean);
          if (selected.length && new Set(selected.map(String)).size !== selected.length) {
            alert('The same referee cannot be assigned twice in the same fight.');
            return prev;
          }
          const nextAssignments = (prev.assignments || []).filter((a)=>String(a.boutNo)!==String(boutNo));
          nextAssignments.push(nextItem);
          nextAssignments.sort((a,b)=>(Number(a.boutNo)||0)-(Number(b.boutNo)||0));
          return { ...prev, assignments: nextAssignments };
        });
        setRefMgmtStatusMsg(`Manual ${role} updated for bout #${boutNo}. Only this role is locked.`);
        markUnsynced();
      }
      function clearManualRolesForBout(boutNo) {
        setSchedule((prev)=>{

      function refOptionsForBout(value, bout) {

      function refParticipations(refId) {
        const out = [];
        (schedule?.assignments || []).forEach((a)=>{
          [['mainRef','Main Referee'],['judge1','Judge 1'],['judge2','Judge 2']].forEach(([role,label])=>{
            if (String(a?.[role] || '') === String(refId)) {
              const bout = (schedule?.bouts || []).find((b)=>String(b.boutNo)===String(a.boutNo));

      function openMainWebEvaluation(refId, boutNo, role) {

      function evaluationRating(total) {
        const n = Number(total) || 0;

      }

      function refereeAverageScore(refId) {
        const scores = [];

              const n = Number(ev.total ?? ev.totalScore);
              if (Number.isFinite(n)) scores.push(n);
            }
          });
        });
        if (!scores.length) return "";
        return Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 10) / 10;

      useEffect(() => {
        if (!timerRunning) return;
        const id = setInterval(() => {
          setTimerMs((ms) => {
            if (ms <= 1000) {
              if (ms > 0) {
                playBell();
              }
              setTimerRunning(false);
              return 0;
            }

            const newMs = ms - 1000;

            const initial = initialFightMsRef.current || 0;
            const halfMs = initial / 2;
            if (
              !halfPingDoneRef.current &&
              initial > 0 &&
              ms > halfMs &&
              newMs <= halfMs
            ) {
              const scores = sbComputedRef.current;
              if (scores) {
                const sides = ["blue", "green"];
                const allZero = sides.every((side) => {
                  const s = scores[side];
                  return (
                    s &&
                    s.H === 0 &&
                    s.YO === 0 &&
                    s.CH === 0 &&
                    s.penaltyLevel === 0
                  );
                });
                if (allZero) {
                  playHalfPing();
                  halfPingDoneRef.current = true;
                  setTimerRunning(false);
                }
              }
            }

            return newMs;
          });
        }, 1000);
        return () => clearInterval(id);
      }, [timerRunning]);

      useEffect(() => {
        function isEditableTarget(target) {
          const tag = String(target?.tagName || "").toLowerCase();
          return tag === "input" || tag === "textarea" || tag === "select" || target?.isContentEditable;
        }

        function onKeyDown(e) {
          if (tab !== "scoreboard" || !activeBoutNo) return;
          if (e.code !== "Space" && e.key !== " ") return;
          if (isEditableTarget(e.target) || isEditableTarget(document.activeElement)) return;
          if (!ensureWritable("Starting/stopping timer")) return;
          e.preventDefault();
          e.stopPropagation();
          setTimerRunning((running) => !running);
        }

        document.addEventListener("keydown", onKeyDown, true);
        window.addEventListener("keydown", onKeyDown, true);
        return () => {
          document.removeEventListener("keydown", onKeyDown, true);

        };
      }, [tab, activeBoutNo, isTournamentReadOnly]);

        function handleFsChange() {
          setIsFullscreen(!!document.fullscreenElement);

      function setAffiliationModeAndRecalc(nextMode) {
        if (!ensureWritable("Changing affiliation mode")) return;
        const mode = normalizedAffiliationMode(tournamentScope, nextMode);
        setAffiliationMode(mode);
        setPlayers((prev) =>
          (prev || []).map((p) => {
            const aff = mode === "none" ? defaultAffiliation(tournamentScope, mode) : resolveAffiliation(p.countryFull || p.country, tournamentScope, mode);
            const slot = isManualGroupsMode(weightMode) ? p.manualGroup : p.weight;
            const slotLabel = String(slot || "").replace("+", "P").replace("-", "N").replace(/\s+/g, "");
            const id = `${aff.code || "UNK"}-${(p.name || "").replace(/\s+/g, "").toUpperCase()}-${slotLabel}`;
            return { ...p, countryFull: aff.full, country: aff.code, id };
          })
        );
        setRefs((prev) =>
          (prev || []).map((r) => {
            const aff = mode === "none" ? defaultAffiliation(tournamentScope, mode) : resolveAffiliation(r.countryFull || r.country, tournamentScope, mode);
            return { ...r, countryFull: aff.full, country: aff.code };
          })
        );
        setSchedule(null);
        setBoutMeta({});
        setDrawValidation({ errors: [], warnings: [] });
      }

      function setWeightModeAndRecalc(nextMode) {
        if (!ensureWritable("Changing weight mode")) return;
        const mode = nextMode || "auto_weights";
        setWeightMode(mode);
        setManualGroupsByAge((prev) => ({ ...defaultManualGroupsForScope(tournamentScope), ...(prev || {}) }));
        setPlayers((prev) =>
          (prev || []).map((p) => {
            const ageGroupNumb = p.age !== "" && p.age != null ? ageGroupFromAge(p.age, tournamentScope) : (p.ageGroupNumb || defaultAgeGroupNumbForScope(tournamentScope));
            const sex = p.sex === "F" ? "F" : "M";
            const weight = bucketWeight(sex, p.actualKg, ageGroupNumb, tournamentScope);
            const manualGroup = normalizeManualGroup(p.manualGroup, manualGroupsByAge, ageGroupNumb, tournamentScope);
            const slot = isManualGroupsMode(mode) ? manualGroup : weight;
            const slotLabel = String(slot || "").replace("+", "P").replace("-", "N").replace(/\s+/g, "");
            const id = `${p.country || "UNK"}-${(p.name || "").replace(/\s+/g, "").toUpperCase()}-${slotLabel}`;
            return { ...p, ageGroupNumb, weight, manualGroup, id };
          })
        );
        setSchedule(null);
        setBoutMeta({});
        setDrawValidation({ errors: [], warnings: [] });
        markUnsynced();
      }

      function updateManualGroupsForAge(ageGroupNumb, text) {
        const names = String(text || "")
          .split(/[\n,]+/)
          .map((x, i) => cleanManualGroupName(x, `Group ${i + 1}`))
          .filter(Boolean);
        const finalNames = names.length ? names : ["Group A"];
        setManualGroupsByAge((prev) => ({ ...prev, [ageGroupNumb]: finalNames }));
        setPlayers((prev) =>
          (prev || []).map((p) => {
            if (Number(p.ageGroupNumb) !== Number(ageGroupNumb)) return p;
            const manualGroup = finalNames.includes(p.manualGroup) ? p.manualGroup : finalNames[0];
            const slot = isManualGroupsMode(weightMode) ? manualGroup : p.weight;
            const slotLabel = String(slot || "").replace("+", "P").replace("-", "N").replace(/\s+/g, "");
            const id = `${p.country || "UNK"}-${(p.name || "").replace(/\s+/g, "").toUpperCase()}-${slotLabel}`;
            return { ...p, manualGroup, id };

        );
        setSchedule(null);

      function recalcPlayer(idx, patch) {
        if (!ensureWritable("Editing players")) return;
        setPlayers((prev) => {
          const next = prev.slice();
          const p = { ...next[idx], ...patch };
          if (Object.prototype.hasOwnProperty.call(patch, "countryFull")) {
            const { code, full } = resolveAffiliation(patch.countryFull, tournamentScope, affiliationMode);
            p.countryFull = full;
            p.country = code;
          }
          if (Object.prototype.hasOwnProperty.call(patch, "dob")) {
            p.age = calcAge(patch.dob);
            if (p.age !== "") p.ageGroupNumb = ageGroupFromAge(p.age, tournamentScope);
          }
          if (Object.prototype.hasOwnProperty.call(patch, "age")) {
            if (p.age !== "") p.ageGroupNumb = ageGroupFromAge(p.age, tournamentScope);
          }
          if (
            Object.prototype.hasOwnProperty.call(patch, "sex") ||
            Object.prototype.hasOwnProperty.call(patch, "actualKg") ||
            Object.prototype.hasOwnProperty.call(patch, "name") ||
            Object.prototype.hasOwnProperty.call(patch, "country") ||
            Object.prototype.hasOwnProperty.call(patch, "ageGroupNumb") ||
            Object.prototype.hasOwnProperty.call(patch, "dob")
          ) {
            p.weight = bucketWeight(p.sex, p.actualKg, p.ageGroupNumb, tournamentScope);
            p.manualGroup = normalizeManualGroup(p.manualGroup, manualGroupsByAge, p.ageGroupNumb, tournamentScope);
          }
          if (Object.prototype.hasOwnProperty.call(patch, "manualGroup")) {
            p.manualGroup = normalizeManualGroup(patch.manualGroup, manualGroupsByAge, p.ageGroupNumb, tournamentScope);
          }
          const slot = isManualGroupsMode(weightMode) ? p.manualGroup : p.weight;
          const weightLabel = String(slot || "").replace("+", "P").replace("-", "N").replace(/\s+/g, "");
          p.id = `${p.country}-${(p.name || "").replace(/\s+/g, "").toUpperCase()}-${weightLabel}`;
          next[idx] = p;
          return next;
        });
        markUnsynced();
      }

      function handleImportPlayersTXT(text) {
        if (!ensureWritable("Importing players")) return;
        const lines = text
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter((l) => l && !l.startsWith("#"));
        const acc = [];
        for (const line of lines) {
          const parts = line.split("|").map((p) => p.trim());
          if (parts.length >= 4 && /^[MF]$/i.test(parts[2])) {
            const [name, countryIn, sexIn, actualRaw, seedRaw, dobRaw] = parts;
            const { code, full } = resolveAffiliation(countryIn, tournamentScope, affiliationMode);
            const sex = sexIn.toUpperCase();
            const actualKg = Number(actualRaw);
            const ageGroupNumb = defaultAgeGroupNumbForScope(tournamentScope);
            const weight = bucketWeight(sex, actualKg, ageGroupNumb, tournamentScope);
            const seed = seedRaw ? Number(seedRaw) : undefined;
            const dob = dobRaw || "";
            const age = calcAge(dob);
            const id = `${code}-${name.replace(/\s+/g, "").toUpperCase()}-${weight.replace("+", "P").replace("-", "N")}`;
            const detectedAgeGroupNumb = age !== "" ? ageGroupFromAge(age, tournamentScope) : ageGroupNumb;
            const finalWeight = bucketWeight(sex, actualKg, detectedAgeGroupNumb, tournamentScope);
