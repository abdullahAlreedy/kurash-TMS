              const downloadCSVFile = (filename, header, rows) => {
                if (!header || !rows) return;
                const lines = [
                  header.join(","),
                  ...rows.map((r) => header.map((h) => String(r[h] ?? "")).join(","))
                ];
                const blob = new Blob([lines.join("\n")], {
                  type: "text/csv;charset=utf-8;"
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {

function reportRowMatches(row, extraText = "") {
  const q = String(reportSearch || "").trim().toLowerCase();
  if (!q) return true;
  const safe = (v) => {
    if (v == null) return "";
    if (typeof v === "object") {
      try { return JSON.stringify(v); } catch (e) { return String(v); }
    }
    return String(v);
  };
  const haystack = [safe(row), safe(extraText)].join(" ").toLowerCase();
  return haystack.includes(q);
}

                          <li><strong>Referees Tab:</strong> the only source for adding, editing, deleting, searching, and importing basic referee data.</li>
                          <li><strong>Referee Management:</strong> operational use only: assignments, conflict review, final pool, evaluation, and finals selection.</li>
                          <li>Do not create duplicate referee records in the management screen.</li>
                        </ul>
                        <div className="mt-3">
                          <div className="font-semibold text-slate-100">Referees TXT format</div>
                          <code className="block mt-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs overflow-auto">refNo | name | affiliation | rank | [assignScope] | [poolGillam]</code>
                          <p className="mt-1 text-slate-400">Example: <span className="font-mono">07 | Ref A | Al-Hilal Club | 3 | pool | Gillam A</span></p>
                        </div>
                      </div>

                      <div className="rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <h3 className="text-sky-300 font-bold mb-2">7) Referee Evaluation & Finals</h3>
                        <ul className="list-disc pl-5 space-y-1">
                          <li>Evaluate referees by match from <strong>Referee Management</strong>.</li>
                          <li>Evaluation domains: rules, positioning, timing, communication, match control, penalties, professionalism.</li>
                          <li>Total score is /100 and rating is calculated automatically.</li>
                          <li>Stored evaluations support overall referee profile and help choose referees for finals.</li>
                          <li>Final referee pool can be selected manually or assisted by evaluation ranking.</li>
                        </ul>
                      </div>
                    </div>

                    <div className="rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                      <h3 className="text-sky-300 font-bold mb-2">8) Scoreboard Controls</h3>
                      <div className="grid md:grid-cols-2 gap-4">
                        <ul className="list-disc pl-5 space-y-1">
                          <li><strong>H / YO / CH:</strong> scores.</li>
                          <li><strong>T / D / G:</strong> penalties.</li>
                          <li><strong>Left click:</strong> add score/penalty.</li>
                          <li><strong>Right click:</strong> remove the last same score/penalty.</li>
                          <li><strong>Save Result:</strong> stores the match result locally and on server if connected.</li>
                        </ul>
                        <ul className="list-disc pl-5 space-y-1">
                          <li><strong>Spacebar:</strong> start/stop timer unless typing in an input.</li>
                          <li><strong>Single click on timer:</strong> start/stop timer.</li>
                          <li><strong>Double click on timer:</strong> manually edit match time.</li>
                          <li><strong>Gillam / age group / weight:</strong> enlarged for visibility.</li>
                          <li><strong>Fullscreen:</strong> recommended during live matches.</li>
                        </ul>
                      </div>
                    </div>

                    <div className="grid lg:grid-cols-2 gap-4">
                      <div className="rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <h3 className="text-sky-300 font-bold mb-2">9) Withdrawal Rules</h3>
                        <ul className="list-disc pl-5 space-y-1">
                          <li><strong>Single withdrawal / no show:</strong> the opponent wins automatically.</li>
                          <li><strong>Knockout:</strong> the valid opponent advances to the next round.</li>
                          <li><strong>League:</strong> withdrawal win counts lower than technical/scoring wins for tie-break purposes.</li>
                          <li><strong>Double withdrawal:</strong> No Contest, no winner, no points, no one advances from that match.</li>
                          <li><strong>BYE / auto-advance:</strong> bracket-only advancement, not a competition, no referees, no workload, no evaluation.</li>
                          <li><strong>Waiting for result:</strong> scheduled competition with bout number/fight order/referee assignment/workload, but not playable until the player names are resolved.</li>
                          <li><strong>Medal/final withdrawal:</strong> position is blocked/locked; no automatic replacement is inserted.</li>
                        </ul>
                      </div>

                      <div className="rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <h3 className="text-sky-300 font-bold mb-2">10) League Standings</h3>
                        <ul className="list-disc pl-5 space-y-1">
                          <li>Primary ranking: wins/losses.</li>
                          <li>Tie-breaker uses saved performance points only when wins/losses are tied.</li>
                          <li>Throwing/scoring wins rank higher than penalty-based wins.</li>
                          <li>Withdrawal wins rank lower than technical/scoring wins.</li>
                          <li>Export standings CSV from Home/Reports when needed.</li>
                        </ul>
                      </div>
                    </div>

                    <div className="grid lg:grid-cols-2 gap-4">
                      <div className="rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
                        <h3 className="text-sky-300 font-bold mb-2">11) System Readiness Check</h3>
                        <ul className="list-disc pl-5 space-y-1">
                          <li>Check players count, referees count, schedule availability, unsynced changes, and server status.</li>
                          <li>Before live use, confirm all screens are using the same server URL if online.</li>
                          <li>Always create a backup before starting the first match.</li>
                        </ul>
                      </div>

                      <div className="rounded-2xl border border-rose-900/60 bg-rose-950/20 p-4">
                        <h3 className="text-rose-300 font-bold mb-2">12) Troubleshooting</h3>
                        <ul className="list-disc pl-5 space-y-1">
                          <li><strong>Black screen:</strong> use the latest package; Error Boundary should show the error instead of a blank screen.</li>
                          <li><strong>Server not connected:</strong> continue offline, export JSON backup, then sync later.</li>
                          <li><strong>Scoreboard not updating:</strong> verify the same server URL, use Sync Now, then reload scoreboard.</li>
                          <li><strong>Wrong data after reload:</strong> Restore JSON Backup from the latest saved tournament backup.</li>
                          <li><strong>Referee conflict:</strong> review Referee Management warnings before saving assignments.</li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          <footer className="max-w-[98vw] mx-auto px-4 pb-10 text-xs text-slate-400">
            Single-page web app – open index.html directly in your browser.
          </footer>
        </div>
      );
    }

    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) {
        return { error };
      }
      componentDidCatch(error, info) {
        console.error("Kurash UI crash", error, info);
      }
      render() {
        if (this.state.error) {
          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 p-6">
              <div className="max-w-3xl mx-auto rounded-3xl border border-rose-800 bg-rose-950/20 p-5">
                <h1 className="text-2xl font-bold text-rose-300 mb-3">Kurash UI Error</h1>
                <p className="text-slate-300 mb-3">The page did not go black. A JavaScript error was caught so you can report it safely.</p>
                <pre className="whitespace-pre-wrap text-xs bg-black/40 rounded-xl p-3 overflow-auto">{String(this.state.error?.message || this.state.error)}</pre>
                <button className="mt-4 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700" onClick={() => location.reload()}>Reload</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    window.addEventListener("error", (event) => {
      console.error("Global Kurash error", event.error || event.message);
    });

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
  
    </script>
  <!-- APP SCRIPT END -->
</body>
</html>
