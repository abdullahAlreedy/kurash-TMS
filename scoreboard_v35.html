  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --------------------------------------------------
    // Constants
    // --------------------------------------------------
    const MEN_FIGHT_SECONDS = 4 * 60;   // legacy fallback
    const WOMEN_FIGHT_SECONDS = 3 * 60; // legacy fallback
    const SB_STORAGE_KEY = "kurash_scoreboard_v35_final_stable_state";
    const LEGACY_SB_STORAGE_KEYS = ["kurash_scoreboard_v5_state"];

    function ageGroupDurationSeconds(ageGroupNumb) {
      const n = Number(ageGroupNumb) || 1;
      if (n === 1 || n === 101) return 5 * 60;
      if (n === 2 || n === 3 || n === 102 || n === 103) return 4 * 60;
      if (n === 4 || n === 5) return 3 * 60;
      if (n === 6) return 2 * 60;
      return 4 * 60;
    }

    function durationSecondsForBout(bout, blue, green, manualSeconds) {
      const sex = bout?.sex || blue?.sex || green?.sex || "M";
      // Timer source of truth:
      // 1) explicit bout duration saved in the schedule,
      // 2) tournament settings received from Main Web,
      // 3) age/category fallback,
      // 4) legacy sex fallback.
      if (bout?.durationSec) return Number(bout.durationSec);
      if (manualSeconds && typeof manualSeconds === "object") {
        const override = sex === "F" ? Number(manualSeconds.women || 0) : Number(manualSeconds.men || 0);
        if (override > 0) return override;
      } else if (Number(manualSeconds) > 0) {
        return Number(manualSeconds);
      }
      if (bout?.ageGroupNumb != null) return ageGroupDurationSeconds(bout.ageGroupNumb);
      return sex === "F" ? WOMEN_FIGHT_SECONDS : MEN_FIGHT_SECONDS;
    }

    // --------------------------------------------------
    // Helpers
    // --------------------------------------------------
    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function adjustTimer(setter, deltaSeconds) {
      setter((prev) => Math.max(0, prev + deltaSeconds * 1000));
    }

    function parseManualTimeInput(rawValue, fallbackMs) {
      const raw = String(rawValue || "").trim();
      if (!raw) return null;

      if (raw.includes(":")) {
        const parts = raw.split(":").map((x) => Number(x));
        if (parts.length === 2 && parts.every((x) => Number.isFinite(x) && x >= 0)) {
          const [minutes, seconds] = parts;
          return Math.max(0, (minutes * 60 + seconds) * 1000);
        }
      }

      const n = Number(raw);
      if (Number.isFinite(n) && n >= 0) {
        const seconds = n <= 20 ? n * 60 : n;
        return Math.max(0, seconds * 1000);
      }

      return fallbackMs ?? null;
    }

    // --------------------------------------------------
    // Affiliation helpers
    // In external tournaments, this usually means country.
    // In local/school tournaments, this may mean club or no affiliation.
    // The main app stores the selected affiliation in countryFull/country for backward compatibility.
    // --------------------------------------------------
    const NO_AFFILIATION_CODES = new Set(["", "NA", "NONE", "NO", "N/A"]);
    const NON_FLAG_CODES = new Set(["CLB", "CLUB", "NA", "NONE", "N/A"]);

    function affiliationFullName(player) {
      const full = String(player?.countryFull || player?.affiliationFull || player?.club || "").trim();
      const code = String(player?.country || player?.affiliationCode || "").trim().toUpperCase();
      if (!full && NO_AFFILIATION_CODES.has(code)) return "No Affiliation";
      if (!full) return code || "No Affiliation";
      return full;
    }

    function affiliationCode(player) {
      const code = String(player?.country || player?.affiliationCode || "").trim().toUpperCase();
      if (code) return code;
      const full = affiliationFullName(player);
      const letters = full.replace(/[^A-Za-z]/g, "").toUpperCase();
      return letters ? letters.slice(0, 3) : "NA";
    }

    function isNoAffiliation(player) {
      const full = affiliationFullName(player).toLowerCase();
      const code = affiliationCode(player);
      return full === "no affiliation" || NO_AFFILIATION_CODES.has(code);
    }

    function shouldShowFlag(player) {
      const code = affiliationCode(player);
      if (isNoAffiliation(player)) return false;
      if (NON_FLAG_CODES.has(code)) return false;
      return true;
    }

    function boutSlotLabel(bout) {
      const slot = String(bout?.weight || "").trim();
      if (!slot) return "";
      if (String(bout?.groupKey || "").includes("|")) {
        const parts = String(bout.groupKey).split("|");
        if (parts.length >= 3) {
          const last = parts[2];
          if (last && last === slot && !/^[-+]?\d/.test(last)) return "Group " + last;
        }
      }
      return slot;
    }

    // --------------------------------------------------
    // CountryFlag component (expects flags/{code}_m.jpg or .png)
    // --------------------------------------------------
    function CountryFlag({ code }) {
      const upper = (code || "").toUpperCase();
      const baseClass =
        "w-10 h-6 md:w-14 md:h-8 rounded border border-slate-300 shadow-inner object-cover";

      if (!upper) {
        return <div className={baseClass + " bg-slate-700"} aria-label="flag" />;
      }

      const lower = upper.toLowerCase();
      const jpgPath = `flags/${lower}_m.jpg`;
      const pngPath = `flags/${lower}_m.png`;

      const handleError = (e) => {
        if (e.target.src.includes(".jpg")) {
          e.target.src = pngPath;
        } else {
          e.target.style.display = "none";
        }
      };

      return (
        <img
          src={jpgPath}
          alt={`${upper} flag`}
          className={baseClass}
          onError={handleError}
        />
      );
    }


    function AffiliationBadge({ player, align = "center" }) {
      const code = affiliationCode(player);
      const full = affiliationFullName(player);
      const noAff = isNoAffiliation(player);
      const alignClass = align === "right" ? "items-end text-right" : align === "left" ? "items-start text-left" : "items-center text-center";
      return (
        <div className={"flex flex-col justify-center gap-1 min-w-[4.5rem] md:min-w-[5.25rem] " + alignClass}>
          {shouldShowFlag(player) ? (
            <CountryFlag code={code} />
          ) : (
            <div className="w-10 h-6 md:w-14 md:h-8 rounded border border-slate-600 bg-slate-800 flex items-center justify-center text-[10px] md:text-xs font-bold text-slate-300">
              {noAff ? "NA" : code}
            </div>
          )}
          <span className="text-xl md:text-3xl font-mono tracking-wide">{noAff ? "NA" : code}</span>
          <span className="text-base md:text-2xl text-slate-300 max-w-[7rem] truncate" title={full}>{full}</span>
        </div>
      );
    }

    // --------------------------------------------------
    // Scoring logic (Kurash style)
    // --------------------------------------------------
    function computeScores(events) {
      const base = {
        blue: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
        green: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
        halalWinner: null,
        lastScoreSide: null,
        lastPenaltySide: null
      };

      function sideKey(s) {
        return s === "blue" ? "blue" : "green";
      }

      if (!Array.isArray(events)) {
        return {
          blue: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
          green: { H: 0, YO: 0, CH: 0, penaltyLevel: 0 },
          halalWinner: null,
          lastScoreSide: null,
          lastPenaltySide: null
        };
      }

      for (const ev of events) {
        const s = sideKey(ev.side);
        const o = s === "blue" ? "green" : "blue";

        if (ev.type === "H" || ev.type === "YO" || ev.type === "CH") {
          if (ev.type === "H") {
            base[s].H += 1;
            if (!base.halalWinner) base.halalWinner = s;
          } else if (ev.type === "YO") {
            base[s].YO += 1;
          } else if (ev.type === "CH") {
            base[s].CH += 1;
          }

          while (base[s].YO >= 2) {
            base[s].YO -= 2;
            base[s].H += 1;
            if (!base.halalWinner) base.halalWinner = s;
          }

          base.lastScoreSide = s;
          continue;
        }

        // Penalties: T / D / G
        // T gives CH equivalent to opponent, D gives YO equivalent, G gives H/direct win.
        if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
          const lvl = ev.type === "T" ? 1 : ev.type === "D" ? 2 : 3;

          if (lvl > base[s].penaltyLevel) {
            base[s].penaltyLevel = lvl;
            base.lastPenaltySide = s;
            base.lastScoreSide = o;

            if (lvl === 3 && !base.halalWinner) {
              base.halalWinner = o;
            }
          }
        }
      }

      const disp = {
        blue: {
          H: base.blue.H,
          YO: base.blue.YO,
          CH: base.blue.CH,
          penaltyLevel: base.blue.penaltyLevel
        },
        green: {
          H: base.green.H,
          YO: base.green.YO,
          CH: base.green.CH,
          penaltyLevel: base.green.penaltyLevel
        },
        halalWinner: base.halalWinner,
        lastScoreSide: base.lastScoreSide,
        lastPenaltySide: base.lastPenaltySide
      };

      if (base.green.penaltyLevel === 1) disp.blue.CH += 1;
      else if (base.green.penaltyLevel === 2) disp.blue.YO += 1;
      else if (base.green.penaltyLevel === 3) disp.blue.H += 1;

      if (base.blue.penaltyLevel === 1) disp.green.CH += 1;
      else if (base.blue.penaltyLevel === 2) disp.green.YO += 1;
      else if (base.blue.penaltyLevel === 3) disp.green.H += 1;

      ["blue", "green"].forEach((side) => {
        const score = disp[side];
        while (score.YO >= 2) {
          score.YO -= 2;
          score.H += 1;
          if (!disp.halalWinner) disp.halalWinner = side;
        }
      });

      return disp;
    }

    function decideWinner(state, isTimeUp) {
      if (!state) return null;

      if (state.halalWinner) return state.halalWinner;

      const b = state.blue;
      const g = state.green;

      if (b.H !== g.H) return b.H > g.H ? "blue" : "green";
      if (b.YO !== g.YO) return b.YO > g.YO ? "blue" : "green";
      if (b.CH !== g.CH) return b.CH > g.CH ? "blue" : "green";

      if (!isTimeUp) return null;

      if (b.penaltyLevel !== g.penaltyLevel) {
        return b.penaltyLevel > g.penaltyLevel ? "green" : "blue";
      }

      if (state.lastPenaltySide) {
        return state.lastPenaltySide === "blue" ? "green" : "blue";
      }

      if (state.lastScoreSide) {
        return state.lastScoreSide;
      }

      return null;
    }

    // --------------------------------------------------
    // Audio helpers
    // --------------------------------------------------
    function ensureAudioContext(audioCtxRef) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtxRef.current) {
        audioCtxRef.current = new AC();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === "suspended") {
        ctx.resume();
      }
      return ctx;
    }

    function playBell(audioCtxRef) {
      try {
        const ctx = ensureAudioContext(audioCtxRef);
        if (!ctx) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(1000, ctx.currentTime);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + 0.1);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 3);
      } catch (e) {}
    }

    function playHalfPing(audioCtxRef) {
      try {
        const ctx = ensureAudioContext(audioCtxRef);
        if (!ctx) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(600, ctx.currentTime);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 3);
      } catch (e) {}
    }

    // --------------------------------------------------
    // Scoreboard App
    // --------------------------------------------------
    function App() {
      const [schedule, setSchedule] = useState(demoSchedule);
      const [players, setPlayers] = useState(demoPlayers);
      const [refs, setRefs] = useState([]);

      // Server sync (v35.6.5)
      const [serverUrl, setServerUrl] = useState("");
      const [serverStatus, setServerStatus] = useState("idle");
      const [serverMsg, setServerMsg] = useState("");
      const [gillams, setGillams] = useState([]);
      const [selectedGillam, setSelectedGillam] = useState("");
      const [manualDurationSeconds, setManualDurationSeconds] = useState(0); // legacy all-bouts override
      const [manualDurationMenSeconds, setManualDurationMenSeconds] = useState(0);
      const [manualDurationWomenSeconds, setManualDurationWomenSeconds] = useState(0);
      const [tournamentMeta, setTournamentMeta] = useState({ tournamentScope: "external", affiliationMode: "country", weightMode: "auto_weights" });
      const [autoSaveMsg, setAutoSaveMsg] = useState("");
      const [scoreboardDirty, setScoreboardDirty] = useState(false);
      const [pendingScoreBoutNo, setPendingScoreBoutNo] = useState(null);
      const [scoreSaveNotice, setScoreSaveNotice] = useState("");
       function normalizedBaseUrl() {
        const raw = (serverUrl || "").trim();
        if (!raw) return null;
        return raw.replace(/\/+$/, "");
      }

      const durationOverrides = useMemo(() => ({
        men: manualDurationMenSeconds || Number(tournamentMeta?.manualDurationMenSeconds || 0) || manualDurationSeconds || 0,
        women: manualDurationWomenSeconds || Number(tournamentMeta?.manualDurationWomenSeconds || 0) || manualDurationSeconds || 0
      }), [manualDurationMenSeconds, manualDurationWomenSeconds, manualDurationSeconds, tournamentMeta]);

      useEffect(() => {
        try {
          let raw = localStorage.getItem(SB_STORAGE_KEY);
          if (!raw) {
            for (const legacyKey of LEGACY_SB_STORAGE_KEYS) {
              raw = localStorage.getItem(legacyKey);
              if (raw) break;
            }
          }
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (saved?.schedule) setSchedule(saved.schedule);
          if (Array.isArray(saved?.players)) setPlayers(saved.players);
          if (Array.isArray(saved?.refs)) setRefs(saved.refs);
          if (saved?.boutMeta) setBoutMeta(saved.boutMeta);
          if (saved?.activeBoutNo != null) setActiveBoutNo(saved.activeBoutNo);
          if (saved?.manualDurationSeconds != null) setManualDurationSeconds(Number(saved.manualDurationSeconds) || 0);
          if (saved?.manualDurationMenSeconds != null) setManualDurationMenSeconds(Number(saved.manualDurationMenSeconds) || 0);
          if (saved?.manualDurationWomenSeconds != null) setManualDurationWomenSeconds(Number(saved.manualDurationWomenSeconds) || 0);
          if (saved?.tournamentMeta) setTournamentMeta(saved.tournamentMeta);
          setAutoSaveMsg("Offline state restored.");
        } catch (err) {
          console.warn("Could not restore scoreboard state", err);
        }
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(SB_STORAGE_KEY, JSON.stringify({
            schedule, players, refs, boutMeta, activeBoutNo, manualDurationSeconds, manualDurationMenSeconds, manualDurationWomenSeconds, tournamentMeta
          }));
          if (schedule?.bouts?.length) setAutoSaveMsg("Offline autosaved.");
        } catch (err) {
          console.warn("Could not autosave scoreboard state", err);
        }
      }, [schedule, players, refs, boutMeta, activeBoutNo, manualDurationSeconds, manualDurationMenSeconds, manualDurationWomenSeconds, tournamentMeta]);

      async function testConnection() {
        const base = normalizedBaseUrl();
        if (!base) {
          alert("Enter server URL first.");
          return;
        }
        try {
          setServerStatus("loading");
          setServerMsg("Testing connection...");
          const res = await fetch(base + "/api/ping");
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Ping failed: HTTP " + res.status);
            return;
          }
          await res.json().catch(() => ({}));
          setServerStatus("ok");
          setServerMsg("Server is online.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Cannot reach server.");
        }
      }

      async function loadCurrentTournamentFromServer() {
        const base = normalizedBaseUrl();
        if (!base) {
          alert("Enter server URL first.");
          return;
        }
        try {
          setServerStatus("loading");
          setServerMsg("Loading current tournament...");
          const res = await fetch(base + "/api/tournament/current");
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Current tournament failed: HTTP " + res.status);
            return;
          }
          const data = await res.json();
          if (!data) {
            setServerStatus("idle");
            setServerMsg("No current tournament found.");
            return;
          }
          if (data.schedule) setSchedule(data.schedule);
          if (Array.isArray(data.players)) setPlayers(data.players);
          if (Array.isArray(data.refs)) setRefs(data.refs);
          if (data.meta) setTournamentMeta(data.meta);
          const allBouts = data.schedule?.bouts || [];
          const gList = Array.from(new Set(allBouts.map((b) => b.gillam).filter(Boolean)));
          setGillams(gList);
          if (gList.length && !selectedGillam) setSelectedGillam(gList[0]);
          if (allBouts.length) {
            setActiveBoutNo(allBouts[0].boutNo);
            setSbEvents([]);
            setTimerRunning(false);
            setShowMeta(false);
            setTimeout(() => loadBoutDetails(allBouts[0].boutNo), 0);
          }
          setServerStatus("ok");
          setServerMsg("Current tournament loaded.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Error loading current tournament.");
        }
      }

      async function loadGillamsFromServer() {
        const base = normalizedBaseUrl();
        if (!base) {
          alert("Enter server URL first.");
          return;
        }
        try {
          setServerStatus("loading");
          setServerMsg("Loading Gillams...");
          const res = await fetch(base + "/api/gillams");
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Gillams failed: HTTP " + res.status);
            return;
          }
          const list = await res.json();
          if (!Array.isArray(list) || !list.length) {
            setGillams([]);
            setSelectedGillam("");
            setServerStatus("idle");
            setServerMsg("No Gillams returned.");
            return;
          }
          setGillams(list);
          setSelectedGillam("");
          setServerStatus("ok");
          setServerMsg("Gillams loaded.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Error loading Gillams.");
        }
      }

      async function loadBoutsForGillam() {
        const base = normalizedBaseUrl();
        if (!base) {
          alert("Enter server URL first.");
          return;
        }
        if (!selectedGillam) {
          alert("Select a Gillam first.");
          return;
        }
        try {
          setServerStatus("loading");
          setServerMsg("Loading bouts...");
          const res = await fetch(
            base + "/api/gillam/" + encodeURIComponent(selectedGillam) + "/bouts"
          );
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Bouts failed: HTTP " + res.status);
            return;
          }
          const bouts = await res.json();
          const safeBouts = Array.isArray(bouts) ? bouts : [];
          setSchedule((prev) => ({
            ...prev,
            bouts: safeBouts,
            assignments: prev?.assignments || [],
            bracketLinks: prev?.bracketLinks || {}
          }));

          if (!safeBouts.length) {
            setActiveBoutNo(null);
            setBoutMeta({});
            setSbEvents([]);
            setTimerRunning(false);
            setServerStatus("idle");
            setServerMsg("No bouts for this Gillam.");
            return;
          }

          const firstBoutNo = safeBouts[0].boutNo;
          setActiveBoutNo(firstBoutNo);
          setBoutMeta({});
          setSbEvents([]);
          setTimerRunning(false);
          loadBoutDetails(firstBoutNo);
          setServerStatus("ok");
          setServerMsg("Bouts loaded.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Error loading bouts.");
        }
      }

      async function loadBoutDetails(boutNo) {
        const base = normalizedBaseUrl();
        if (!base || boutNo == null) return;
        try {
          setServerStatus("loading");
          setServerMsg("Loading bout #" + boutNo + "...");
          const res = await fetch(base + "/api/bout/" + boutNo);
          if (!res.ok) {
            setServerStatus("error");
            setServerMsg("Bout detail failed: HTTP " + res.status);
            return;
          }
          const data = await res.json();
          if (data.tournamentMeta || data.meta) {
            setTournamentMeta(data.tournamentMeta || data.meta);
          }
          if (data.bout) {
            applySavedBoutToLocalState(data.bout);
          }
          if (data.blue || data.green) {
            setPlayers((prevPlayers) => {
              const map = new Map(prevPlayers.map((p) => [p.id, p]));
              if (data.blue && data.blue.id) map.set(data.blue.id, data.blue);
              if (data.green && data.green.id) map.set(data.green.id, data.green);
              return Array.from(map.values());
            });
          }
          setServerStatus("ok");
          setServerMsg("Bout #" + boutNo + " loaded.");
        } catch (err) {
          console.error(err);
          setServerStatus("error");
          setServerMsg("Error loading bout details.");
        }
      }

      async function sendResultToServer(boutNo, payload) {
        const base = normalizedBaseUrl();
        if (!base) {
          return { ok: true, offline: true };
        }
        try {
          const url = base + "/api/bout/" + encodeURIComponent(boutNo) + "/save";
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data?.ok === false) {
            const msg = data?.error || ("HTTP " + res.status);
            throw new Error(msg);
          }
          if (data?.bout) applySavedBoutToLocalState(data.bout);
          if (data?.tournament?.schedule) {
            setSchedule(data.tournament.schedule);
          }
          if (Array.isArray(data?.tournament?.players)) setPlayers(data.tournament.players);
          if (Array.isArray(data?.tournament?.refs)) setRefs(data.tournament.refs);
          if (data?.tournament?.meta || data?.tournament?.tournamentMeta) {

      }

      const [activeBoutNo, setActiveBoutNo] = useState(

      const [boutMeta, setBoutMeta] = useState({});
      const [sbEvents, setSbEvents] = useState([]);
      const [timerMs, setTimerMs] = useState(0);

      useEffect(() => {

      }, [sbComputed]);

useEffect(() => {
  // Stop the timer only on an immediate win state
  // (for example Halal / direct win), not on normal scoring.

    setTimerRunning(false);
  }
}, [sbComputed, timerRunning]);

      // Timer effect
      useEffect(() => {
        if (!timerRunning) return;
        const id = setInterval(() => {
          setTimerMs((ms) => {
            if (ms <= 1000) {
              if (ms > 0) {
                playBell(audioCtxRef);
              }
              setTimerRunning(false);
              return 0;
            }

            const newMs = ms - 1000;
            const initial = initialFightMsRef.current || 0;
            const halfMs = initial / 2;

            if (
              !halfPingDoneRef.current &&
              initial > 0 &&
              ms > halfMs &&
              newMs <= halfMs
            ) {
              const scores = sbComputedRef.current;
              if (scores) {
                const sides = ["blue", "green"];
                const allZero = sides.every((side) => {
                  const s = scores[side];
                  return (
                    s &&
                    s.H === 0 &&
                    s.YO === 0 &&
                    s.CH === 0 &&
                    s.penaltyLevel === 0
                  );
                });
                if (allZero) {
                  playHalfPing(audioCtxRef);
                  halfPingDoneRef.current = true;
                  setTimerRunning(false);
                }
              }
            }

            return newMs;
          });

        }

        function onKeyDown(e) {
          // Spacebar = Start / Stop timer from anywhere on the scoreboard screen.

          if (e.code !== "Space" && e.key !== " ") return;
          if (isEditableTarget(e.target) || isEditableTarget(document.activeElement)) return;
          e.preventDefault();
          e.stopPropagation();

            const ev = next[i];
            if (ev.side === side && ev.type === type) {
              next.splice(i, 1);
              break;
            }
          }
          return next;
        });
      }

      function handleScoreButton(side, type, isRightClick, canAdd, event) {
        if (event) event.preventDefault();

          removeLastEvent(side, type);

          if (!canAdd) return;
          addEvent(side, type);
        }
      }

      async function saveResultToBout(options) {
        options = options || {};
        if (!activeBoutNo || !schedule) return false;
        const scores = computeScores(sbEvents);
        const isTimeUp = timerMs === 0;
        const winnerSide = decideWinner(
          scores,
          isTimeUp || !!scores.halalWinner
        );
        if (!winnerSide) {
          showScoreSaveNotice("No clear winner yet. Complete scoring or wait for time-up before saving.");
          return false;
        }
        const durationMs = timerMs;

        setBoutMeta((prev) => ({
          ...prev,
          [activeBoutNo]: {
            events: sbEvents,
            durationSec: Math.floor(durationMs / 1000),
            winner: winnerSide
          }
        }));

        const bluePenalties = { T: 0, D: 0, G: 0 };
        const greenPenalties = { T: 0, D: 0, G: 0 };
        for (const ev of sbEvents) {
          if (ev.type === "T" || ev.type === "D" || ev.type === "G") {
            const obj = ev.side === "blue" ? bluePenalties : greenPenalties;
            obj[ev.type] += 1;
          }
        }

        const metaEvents = sbEvents.map((ev) => ({
          timeSec: Math.floor(ev.atMs / 1000),
          timeStr: formatTime(ev.atMs),
          type: ev.type,
          side: ev.side,
          text: (ev.side === "blue" ? "BLUE " : "GREEN ") + ev.type
        }));

        const payload = {
          winner: winnerSide,
          blueScore: {
            H: scores.blue.H,
            YO: scores.blue.YO,
            CH: scores.blue.CH
          },
          greenScore: {
            H: scores.green.H,
            YO: scores.green.YO,
            CH: scores.green.CH
          },
          bluePenalties,
          greenPenalties,
          meta: metaEvents,
          durationMs
        };

          if (!prev?.bouts) return prev;
          return {
            ...prev,
            updatedAt: new Date().toISOString(),
            bouts: prev.bouts.map((b) => Number(b.boutNo) === Number(activeBoutNo) ? { ...b, ...payload, finished: true, savedAt: new Date().toISOString() } : b)
          };
        });

        const result = await sendResultToServer(activeBoutNo, payload);
        if (result.ok === false) return false;

        setScoreboardDirty(false);
        showScoreSaveNotice((result.offline ? "Result saved locally" : "Result saved to server") + " for bout #" + activeBoutNo);
        return true;
      }


      async function saveWithdrawalResult(kind) {
        if (!activeBoutNo || !schedule) return;
        let winnerSide = null;
        let withdrawnSide = null;
        let resultType = "withdrawal";
        let noContest = false;
        if (kind === "blue") { withdrawnSide = "blue"; winnerSide = "green"; }
        else if (kind === "green") { withdrawnSide = "green"; winnerSide = "blue"; }
        else { resultType = "double_withdrawal"; noContest = true; }
        const durationMs = timerMs;
        const payload = {
          resultType,
          withdrawnSide,
          noContest,
          winner: winnerSide,
          resultWeight: resultType === "double_withdrawal" ? 0 : 1,
          blueScore: { H: 0, YO: 0, CH: 0 },
          greenScore: { H: 0, YO: 0, CH: 0 },
          bluePenalties: { T: 0, D: 0, G: 0 },
          greenPenalties: { T: 0, D: 0, G: 0 },
          meta: [{ timeSec: Math.floor(timerMs / 1000), timeStr: formatTime(timerMs), type: resultType, side: withdrawnSide || "both", text: resultType === "double_withdrawal" ? "DOUBLE WITHDRAWAL / NO CONTEST" : (withdrawnSide || "") + " WITHDRAWAL" }],
          durationMs
        };
        setBoutMeta((prev) => ({ ...prev, [activeBoutNo]: { events: [], durationSec: Math.floor(durationMs / 1000), winner: winnerSide, resultType, noContest } }));
        setSchedule((prev) => {
          if (!prev?.bouts) return prev;
          return { ...prev, bouts: prev.bouts.map((b) => b.boutNo === activeBoutNo ? { ...b, ...payload, finished: true, savedAt: new Date().toISOString() } : b) };
        });
        const result = await sendResultToServer(activeBoutNo, payload);
        setScoreboardDirty(false);
        setWithdrawalMsg(resultType === "double_withdrawal" ? "Double withdrawal saved: no winner / no contest." : "Withdrawal saved.");
        showScoreSaveNotice((result.ok === false ? "Withdrawal saved locally but server sync failed." : "Withdrawal saved to server."));
      }

      const bouts = schedule?.bouts || [];

      function goPrev() {
        if (!bouts.length) return;
        const target = currentIdx <= 0 ? bouts[0] : bouts[currentIdx - 1];
        if (!target) return;
        requestSelectBoutForScore(target.boutNo);
      }

      function goNext() {
        if (!bouts.length) return;
        const target =
          currentIdx === -1 || currentIdx >= bouts.length - 1
            ? bouts[bouts.length - 1]
            : bouts[currentIdx + 1];
        if (!target) return;
        requestSelectBoutForScore(target.boutNo);

        setTimerRunning(false);
        setScoreboardDirty(true);
        setTimerMs(nextMs);
        initialFightMsRef.current = nextMs;
        halfPingDoneRef.current = false;

        setTimerRunning((running) => !running);

                    Referees: not assigned for this bout.
                  </span>
                )}
              </div>
              <div className="text-slate-500">
                Standalone scoreboard v35.6.5 – open this file directly in your browser.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
